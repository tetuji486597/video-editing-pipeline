<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP32 payoff: waste, until it saves you</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* TRANSPARENT BAND, upper band, translucent chrome over hair/background only.
         Output 37.700-42.500 (PAYOFF 37.417-44.042). PAYOFF frame grid-measured (src
         144.0s at 1080x1920): hair top ~120, brow ~650 (zoom 1.08 about (540,720) ->
         ~644), face x 250-830. Everything ends by y=580 (+10 shadow) -> ~54px above the
         brow. Countdown reserve (x>=670, y<=330): max x here is 530 (+10 shadow).
         Margins: x 90-530, y 230-580 -- inside x 70-870 / y 200-1280.
         Resolved boxes: chips 90-~230 x 230-280; C1 90-290, C2 330-530 x 310-470 (40px
         gap); shield 250-370 x 300-440 (over the two cards' inner edges by design, no
         text there); status tile 90-530 x 500-580 (30px under the cards). */

      .chip {
        position: absolute; left: 90px; top: 230px; height: 50px; padding: 0 20px;
        display: flex; align-items: center; white-space: nowrap; border-radius: 12px;
        font-size: 28px; font-weight: 800; letter-spacing: 1px; opacity: 0;
        box-shadow: 0 6px 10px rgba(0, 0, 0, 0.35);
      }
      #waste { color: #cbd5e1; background: rgba(15, 20, 30, 0.72); border: 2px solid rgba(148, 163, 184, 0.55); }
      #saved { color: #6ee7b7; background: rgba(6, 30, 22, 0.8); border: 2px solid rgba(52, 211, 153, 0.8); }

      .copy {
        position: absolute; top: 310px; width: 200px; height: 160px; border-radius: 16px;
        background: linear-gradient(170deg, rgba(14, 18, 28, 0.66), rgba(8, 10, 16, 0.72));
        border: 2px solid rgba(148, 163, 184, 0.35);
        box-shadow: 0 8px 10px rgba(0, 0, 0, 0.4);
      }
      #c1 { left: 90px; opacity: 0.5; }
      #c2 { left: 330px; opacity: 0; }
      .copy .led { position: absolute; left: 18px; top: 18px; width: 14px; height: 14px; border-radius: 50%; background: #475569; }
      .copy .slot {
        position: absolute; left: 18px; width: 160px; height: 16px; border-radius: 6px;
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(148, 163, 184, 0.28);
      }
      .copy .slot .fl { position: absolute; left: 0; top: 0; height: 100%; width: 100%; border-radius: 6px; background: linear-gradient(90deg, rgba(34, 211, 238, 0.55), rgba(34, 211, 238, 0.2)); }
      .copy .s1 { top: 50px; } .copy .s2 { top: 78px; } .copy .s3 { top: 106px; } .copy .s4 { top: 134px; }
      .copy .idle { position: absolute; right: 16px; top: 14px; font-size: 16px; letter-spacing: 2px; color: rgba(148, 163, 184, 0.8); }

      #shield { position: absolute; left: 250px; top: 300px; width: 120px; height: 140px; opacity: 0; transform-origin: 50% 50%; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6)); }
      #shield svg { width: 100%; height: 100%; display: block; }

      /* the real status page, still green (callback to the hook) */
      #status {
        position: absolute; left: 90px; top: 500px; width: 440px; height: 80px; border-radius: 14px;
        background: rgba(10, 14, 22, 0.66); border: 2px solid rgba(52, 211, 153, 0.5);
        box-shadow: 0 8px 10px rgba(0, 0, 0, 0.4); overflow: hidden; opacity: 0;
      }
      #status img { position: absolute; left: 12px; top: 12px; width: 416px; height: 55px; border-radius: 6px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.8" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="4.8" data-track-index="1">
        <div class="chip" id="waste">waste?</div>
        <div class="chip" id="saved">saved you</div>

        <div class="copy" id="c1">
          <div class="led"></div><div class="idle mono">idle</div>
          <div class="slot s1"><div class="fl"></div></div><div class="slot s2"><div class="fl"></div></div>
          <div class="slot s3"><div class="fl"></div></div><div class="slot s4"><div class="fl"></div></div>
        </div>
        <div class="copy" id="c2">
          <div class="led"></div><div class="idle mono">idle</div>
          <div class="slot s1"><div class="fl"></div></div><div class="slot s2"><div class="fl"></div></div>
          <div class="slot s3"><div class="fl"></div></div><div class="slot s4"><div class="fl"></div></div>
        </div>

        <div id="shield">
          <svg viewBox="0 0 120 140">
            <path d="M60,6 L108,26 L108,66 C108,100 86,124 60,134 C34,124 12,100 12,66 L12,26 Z" fill="rgba(6,40,30,0.92)" stroke="#34d399" stroke-width="5" stroke-linejoin="round"/>
            <path d="M38,70 L54,86 L84,50" fill="none" stroke="#6ee7b7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div id="status"><img src="assets/gh_status_banner.png" alt="" /></div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Word landings (output - 37.700): looks 0.46, waste 0.92-1.20, until 1.24,
      // day 1.66-1.84, saves 2.16-2.40, you 2.46-2.82, Next 2.90, traffic cop 3.52-4.10.

      // ---------- ACT 1 (grey): two idle copies, doing nothing ----------
      tl.fromTo("#c1", { opacity: 0.5, y: 16 }, { opacity: 0.8, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#c2", { opacity: 0, y: 16 }, { opacity: 0.8, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.2);
      // a sleepy breath (odd yoyo repeats: 0.5 + 4*0.4 = 2.1, done before the turn)
      tl.fromTo("#c1", { opacity: 0.8 }, { opacity: 0.6, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 0.5);
      tl.fromTo("#c2", { opacity: 0.8 }, { opacity: 0.6, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 0.65);
      // "waste?" 0.92
      tl.fromTo("#waste", { opacity: 0, scale: 0.7, y: 0 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, 0.92);

      // ---------- TURN @2.16 ("saves you"): the copies wake up, the shield lands ----------
      tl.to("#waste", { opacity: 0, duration: 0.18, ease: "power2.out" }, 2.12);
      tl.to("#c1, #c2", { opacity: 1, borderColor: "rgba(52,211,153,0.9)", boxShadow: "0 8px 10px rgba(0,0,0,0.4), 0 0 14px rgba(52,211,153,0.35)", duration: 0.3, ease: "power2.out" }, 2.16);
      tl.to(".copy .led", { backgroundColor: "#34d399", boxShadow: "0 0 8px rgba(52,211,153,0.9)", duration: 0.2, ease: "power2.out", stagger: 0.08 }, 2.16);
      tl.to(".copy .idle", { opacity: 0, duration: 0.2, ease: "power2.out" }, 2.16);
      tl.to(".copy .slot .fl", { background: "linear-gradient(90deg, rgba(52,211,153,0.9), rgba(52,211,153,0.35))", duration: 0.35, ease: "power2.out" }, 2.2);
      tl.fromTo("#shield", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, 2.22);
      tl.fromTo("#saved", { opacity: 0, scale: 0.7, y: 0 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, 2.34);

      // ---------- ACT 2 (green): the users' page is still green ----------
      tl.fromTo("#status", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 2.7);
      // one calm shield breath (odd repeat: 3.2 + 2*0.5 = 4.2 < 4.5)
      tl.fromTo("#shield", { scale: 1 }, { scale: 1.06, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 3.2);

      // ---------- fade: finishes at EXACTLY 4.8 (4.5 + 0.3), zero buffer ----------
      ["#c1", "#c2", "#shield", "#saved", "#status"].forEach((s) => {
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 4.5);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
