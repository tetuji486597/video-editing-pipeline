<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP32 build: leader takes the writes, followers copy every change</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* MOTION GRAPHIC, upper band, translucent chrome over hair/background only.
         Output 15.900-23.000 (BUILD 15.417-23.208). BUILD frame grid-measured (src
         43.0s at 1080x1920): hair top ~130, brow ~670 (zoom 1.08 about (540,720) ->
         ~666), face x 240-840. Everything ends by y=600 (+~10px shadow) -> ~56px above
         the brow. Countdown reserve (x>=670, y<=330): max x here is 640 (+10 shadow).
         Margins: x 90-640, y 224-600 -- inside x 70-870 / y 200-1280.
         Resolved boxes: leader 90-300 x 335-525; crown 212-296 x 272-332; write chips
         104-188 x 236-270 rest, travelling to y 376 (over the leader's log BARS, never
         its label, which sits in the footer at y 490-520); FOLLOWERS kicker 430-640 x
         224-250; F1 430-640 x 262-420; F2 430-640 x 442-600; lines (300,430)->(430,341)
         and (300,430)->(430,521). Pairwise: crown bottom 332 vs leader top 335 (touch by
         design); chips x<=188 vs crown x>=212 (24px, both graphics, chips pass at y<=376);
         kicker bottom 250 vs F1 top 262 (12px, label above its own card); F1 bottom 420
         vs F2 top 442 (22px). */

      .node {
        position: absolute; width: 210px; border-radius: 16px;
        background: linear-gradient(170deg, rgba(14, 18, 28, 0.72), rgba(8, 10, 16, 0.78));
        border: 2px solid rgba(148, 163, 184, 0.4);
        box-shadow: 0 8px 10px rgba(0, 0, 0, 0.4);
      }
      #leader { left: 90px; top: 335px; height: 190px; opacity: 0.5; }
      #f1 { left: 430px; top: 262px; height: 158px; opacity: 0; }
      #f2 { left: 430px; top: 442px; height: 158px; opacity: 0; }
      .slot {
        position: absolute; left: 24px; width: 162px; height: 18px; border-radius: 6px;
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(148, 163, 184, 0.3);
      }
      .slot .fill { position: absolute; left: 0; top: 0; height: 100%; width: 100%; border-radius: 6px; opacity: 0; }
      #leader .slot .fill { background: linear-gradient(90deg, #fbbf24, rgba(245, 158, 11, 0.55)); }
      #f1 .slot .fill, #f2 .slot .fill { background: linear-gradient(90deg, #22d3ee, rgba(34, 211, 238, 0.5)); }
      #leader .slot { top: 20px; } #leader .s2 { top: 50px; } #leader .s3 { top: 80px; } #leader .s4 { top: 110px; }
      #f1 .slot, #f2 .slot { top: 18px; } #f1 .s2, #f2 .s2 { top: 46px; } #f1 .s3, #f2 .s3 { top: 74px; } #f1 .s4, #f2 .s4 { top: 102px; }
      .slot .fill.lit { opacity: 1; }
      #leader-label {
        position: absolute; left: 0; top: 155px; width: 206px; height: 30px; text-align: center;
        font-size: 22px; font-weight: 800; letter-spacing: 4px; color: #fbbf24; line-height: 30px;
        opacity: 0;
      }
      #followers-label {
        position: absolute; left: 430px; top: 224px; width: 210px; text-align: center;
        font-size: 22px; font-weight: 800; letter-spacing: 4px; color: #67e8f9; line-height: 26px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85); opacity: 0;
      }

      /* the crown pops on "leader" -- div wrapper with real size, CSS transform only */
      #crown { position: absolute; left: 212px; top: 272px; width: 84px; height: 60px; opacity: 0; transform-origin: 50% 100%; }
      #crown svg { width: 100%; height: 100%; display: block; }

      /* write chips fall into the leader from above (rest hidden at 104,236) */
      .write {
        position: absolute; left: 104px; top: 236px; width: 84px; height: 34px;
        border-radius: 8px; background: rgba(60, 40, 6, 0.9); border: 2px solid rgba(251, 191, 36, 0.85);
        color: #fde68a; font-size: 18px; letter-spacing: 1px; line-height: 30px; text-align: center;
        opacity: 0;
      }

      /* replication lines + packets */
      #lines { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      .line { fill: none; stroke: rgba(34, 211, 238, 0.7); stroke-width: 4; stroke-linecap: round; }
      .pkt {
        position: absolute; left: 0; top: 0; width: 14px; height: 14px; border-radius: 50%;
        background: #22d3ee; box-shadow: 0 0 10px 3px rgba(34, 211, 238, 0.7); opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.1" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="7.1" data-track-index="1">
        <svg id="lines" viewBox="0 0 1080 1920">
          <path class="line" id="l1" d="M300,430 L430,341" />
          <path class="line" id="l2" d="M300,430 L430,521" />
        </svg>

        <div class="node" id="leader">
          <div class="slot s1"><div class="fill lit"></div></div>
          <div class="slot s2"><div class="fill" id="ls2"></div></div>
          <div class="slot s3"><div class="fill" id="ls3"></div></div>
          <div class="slot s4"><div class="fill" id="ls4"></div></div>
          <div id="leader-label">LEADER</div>
        </div>
        <div id="crown">
          <svg viewBox="0 0 84 60">
            <path d="M6,52 L6,18 L24,34 L42,6 L60,34 L78,18 L78,52 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="6" cy="16" r="5" fill="#fde68a"/><circle cx="42" cy="6" r="5" fill="#fde68a"/><circle cx="78" cy="16" r="5" fill="#fde68a"/>
          </svg>
        </div>
        <div class="write mono" id="w1">write</div>
        <div class="write mono" id="w2">write</div>
        <div class="write mono" id="w3">write</div>

        <div id="followers-label">FOLLOWERS</div>
        <div class="node" id="f1">
          <div class="slot s1"><div class="fill lit"></div></div>
          <div class="slot s2"><div class="fill" id="f1s2"></div></div>
          <div class="slot s3"><div class="fill" id="f1s3"></div></div>
          <div class="slot s4"><div class="fill" id="f1s4"></div></div>
        </div>
        <div class="node" id="f2">
          <div class="slot s1"><div class="fill lit"></div></div>
          <div class="slot s2"><div class="fill" id="f2s2"></div></div>
          <div class="slot s3"><div class="fill" id="f2s3"></div></div>
          <div class="slot s4"><div class="fill" id="f2s4"></div></div>
        </div>

        <div class="pkt" id="pa1"></div><div class="pkt" id="pa2"></div>
        <div class="pkt" id="pb1"></div><div class="pkt" id="pb2"></div>
        <div class="pkt" id="pc1"></div><div class="pkt" id="pc2"></div>
        <div class="pkt" id="pd1"></div><div class="pkt" id="pd2"></div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Word landings (output - 15.900): replicate 0.18-0.60, live 0.84, copies 1.08-1.38,
      // several 2.14, machines 2.45-2.94, One 3.40, leader 3.80-4.12, takes 4.30,
      // writes 4.72-5.30, followers 5.58-6.12, copy 6.18-6.48, every 6.54, change 6.78-7.12.

      // deterministic line-draw setup
      ["l1", "l2"].forEach((id) => {
        const el = document.getElementById(id);
        const len = el.getTotalLength();
        el.style.strokeDasharray = String(len);
        el.style.strokeDashoffset = String(len);
      });

      // ---------- ACT 1 (cyan): replicate -- live copies on several machines ----------
      tl.fromTo("#leader", { opacity: 0.5, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      // "live copies" 0.84-1.38: the two followers rise in, staggered (no x slide: a +40 x start put F1 at x 674 inside the countdown reserve for one frame)
      tl.fromTo("#f1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 0.85);
      tl.fromTo("#f2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 1.45);
      // lines draw
      tl.to("#l1", { strokeDashoffset: 0, duration: 0.45, ease: "power3.out" }, 1.35);
      tl.to("#l2", { strokeDashoffset: 0, duration: 0.45, ease: "power3.out" }, 1.95);
      // ambient stream of copies along both lines ("several machines" 2.14-2.94);
      // repeats end 2.2 + 4*0.5 = 4.2 and 2.45 + 4*0.5 = 4.45 (long before the fade)
      const A = [293, 423], B1 = [423, 334], B2 = [423, 514];
      function stream(sel, to, t0, rep) {
        tl.fromTo(sel, { x: A[0], y: A[1], opacity: 0 },
          { x: to[0], y: to[1], opacity: 1, duration: 0.5, ease: "power1.inOut", repeat: rep, immediateRender: false }, t0);
      }
      stream("#pa1", B1, 2.2, 3);
      stream("#pa2", B2, 2.45, 3);

      // ---------- TURN @3.8 ("leader"): the crown pops, the leader is named ----------
      tl.fromTo("#crown", { opacity: 0, scale: 0.4, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 3.8);
      tl.fromTo("#leader-label", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.95);
      tl.to("#leader", { borderColor: "rgba(251,191,36,0.9)", boxShadow: "0 8px 10px rgba(0,0,0,0.4), 0 0 12px rgba(251,191,36,0.35)", duration: 0.35, ease: "power2.out" }, 3.85);

      // ---------- ACT 2 (amber -> cyan): writes land on the leader, followers copy each one ----------
      // a write chip falls into the leader, the next log slot lights; 0.45s later the copy
      // packets reach both followers and the same slot lights there.
      function write(sel, t, leaderSlot, fSlot, p1, p2) {
        tl.fromTo(sel, { opacity: 0, y: 0, x: 0 }, { opacity: 1, y: 60, x: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, t);
        tl.to(sel, { y: 140, opacity: 0, duration: 0.3, ease: "power2.in" }, t + 0.25);
        tl.fromTo(leaderSlot, { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.25, ease: "power3.out", immediateRender: false, transformOrigin: "0% 50%" }, t + 0.5);
        tl.fromTo(p1, { x: A[0], y: A[1], opacity: 0 }, { x: B1[0], y: B1[1], opacity: 1, duration: 0.45, ease: "power1.inOut", immediateRender: false }, t + 0.6);
        tl.fromTo(p2, { x: A[0], y: A[1], opacity: 0 }, { x: B2[0], y: B2[1], opacity: 1, duration: 0.45, ease: "power1.inOut", immediateRender: false }, t + 0.66);
        tl.to(p1, { opacity: 0, duration: 0.12, ease: "power2.out" }, t + 1.05);
        tl.to(p2, { opacity: 0, duration: 0.12, ease: "power2.out" }, t + 1.11);
        tl.fromTo("#f1" + fSlot, { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.25, ease: "power3.out", immediateRender: false, transformOrigin: "0% 50%" }, t + 1.05);
        tl.fromTo("#f2" + fSlot, { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.25, ease: "power3.out", immediateRender: false, transformOrigin: "0% 50%" }, t + 1.11);
      }
      // "takes the writes" 4.30-5.30
      write("#w1", 4.3, "#ls2", "s2", "#pb1", "#pb2");
      write("#w2", 4.75, "#ls3", "s3", "#pc1", "#pc2");
      write("#w3", 5.2, "#ls4", "s4", "#pd1", "#pd2");
      // "followers" 5.58: the column is named
      tl.fromTo("#followers-label", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 5.6);
      // "copy every change" 6.18-7.12: both followers pulse in sync with the leader
      // (odd yoyo repeat: 6.2 + 2*0.28 = 6.76, done before the 6.8 fade)
      ["#f1", "#f2"].forEach((s) => {
        tl.fromTo(s, { borderColor: "rgba(148,163,184,0.4)" },
          { borderColor: "rgba(34,211,238,0.95)", duration: 0.28, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 6.2);
      });

      // ---------- fade: finishes at EXACTLY 7.1 (6.8 + 0.3), zero buffer ----------
      ["#leader", "#f1", "#f2", "#crown", "#followers-label", "#lines"].forEach((s) => {
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 6.8);
      });
      ["#pa1", "#pa2", "#pb1", "#pb2", "#pc1", "#pc2", "#pd1", "#pd2", "#w1", "#w2", "#w3"].forEach((s) => {
        tl.to(s, { opacity: 0, duration: 0.3, ease: "power2.out" }, 6.8);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
