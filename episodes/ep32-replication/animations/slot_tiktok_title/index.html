<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP32 TikTok-style Title Box (intro sticker)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;   /* never a takeover -- the presenter stays visible */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* TikTok's native text sticker: each WRAPPED LINE is its own white rounded box,
         centred on x=540 (EP20-26 directive), matching ep29's slot_tiktok_title.
         Recorded intro (transcripts/ep32.json 8.14-10.12): "Explaining replication in
         30 seconds." -> EPISODE 32 / EXPLAINING / REPLICATION / IN 30 SECONDS.
         Widths at Inter 800 48px (~0.66em/char = 31.7px): "IN 30 SECONDS" 13 ch ~412 +
         52 padding = ~464px -> x 308..772; "REPLICATION" ~401px; every box far under the
         660 cap and inside x 70-870 even at the 1.01 drift.
         Vertical: EPISODE box 36 + 16 + 18 = 70; three 48px boxes at 48 + 20 + 22 = 90;
         70 + 3*90 + 3*12 = 376 -> y 210..586 (x1.01 drift about the top -> 590).
         INTRO frame grid-measured (src 9.2s at 1080x1920): hair top ~70, brow ~640,
         eyes ~730; the zoom 1.0->1.08 about (540,720) moves the brow to ~634. The stack
         sits over hair/forehead only and clears the brow by ~44px. */
      #stack {
        position: absolute;
        left: 0;
        right: 0;
        margin: 0 auto;
        top: 210px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        /* Frame-0 state from CSS -- tl.set() at position 0 never fires. */
        opacity: 0.6;
        transform: scale(0.94);
        transform-origin: 50% 0%;
      }
      .tt-line {
        background: #ffffff;
        color: #111111;
        font-size: 48px;
        line-height: 48px;
        font-weight: 800;
        letter-spacing: -1px;
        padding: 20px 26px 22px 26px;
        border-radius: 16px;
        white-space: nowrap;
        /* soft shadow only; reach 1.6*16 = ~26px, far inside every band */
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.22);
      }
      .tt-line.ep {
        font-size: 36px;
        line-height: 36px;
        padding: 16px 22px 18px 22px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2.3333"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="2.3333"
        data-track-index="1"
      >
        <div id="stack">
          <div class="tt-line ep">EPISODE 32</div>
          <div class="tt-line">EXPLAINING</div>
          <div class="tt-line">REPLICATION</div>
          <div class="tt-line">IN 30 SECONDS</div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // The four lines are ONE sticker -- they land together.
      tl.fromTo(
        "#stack",
        { opacity: 0.6, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" },
        0
      );

      // Imperceptible drift so the motion linter's seek check advances. fromTo, not
      // .to(), to avoid gsap_css_transform_conflict with the CSS transform.
      // 0.28 + 1.7733 = 2.0533 (ends before the fade starts).
      tl.fromTo(
        "#stack",
        { scale: 1 },
        { scale: 1.01, duration: 1.7733, ease: "none", immediateRender: false },
        0.28
      );

      // Fade FINISHES at exactly data-duration, zero buffer: 2.0533 + 0.28 = 2.3333
      // (= the INTRO window end, so the HOOK cut is clean).
      tl.fromTo(
        "#stack",
        { opacity: 1 },
        { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false },
        2.0533
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
