<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>problem</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: "Helvetica Neue", -apple-system, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* full-screen opaque takeover: real traffic photo replaces the talking-head shot entirely */
      #bg-photo {
        position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; opacity: 0;
      }
      #bg-photo img {
        position: absolute; left: 50%; top: 46%; width: 1550px; height: auto;
        transform: translate(-50%, -50%) scale(1.0);
      }
      #scrim {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: linear-gradient(180deg, rgba(10,10,14,0.72) 0%, rgba(10,10,14,0.40) 24%, rgba(10,10,14,0.55) 62%, rgba(10,10,14,0.95) 100%);
      }

      #content { position: absolute; left: 60px; top: 130px; width: 960px; }
      #accent-bar {
        position: absolute; left: 0; top: 8px; width: 10px; height: 820px;
        background: #f87171; border-radius: 5px;
        box-shadow: 0 0 28px 5px rgba(248,113,113,0.9), 0 0 70px 12px rgba(248,113,113,0.45);
        opacity: 0; transform-origin: top;
      }
      #inner { margin-left: 48px; }
      .line {
        display: block; font-size: 48px; font-weight: 800; color: #ffffff;
        letter-spacing: 0.5px; text-transform: uppercase; line-height: 1.2;
        text-shadow: 0 3px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.95);
        opacity: 0; transform: translateY(30px); margin-bottom: 40px;
      }
      #scan-list { display: flex; flex-direction: column; gap: 10px; width: 620px; }
      .srow {
        display: flex; align-items: center; gap: 14px;
        background: rgba(12,12,16,0.82); border: 1px solid rgba(255,255,255,0.16);
        border-radius: 10px; padding: 12px 18px;
      }
      .dot { width: 16px; height: 16px; border-radius: 50%; background: #64748b; flex-shrink: 0; }
      .srow-label { font-size: 24px; color: #f1f5f9; font-weight: 700; letter-spacing: 0.3px; }
      #counter-block { margin-top: 48px; }
      #counter-label {
        font-size: 26px; font-weight: 700; color: #ffd7d7; letter-spacing: 2px;
        text-transform: uppercase; margin-bottom: 10px; opacity: 0;
      }
      #counter-num {
        font-size: 140px; font-weight: 800; color: #ffffff; line-height: 1;
        text-shadow: 0 0 40px rgba(248,113,113,0.8), 0 4px 18px rgba(0,0,0,0.95);
        font-variant-numeric: tabular-nums;
      }
      #counter-sub { font-size: 24px; font-weight: 600; color: #e2e8f0; margin-top: 12px; opacity: 0; }
      .emph {
        display: block; margin-top: 46px; font-size: 108px; font-weight: 800; color: #f87171;
        letter-spacing: 0.5px; text-transform: uppercase; line-height: 1.0;
        text-shadow: 0 0 40px rgba(248,113,113,0.9), 0 4px 16px rgba(0,0,0,0.95);
        opacity: 0;
      }
      #photo-credit {
        position: absolute; left: 60px; top: 1850px; font-size: 18px; font-weight: 600;
        color: rgba(255,255,255,0.55); letter-spacing: 1px; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.35" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="11.35" data-track-index="1">
        <div id="bg-photo"><img src="assets/traffic.jpg" alt="" /></div>
        <div id="scrim"></div>
        <div id="content">
          <div id="accent-bar"></div>
          <div id="inner">
            <div class="line" id="l1">CHECK EVERY DRIVER. SORT THEM ALL.</div>
            <div id="scan-list">
              <div class="srow" id="row1"><div class="dot"></div><div class="srow-label">DRIVER #1 — 4.2mi</div></div>
              <div class="srow" id="row2"><div class="dot"></div><div class="srow-label">DRIVER #2 — 1.8mi</div></div>
              <div class="srow" id="row3"><div class="dot"></div><div class="srow-label">DRIVER #3 — 6.1mi</div></div>
              <div class="srow" id="row4"><div class="dot"></div><div class="srow-label">... 49,997 MORE</div></div>
            </div>
            <div id="counter-block">
              <div id="counter-label">Checked so far</div>
              <div id="counter-num">0</div>
              <div id="counter-sub">every one. every second.</div>
            </div>
            <div class="emph" id="e1">DOESN'T SCALE.</div>
          </div>
        </div>
        <div id="photo-credit">real Miami rush-hour traffic, I-95 &middot; not a stock icon</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const counter = { val: 0 };
      const counterEl = document.getElementById("counter-num");

      tl.fromTo("#bg-photo", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.0)
        .to("#bg-photo img", { scale: 1.08, duration: 11.0, ease: "none" }, 0.0)
        .to("#accent-bar", { opacity: 1, scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.3)
        .to("#l1", { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.45)
        .to("#photo-credit", { opacity: 1, duration: 0.4 }, 0.6)
        .to("#counter-label", { opacity: 1, duration: 0.3 }, 0.8)
        .to("#counter-sub", { opacity: 1, duration: 0.3 }, 0.8)
        .to(".dot", {
          backgroundColor: "#f87171", duration: 0.3, stagger: 0.22, repeat: 7, yoyo: true, ease: "power1.inOut",
        }, 0.9)
        .to(counter, {
          val: 50000, duration: 7.6, ease: "power1.inOut",
          onUpdate: () => { counterEl.textContent = Math.round(counter.val).toLocaleString(); }
        }, 0.9)
        .fromTo("#e1", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 8.8)
        .to(["#accent-bar", "#content", "#bg-photo", "#scrim", "#photo-credit"], { opacity: 0, duration: 0.35, ease: "power1.in" }, 11.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
