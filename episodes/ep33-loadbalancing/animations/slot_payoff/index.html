<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP33 payoff — fifty ordinary servers, one smart doorman</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* CORNER CARD, upper-left, over live footage. PAYOFF frame grid-measured
         (src 124.8s at 1080x1920): hair top ~80, brow ~645, face x 240-840.
         Zoom 1.08->1.0 about (540,720): brow worst ~640. Card x 70-620, y 215-600
         (+10px shadow -> 610, 30px above the brow); translucent fill (rule 11) since
         it sits over hair. Drift 1 -> 1.01 about (345,400): x 620 -> 622.8, y 215 -> 213.
         COUNTDOWN RESERVE (x>=670, y<=330): nothing right of x=623. No tease chip. */
      #wrap { position: absolute; inset: 0; transform-origin: 345px 400px; }
      #card {
        position: absolute; left: 70px; top: 215px; width: 550px; height: 385px; border-radius: 22px;
        background: linear-gradient(165deg, rgba(13, 18, 28, 0.62), rgba(7, 10, 16, 0.70));
        border: 2px solid rgba(148, 163, 184, 0.4);
        box-shadow: 0 6px 10px rgba(0, 0, 0, 0.5);
        opacity: 0.5;
      }
      .lbl {
        position: absolute; font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: 2px;
        white-space: nowrap; opacity: 0; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      }
      #lbl-a { left: 98px; top: 236px; color: #cbd5e1; }
      #lbl-b { left: 190px; top: 506px; color: #a5f3fc; }

      #grid { position: absolute; left: 98px; top: 284px; width: 472px; height: 170px; }
      .box {
        position: absolute; width: 40px; height: 26px; border-radius: 6px;
        background: linear-gradient(170deg, #1b2230, #0e131c);
        border: 2px solid rgba(148, 163, 184, 0.5); opacity: 0;
      }
      .box i { position: absolute; left: 6px; top: 6px; width: 20px; height: 3px; border-radius: 2px; background: rgba(148, 163, 184, 0.35); }
      .box i.b { top: 13px; width: 14px; }
      .box b { position: absolute; right: 5px; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: rgba(148, 163, 184, 0.5); }
      .box .lit {
        position: absolute; inset: -2px; border-radius: 6px;
        border: 2px solid rgba(52, 211, 153, 0.95); box-shadow: 0 0 10px rgba(52, 211, 153, 0.6); opacity: 0;
      }

      #doorman { position: absolute; left: 104px; top: 478px; width: 72px; height: 84px; opacity: 0; }
      #doorman svg { width: 72px; height: 84px; overflow: visible; }
      #door-glow {
        position: absolute; left: 80px; top: 460px; width: 120px; height: 120px; border-radius: 50%;
        background: radial-gradient(circle, rgba(165, 243, 252, 0.7) 0%, rgba(34, 211, 238, 0.25) 40%, rgba(34, 211, 238, 0) 65%);
        opacity: 0;
      }
      .req {
        position: absolute; left: 0; top: 0; width: 12px; height: 12px; border-radius: 50%;
        background: #a5f3fc; box-shadow: 0 0 8px rgba(34, 211, 238, 0.85); opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.2" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="5.2" data-track-index="1">
        <div id="wrap">
          <div id="card"></div>
          <div id="lbl-a" class="lbl">50 ORDINARY SERVERS</div>
          <div id="grid"></div>
          <div id="door-glow"></div>
          <div id="doorman">
            <svg viewBox="0 0 72 84" fill="none">
              <rect x="14" y="6" width="44" height="44" rx="9" transform="rotate(45 36 28)" fill="url(#dg)" stroke="#cffafe" stroke-width="3"/>
              <rect x="24" y="26" width="24" height="4" rx="2" fill="#ecfeff"/>
              <path d="M12 60 L34 68 L12 76 Z" fill="#f472b6" stroke="#fbcfe8" stroke-width="2" stroke-linejoin="round"/>
              <path d="M60 60 L38 68 L60 76 Z" fill="#f472b6" stroke="#fbcfe8" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="36" cy="68" r="4" fill="#fbcfe8"/>
              <defs>
                <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div id="lbl-b" class="lbl">ONE SMART DOORMAN</div>
          <div id="reqs"></div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const D = 5.2, FADE_AT = 4.9;

      // ---------- the fifty (10 x 5, box 40x26, pitch 48 x 36 -> x 98-570, y 284-454) ----------
      const gridEl = document.getElementById("grid");
      for (let r = 0; r < 5; r++) for (let c = 0; c < 10; c++) {
        const d = document.createElement("div");
        d.className = "box"; d.id = "bx" + (r * 10 + c);
        d.style.left = (c * 48) + "px"; d.style.top = (r * 36) + "px";
        d.innerHTML = '<i></i><i class="b"></i><b></b><div class="lit"></div>';
        gridEl.appendChild(d);
      }
      // requests through the doorman into the grid: [spawn, target cell, target x, target y]
      const cellXY = (idx) => [98 + (idx % 10) * 48 + 14, 284 + Math.floor(idx / 10) * 36 + 7];
      const reqs = [
        { t: 3.15, cell: 23 }, { t: 3.5, cell: 47 }, { t: 3.85, cell: 5 }, { t: 4.2, cell: 31 },
      ];
      const reqEl = document.getElementById("reqs");
      reqs.forEach((r, i) => { const d = document.createElement("div"); d.className = "req"; d.id = "rq" + i; reqEl.appendChild(d); });

      // ambient drift under everything
      tl.fromTo("#wrap", { scale: 1 }, { scale: 1.01, duration: D, ease: "sine.inOut" }, 0);

      // ---------- entrance at t=0 (card at 0.5 from CSS) ----------
      tl.fromTo("#card", { opacity: 0.5, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);

      // ---------- ACT 1: "50 ordinary servers" (1.0-2.06): label, then the grid fills ----------
      tl.fromTo("#lbl-a", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.95);
      for (let i = 0; i < 50; i++) {
        const r = Math.floor(i / 10), c = i % 10;
        tl.fromTo("#bx" + i, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(1.6)", immediateRender: false }, 1.05 + r * 0.12 + c * 0.03);
      }

      // ---------- TURN @2.3 ("one smart doorman"): the doorman steps out front ----------
      tl.fromTo("#door-glow", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.2, duration: 0.14, ease: "power3.out", immediateRender: false }, 2.3);
      tl.to("#door-glow", { opacity: 0, scale: 1.5, duration: 0.4, ease: "power2.out" }, 2.44);
      tl.fromTo("#doorman", { opacity: 0, scale: 0.3, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, 2.3);
      tl.fromTo("#lbl-b", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 2.45);

      // ---------- ACT 2 ("out front" 3.14+): requests pass the doorman, each lands on a different box ----------
      reqs.forEach((r, i) => {
        const sel = "#rq" + i, [tx, ty] = cellXY(r.cell);
        tl.fromTo(sel, { x: 92, y: 514, opacity: 0 }, { x: 92, y: 514, opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, r.t);
        tl.to(sel, { x: 134, y: 514, duration: 0.22, ease: "power2.inOut" }, r.t);
        tl.to(sel, { x: tx, y: ty, duration: 0.32, ease: "power2.inOut" }, r.t + 0.24);
        tl.to(sel, { opacity: 0, duration: 0.08, ease: "power2.out" }, r.t + 0.56);
        tl.fromTo("#doorman", { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, r.t + 0.2);
        tl.fromTo("#bx" + r.cell + " .lit", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, r.t + 0.54);
        tl.to("#bx" + r.cell + " b", { backgroundColor: "#34d399", duration: 0.2, ease: "power2.out" }, r.t + 0.54);
      });

      // ---------- fade: finishes at EXACTLY 5.2 (4.9 + 0.3), zero buffer ----------
      tl.fromTo("#wrap", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, FADE_AT);
      const leaves = ["#card", "#lbl-a", "#lbl-b", "#doorman", "#door-glow"];
      for (let i = 0; i < 50; i++) leaves.push("#bx" + i);
      reqs.forEach((r, i) => leaves.push("#rq" + i));
      leaves.forEach((s) => { tl.to(s, { opacity: 0, duration: 0.3, ease: "power2.out" }, FADE_AT); });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
