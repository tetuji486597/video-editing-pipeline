<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP33 TikTok-style Title Box (intro)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;   /* never a takeover -- the presenter stays visible */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* TikTok's native text sticker: each WRAPPED LINE is its own white rounded box,
         the whole stack centred on x=540 (EP20-26 directive), every box <= 660px.
         Recorded intro (transcript, INTRO range): "Explaining load balancers in 30
         seconds." -> EPISODE 33 / EXPLAINING / LOAD BALANCERS / IN 30 SECONDS.
         Widest line "LOAD BALANCERS" = 14 chars at Inter 800 48px (~31.7px/char)
         -> ~444px text + 52px padding = ~496px box (x 292..788), far under 660.
         Vertical: EPISODE box 36+42 = 78, three 48px boxes 48+42 = 90 each,
         3 gaps x 12 = 36 -> 384px: y 210..594 (x1.01 drift about the top edge -> 598).
         INTRO frame grid-measured (src 2.2s at 1080x1920): hair top ~90, brow ~650,
         zoom 1.0->1.08 about (540,720) moves the brow to ~644. Stack sits over hair
         and forehead only, clears the brow by ~46px. Shadow reach 1.6*16 = 26px. */
      #stack {
        position: absolute;
        left: 0;
        right: 0;
        margin: 0 auto;
        top: 210px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        /* Frame-0 state from CSS -- tl.set() at position 0 never fires. */
        opacity: 0.6;
        transform: scale(0.94);
        transform-origin: 50% 0%;
      }
      .tt-line {
        background: #ffffff;
        color: #111111;
        font-size: 48px;
        line-height: 48px;
        font-weight: 800;
        letter-spacing: -1px;
        padding: 20px 26px 22px 26px;
        border-radius: 16px;
        white-space: nowrap;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.22);
      }
      .tt-line.ep {
        font-size: 36px;
        line-height: 36px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2.5"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="2.5"
        data-track-index="1"
      >
        <div id="stack">
          <div class="tt-line ep">EPISODE 33</div>
          <div class="tt-line">EXPLAINING</div>
          <div class="tt-line">LOAD BALANCERS</div>
          <div class="tt-line">IN 30 SECONDS</div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // The four lines are ONE sticker -- they land together.
      tl.fromTo(
        "#stack",
        { opacity: 0.6, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" },
        0
      );

      // Imperceptible drift so the motion linter's seek check advances. fromTo, not
      // .to(), to avoid gsap_css_transform_conflict with the CSS transform.
      tl.fromTo(
        "#stack",
        { scale: 1 },
        { scale: 1.01, duration: 1.94, ease: "none", immediateRender: false },
        0.28
      );

      // Fade FINISHES at exactly data-duration, zero buffer: 2.22 + 0.28 = 2.500
      // (= the INTRO window end, so the HOOK cut is clean).
      tl.fromTo(
        "#stack",
        { opacity: 1 },
        { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false },
        2.22
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
