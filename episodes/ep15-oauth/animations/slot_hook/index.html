<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP15 Hook — Sign in with Google</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      body { font-family: Inter, sans-serif; }

      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      #fade-wrap { position: absolute; inset: 0; }

      /* ------------------------------------------------------------------
         HALF-SCREEN PANEL. No #bg-fill — the live footage stays visible.
         #pad is a soft DARK radial that seats the light card; it is dark on
         purpose (OVERLAY_SPEC trap 5 bans a light wash near the captions).
         Box x 40..1040, y 866..1266 — inside the 180..1280 band, and it is
         deliberately kept OUT of #card-push so the push-in cannot grow it.
         ------------------------------------------------------------------ */
      #pad {
        position: absolute;
        left: 40px;
        top: 866px;
        width: 1000px;
        height: 400px;
        background: radial-gradient(
          ellipse 500px 200px at 50% 50%,
          rgba(8, 6, 18, 0.62) 0%,
          rgba(8, 6, 18, 0.42) 52%,
          rgba(8, 6, 18, 0) 100%
        );
        opacity: 0.55; /* frame-0 state from CSS, never a tl.set at 0 */
        pointer-events: none;
      }

      /* Slow camera push-in. transform-origin is the CARD's own centre
         (540px, 1078px) so the composed bounds stay inside the band —
         arithmetic in the report. */
      #card-push {
        position: absolute;
        inset: 0;
        transform-origin: 540px 1082px;
      }

      /* ---------------- redirect chip (the TURN) ---------------- */
      #chip {
        position: absolute;
        left: 750px;
        top: 786px;
        width: 300px;
        height: 60px;
        border-radius: 14px;
        background: rgba(11, 13, 22, 0.92);
        border: 1px solid rgba(167, 139, 250, 0.55);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        opacity: 0;
      }
      #chip-dot {
        width: 10px;
        height: 10px;
        border-radius: 5px;
        background: #a78bfa;
        flex-shrink: 0;
      }
      #chip-url {
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 21px;
        letter-spacing: 0.2px;
        color: #e9e3ff;
        white-space: nowrap;
      }

      /* ---------------- the login card ---------------- */
      #card-wrap {
        position: absolute;
        left: 110px;
        top: 920px;
        width: 860px;
        height: 324px;                 /* x 110..970, y 920..1244 */
        opacity: 0.55;                 /* primary entrance: NOT 0 on frame 0 */
        transform: translateY(22px) scale(0.955);
      }
      /* Two glow layers crossfade violet -> green to carry the turn.
         OVERLAY_SPEC trap 6, refined by measurement on THIS render: a CSS
         box-shadow's Gaussian tail carries ~1.6x the blur radius past the
         edge, not 1.0x. A first pass with `0 0 46px -24px` on the card's own
         box put alpha 4/255 as low as y=1296 and breached the limit.
         Fix: the glow box stops 40px SHORT of the card's bottom, so
         bottom edge 1204 -> x1.018 push-in = 1206.2, tail 1.6*46-20 = 53.6
         -> 54.6 -> reaches y=1260.8. Clear of 1280 by 19px. */
      #glow-violet, #glow-green {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 40px;
        border-radius: 26px;
        pointer-events: none;
      }
      #glow-violet { box-shadow: 0 0 46px -20px rgba(167, 139, 250, 0.98); opacity: 1; }
      #glow-green  { box-shadow: 0 0 46px -20px rgba(52, 211, 153, 0.98);  opacity: 0; }

      #card {
        position: absolute;
        inset: 0;
        border-radius: 24px;
        background: #ffffff;
        border: 1.5px solid rgba(15, 23, 42, 0.12);
        /* Gaussian tail = 6 (offsetY) + 1.6*16 (blur) - 10 (spread) = 21.6px,
           x1.018 = 22.0 -> bottom reaches y=1268.9. Clear of 1280 by 11px. */
        box-shadow: 0 6px 16px -10px rgba(0, 0, 0, 0.95);
        padding: 22px 80px;            /* content column 697px, x 191.5..888.5 */
        overflow: hidden;
      }

      #card-head {
        height: 34px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #app-mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: linear-gradient(150deg, #a78bfa, #6d5bd6);
        flex-shrink: 0;
      }
      #card-title {
        font-size: 32px;
        line-height: 34px;
        font-weight: 700;
        color: #131820;
        letter-spacing: -0.3px;
      }

      /* REAL IMAGE slot — the "Continue with Google" button is real pixels
         from a real, logged-out login page (source in the report). */
      #pill-slot {
        position: relative;
        margin-top: 18px;
        width: 100%;
        height: 98px;
      }
      #pill-img { display: block; width: 100%; height: 98px; }
      #pill-ring {
        position: absolute;
        inset: -8px;
        border-radius: 58px;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.6),
                    0 0 26px 2px rgba(96, 165, 250, 0.55);
        opacity: 0;
        pointer-events: none;
      }
      #ripple {
        position: absolute;
        inset: 0;
        border-radius: 50px;
        border: 3px solid rgba(59, 130, 246, 0.65);
        opacity: 0;
        pointer-events: none;
      }
      /* ACT 2 — the app door opens: a green admit bar wipes open from the
         centre, in the exact box the Google button occupied. */
      #admit-bar {
        position: absolute;
        inset: 0;
        border-radius: 50px;
        background: linear-gradient(180deg, #24c76a, #14a054);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: scaleX(0);
        transform-origin: 50% 50%;
      }
      #admit-glow {
        position: absolute;
        inset: -4px;
        border-radius: 54px;
        box-shadow: 0 0 40px -6px rgba(34, 197, 94, 0.75);
        opacity: 0.85;
        pointer-events: none;
      }

      .field {
        width: 100%;
        height: 46px;
        border-radius: 12px;
        background: #f5f7fa;
        border: 1.5px solid #dfe4ec;
        display: flex;
        align-items: center;
        padding: 0 22px;
        font-size: 26px;
        color: #5f6773;
      }
      #email-field { margin-top: 16px; }

      #pw-row {
        position: relative;
        margin-top: 12px;
        width: 100%;
        height: 46px;
      }
      #pw-field { position: absolute; inset: 0; }
      #strike {
        position: absolute;
        left: 22px;
        top: 21px;
        width: 400px;
        height: 4px;
        border-radius: 2px;
        background: #ef4444;
        transform: scaleX(0);
        transform-origin: 0% 50%;
      }
      #badge {
        position: absolute;
        left: 430px;               /* -> canvas x 621.5..879.5 */
        top: 2px;                  /* -> canvas y 1169.5..1211.5 */
        width: 258px;
        height: 42px;
        border-radius: 10px;
        background: #12a054;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 1.2px;
        color: #ffffff;
        opacity: 0;
        transform: scale(0.84);
      }

      /* transition sweep — a green light passing across the white card */
      #sweep-wrap {
        position: absolute;
        inset: 0;
        transform: skewX(-16deg);
        pointer-events: none;
      }
      #sweep {
        position: absolute;
        left: 0;
        top: 0;
        width: 200px;
        height: 100%;
        background: linear-gradient(
          90deg,
          rgba(52, 211, 153, 0) 0%,
          rgba(52, 211, 153, 0.45) 50%,
          rgba(52, 211, 153, 0) 100%
        );
        opacity: 0;
        transform: translateX(-320px);
      }

      /* deterministic static grain (fixed seed) to break the flat white */
      #grain {
        position: absolute;
        inset: 0;
        opacity: 0.05;
        pointer-events: none;
        mix-blend-mode: multiply;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.9"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="5.9"
        data-track-index="1"
      >
        <div id="fade-wrap">
          <div id="pad"></div>

          <div id="card-push">
            <!-- TURN: redirect chip. Visible 2.48-3.52 only. -->
            <div id="chip">
              <div id="chip-dot"></div>
              <div id="chip-url">accounts.google.com</div>
            </div>

            <div id="card-wrap">
              <div id="glow-violet"></div>
              <div id="glow-green"></div>

              <div id="card">
                <div id="card-head">
                  <div id="app-mark"></div>
                  <div id="card-title">Sign in</div>
                </div>

                <div id="pill-slot">
                  <img id="pill-img" src="assets/google_btn_real.png" alt="" />
                  <div id="ripple" data-layout-allow-occlusion="true"></div>
                  <div id="pill-ring" data-layout-allow-occlusion="true"></div>
                  <div id="admit-bar" data-layout-allow-occlusion="true">
                    <div id="admit-glow"></div>
                    <svg width="62" height="58" viewBox="0 0 62 58" fill="none">
                      <path
                        id="check"
                        d="M16 30 L26 41 L46 17"
                        stroke="#ffffff"
                        stroke-width="7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-dasharray="48"
                        stroke-dashoffset="48"
                      />
                    </svg>
                  </div>
                </div>

                <div id="email-field" class="field">Email</div>

                <div id="pw-row">
                  <div id="pw-field" class="field">Password</div>
                  <div id="strike" data-layout-allow-occlusion="true"></div>
                  <div id="badge" data-layout-allow-occlusion="true">NO PASSWORD</div>
                </div>

                <div
                  id="sweep-wrap"
                  data-layout-allow-occlusion="true"
                  data-layout-allow-overflow="true"
                >
                  <div id="sweep" data-layout-allow-overflow="true"></div>
                </div>

                <svg id="grain" data-layout-allow-occlusion="true">
                  <filter id="grain-f" x="0" y="0" width="100%" height="100%">
                    <feTurbulence
                      type="fractalNoise"
                      baseFrequency="0.85"
                      numOctaves="3"
                      seed="7"
                      stitchTiles="stitch"
                    />
                    <feColorMatrix type="saturate" values="0" />
                  </filter>
                  <rect width="100%" height="100%" filter="url(#grain-f)" />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      // Required alongside the fromTo fades — a lazy tween can silently fail to
      // render when the renderer seeks a paused timeline and screenshots at once.
      gsap.defaults({ lazy: false });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- ambient camera push-in under everything (origin = card centre) ----
      tl.to("#card-push", { scale: 1.018, duration: 5.9, ease: "sine.inOut" }, 0);

      // ================= ACT 1 — the login card =================
      // Primary entrance at local t=0. From-vars match the CSS frame-0 state
      // (opacity 0.55), so immediateRender may stay at its default here.
      tl.fromTo(
        "#card-wrap",
        { opacity: 0.55, y: 22, scale: 0.955 },
        { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#pad",
        { opacity: 0.55 },
        { opacity: 1, duration: 0.55, ease: "sine.inOut" },
        0
      );

      // reveal 2 @0.78 — the Google button is highlighted (1.70s before the next)
      tl.fromTo(
        "#pill-ring",
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: false },
        0.78
      );
      // one breathe. repeat:1 is ODD, so it lands back on the base value, and it
      // completes at 1.35 + 2*0.5 = 2.35 — long before the fade.
      tl.to(
        "#pill-ring",
        { opacity: 0.4, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" },
        1.35
      );

      // ================= TURN — the button is pressed =================
      tl.to("#pill-slot", { scale: 0.968, duration: 0.1, ease: "power4.out" }, 2.3);
      tl.to("#pill-slot", { scale: 1, duration: 0.26, ease: "power3.out" }, 2.4);
      tl.fromTo(
        "#ripple",
        { opacity: 0.6, scale: 0.6 },
        { opacity: 0, scale: 1.18, duration: 0.6, ease: "power3.out", immediateRender: false },
        2.32
      );
      tl.to("#pill-ring", { opacity: 0, duration: 0.3, ease: "power3.out" }, 2.42);

      // reveal 3 @2.48 — the redirect chip flies out of the card
      tl.fromTo(
        "#chip",
        { opacity: 0, y: 92, scale: 0.86 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out", immediateRender: false },
        2.48
      );

      // transition beat @3.10 — a green light sweeps the card, the chip leaves,
      // the real Google button slides away (you have been redirected).
      tl.fromTo(
        "#sweep",
        { x: -320 },
        { x: 1180, duration: 0.62, ease: "sine.inOut", immediateRender: false },
        3.1
      );
      tl.fromTo(
        "#sweep",
        { opacity: 0 },
        { opacity: 1, duration: 0.16, ease: "sine.inOut", immediateRender: false },
        3.1
      );
      tl.to("#sweep", { opacity: 0, duration: 0.2, ease: "sine.inOut" }, 3.56);
      tl.to("#chip", { opacity: 0, y: -46, duration: 0.42, ease: "power3.out" }, 3.1);
      tl.to("#pill-img", { opacity: 0, y: -26, duration: 0.36, ease: "power3.out" }, 3.22);

      // ================= ACT 2 — the app door opens =================
      // reveal 4 @3.62 — the admit bar wipes open from the centre, in the exact
      // box the Google button occupied. The password row is never touched.
      tl.fromTo(
        "#admit-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power3.out", immediateRender: false },
        3.62
      );
      tl.fromTo(
        "#check",
        { strokeDashoffset: 48 },
        { strokeDashoffset: 0, duration: 0.42, ease: "power3.out", immediateRender: false },
        3.98
      );
      // colour phase-shift carries the turn: violet -> green
      tl.fromTo(
        "#glow-green",
        { opacity: 0 },
        { opacity: 1, duration: 0.7, ease: "sine.inOut", immediateRender: false },
        3.95
      );
      tl.fromTo(
        "#glow-violet",
        { opacity: 1 },
        { opacity: 0, duration: 0.7, ease: "sine.inOut", immediateRender: false },
        3.95
      );
      // ambient life on the held state. repeat:1 is ODD; completes at
      // 4.40 + 2*0.45 = 5.30, before the fade starts at 5.65.
      tl.to(
        "#admit-glow",
        { opacity: 0.45, duration: 0.45, yoyo: true, repeat: 1, ease: "sine.inOut" },
        4.4
      );

      // ---- ACT 2 RESOLUTION — lands on "That's called OAuth" (local 4.99) ----
      tl.fromTo(
        "#strike",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power3.out", immediateRender: false },
        4.99
      );
      tl.fromTo(
        "#pw-field",
        { opacity: 1 },
        { opacity: 0.42, duration: 0.45, ease: "power3.out", immediateRender: false },
        4.99
      );
      // same gesture as the strike, offset 0.25 (the bar+kicker pattern) — not a
      // second independent reveal.
      tl.fromTo(
        "#badge",
        { opacity: 0, scale: 0.84 },
        { opacity: 1, scale: 1, duration: 0.32, ease: "power4.out", immediateRender: false },
        5.24
      );

      // ================= FADE — finishes at exactly 5.900 =================
      // Every transformed layer is faded explicitly: ancestor opacity is not
      // applied uniformly to transformed descendants in this renderer.
      //
      // Measured on the first render: fading #fade-wrap AND #card-push AND
      // #card-wrap multiplied three nested opacities together, so a
      // `power3.out` curve hit true zero at t=5.80 and left three empty
      // frames — a fade that lands early, which OVERLAY_SPEC bans. Two fixes:
      //   1. #fade-wrap and #card-push are dropped. Nothing lives on them that
      //      is not already inside #card-wrap or #pad, so the visible card now
      //      carries exactly ONE opacity multiplication.
      //   2. `sine.inOut` instead of `power3.out` — power3.out dumps almost
      //      all the opacity in the first third of the tween.
      // Result: the last rendered frame (t=5.8667) is still non-zero and the
      // curve reaches 0 at exactly 5.900.
      tl.fromTo(
        [
          "#pad",
          "#card-wrap",
          "#glow-green",
          "#pill-slot",
          "#admit-bar",
          "#strike",
          "#badge"
        ],
        { opacity: 1 },
        { opacity: 0, duration: 0.25, ease: "sine.inOut", immediateRender: false },
        5.65
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
