<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      body { font-family: Inter, sans-serif; }

      /* ---------- wrappers ---------- */
      #fade-wrap { position: absolute; inset: 0; overflow: hidden; }
      /* camera push-in origin = the content band's own centre (540, 500) */
      #push { position: absolute; inset: 0; transform-origin: 540px 500px; }

      /* ---------- panel atmosphere (NO full-frame #bg-fill: this is a panel) ----------
         box y = 200..840, alpha 0 at top/bottom via the linear stops and 0 at
         left/right via the mask, so there is no clipped edge anywhere.          */
      #panel-wash {
        position: absolute;
        left: 0; top: 200px; width: 1080px; height: 640px;
        background: linear-gradient(
          to bottom,
          rgba(3, 6, 14, 0) 0%,
          rgba(3, 6, 14, 0.76) 8%,
          rgba(3, 6, 14, 0.76) 84%,
          rgba(3, 6, 14, 0) 100%
        );
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%);
        opacity: 0.74;
      }

      /* static deterministic grain, masked to zero alpha on every edge */
      #grain {
        position: absolute;
        left: 0; top: 200px; width: 1080px; height: 640px;
        opacity: 0.05;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch' seed='7'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
        -webkit-mask-image: radial-gradient(ellipse 540px 320px at 50% 50%, #000 0%, #000 55%, transparent 100%);
        mask-image: radial-gradient(ellipse 540px 320px at 50% 50%, #000 0%, #000 55%, transparent 100%);
      }

      /* coloured glow blobs -- both fade to zero well inside their own boxes */
      #glow-slate {
        position: absolute;
        left: 20px; top: 480px; width: 600px; height: 400px;
        background: radial-gradient(ellipse 280px 180px at 50% 50%,
          rgba(148, 163, 184, 0.14) 0%, rgba(148, 163, 184, 0) 72%);
        opacity: 0;
      }
      #glow-cyan {
        position: absolute;
        left: 420px; top: 480px; width: 640px; height: 400px;
        background: radial-gradient(ellipse 300px 190px at 50% 50%,
          rgba(34, 211, 238, 0.22) 0%, rgba(34, 211, 238, 0) 72%);
        opacity: 0;
      }

      /* ---------- headline: 5 words, two lines, 112px ---------- */
      #headline {
        position: absolute;
        left: 40px; top: 230px; width: 1000px;
        text-align: center;
        color: #f2f6fb;
        font-size: 112px;
        line-height: 116px;
        font-weight: 800;
        letter-spacing: -2px;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.92), 0 0 18px rgba(0, 0, 0, 0.72);
      }
      .hl-line { white-space: nowrap; }

      /* ---------- the two cards: translucent fill + border + glow ---------- */
      .card {
        position: absolute;
        top: 524px;
        width: 418px;
        height: 268px;
        border-radius: 24px;
        padding: 24px 32px;
      }
      #card-master {
        left: 100px;
        background: linear-gradient(158deg, rgba(22, 27, 38, 0.40), rgba(8, 11, 18, 0.32));
        border: 2px solid rgba(148, 163, 184, 0.34);
        box-shadow: 0 14px 34px rgba(2, 4, 8, 0.52);
        opacity: 0;
      }
      #card-token {
        left: 562px;
        background: linear-gradient(158deg, rgba(9, 30, 39, 0.42), rgba(6, 14, 20, 0.32));
        border: 2px solid rgba(34, 211, 238, 0.58);
        box-shadow: 0 14px 34px rgba(2, 4, 8, 0.48);
        opacity: 0;
      }
      /* glow reach = card_top - 10 - (30+3) = 524 - 43 = 481, clear of headline (462) */
      #token-glow {
        position: absolute;
        inset: -8px;
        border-radius: 30px;
        box-shadow: 0 0 30px 3px rgba(34, 211, 238, 0.5);
        pointer-events: none;
        opacity: 0;
      }

      .key-svg { position: absolute; left: 32px; top: 24px; width: 88px; height: 88px; }
      .badge-svg { position: absolute; left: 350px; top: 26px; width: 36px; height: 36px; }
      #card-master .key-svg, #card-master .badge-svg { color: #7f8b9b; }
      #card-token .key-svg, #card-token .badge-svg { color: #67e8f9; }

      .card-label {
        position: absolute;
        left: 32px; top: 152px;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 32px;
        line-height: 36px;
        font-weight: 700;
        letter-spacing: 3px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 16px rgba(0, 0, 0, 0.8);
      }
      #label-master { color: #aab6c4; }
      #label-token { color: #b6f5fd; }

      /* master: one unbroken bar = unlimited access. token: 2 of 8 scopes. no numbers. */
      #master-bar {
        position: absolute;
        left: 32px; top: 228px; width: 354px; height: 10px;
        border-radius: 5px;
        background: linear-gradient(90deg, rgba(148, 163, 184, 0.58), rgba(148, 163, 184, 0.22));
      }
      #token-pips {
        position: absolute;
        left: 32px; top: 228px; width: 296px; height: 10px;
        display: flex; gap: 8px;
      }
      .pip { width: 30px; height: 10px; border-radius: 5px; background: rgba(148, 163, 184, 0.16); }
      .pip-on { background: rgba(34, 211, 238, 0.95); box-shadow: 0 0 8px rgba(34, 211, 238, 0.75); opacity: 0.12; }

      /* transition beat: a light sweep across the panel band (y 516..800) */
      #sweep {
        position: absolute;
        left: -260px; top: 516px; width: 220px; height: 284px;
        background: linear-gradient(90deg,
          rgba(190, 240, 255, 0) 0%,
          rgba(190, 240, 255, 0.30) 50%,
          rgba(190, 240, 255, 0) 100%);
        transform: skewX(-12deg);
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6.40"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="6.40"
        data-track-index="1"
      >
        <div id="fade-wrap">
          <div id="push">
            <div id="panel-wash" style="z-index: 1"></div>
            <div id="grain" style="z-index: 2"></div>
            <div id="glow-slate" style="z-index: 3"></div>
            <div id="glow-cyan" style="z-index: 3"></div>

            <div id="headline" style="z-index: 5" data-layout-allow-occlusion="true">
              <div class="hl-line">Access without</div>
              <div class="hl-line">the master key</div>
            </div>

            <!-- MASTER KEY: dark, locked, full-profile key with four teeth -->
            <div id="card-master" class="card" style="z-index: 6">
              <svg class="key-svg" viewBox="0 0 88 88">
                <circle cx="22" cy="44" r="15" fill="none" stroke="currentColor" stroke-width="8" />
                <rect x="34" y="40" width="46" height="8" rx="2" fill="currentColor" />
                <rect x="40" y="48" width="6" height="12" rx="2" fill="currentColor" />
                <rect x="52" y="48" width="6" height="16" rx="2" fill="currentColor" />
                <rect x="64" y="48" width="6" height="12" rx="2" fill="currentColor" />
                <rect x="74" y="48" width="6" height="16" rx="2" fill="currentColor" />
              </svg>
              <svg class="badge-svg" viewBox="0 0 36 36">
                <path d="M11 16 V12.5 a7 7 0 0 1 14 0 V16" fill="none" stroke="currentColor" stroke-width="3.5" />
                <rect x="6" y="16" width="24" height="17" rx="4" fill="currentColor" />
                <circle cx="18" cy="24.5" r="2.6" fill="#0a0e16" />
              </svg>
              <div id="label-master" class="card-label">MASTER KEY</div>
              <div id="master-bar"></div>
            </div>

            <!-- TOKEN: lit, the same key cut down to a single tooth -->
            <div id="card-token" class="card" style="z-index: 7">
              <div id="token-glow"></div>
              <svg class="key-svg" viewBox="0 0 88 88">
                <circle cx="22" cy="44" r="15" fill="none" stroke="currentColor" stroke-width="8" />
                <rect x="34" y="40" width="46" height="8" rx="2" fill="currentColor" />
                <rect x="74" y="48" width="6" height="14" rx="2" fill="currentColor" />
              </svg>
              <svg class="badge-svg" viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="12" fill="none" stroke="currentColor" stroke-width="3" />
                <circle cx="18" cy="18" r="5" fill="currentColor" />
              </svg>
              <div id="label-token" class="card-label">TOKEN</div>
              <div id="token-pips">
                <div class="pip pip-on"></div>
                <div class="pip pip-on"></div>
                <div class="pip"></div>
                <div class="pip"></div>
                <div class="pip"></div>
                <div class="pip"></div>
                <div class="pip"></div>
                <div class="pip"></div>
              </div>
            </div>

            <div id="sweep" data-layout-allow-overflow="true" style="z-index: 9"></div>
          </div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Frame-0 state comes from CSS only -- a tl.set() at position 0 never fires.

      // ---- continuous: slow camera push-in about the content band centre ----
      // band 230..800 -> 500 +/- (y-500)*1.035  =>  220.6 .. 810.5   (limits 180 / 1280)
      tl.fromTo("#push", { scale: 1 }, { scale: 1.035, duration: 6.4, ease: "sine.inOut" }, 0);

      // ---- panel comes up immediately (present on frame 0 at 0.74 via CSS) ----
      tl.fromTo("#panel-wash", { opacity: 0.74 }, { opacity: 1, duration: 0.45, ease: "sine.out" }, 0);

      // ---- PRIMARY ENTRANCE at t=0, starting at 0.55 opacity (never 0 on frame 0) ----
      tl.fromTo(
        "#headline",
        { opacity: 0.55, y: 26 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
        0
      );

      tl.fromTo("#glow-slate", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "sine.out", immediateRender: false }, 0.3);

      // ---- ACT 1 : master key card settles (reveal #2, +0.70) ----
      tl.fromTo(
        "#card-master",
        { opacity: 0, y: 44, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out", immediateRender: false },
        0.7
      );

      // ---- ACT 1 : token card settles beside it (reveal #3, +0.70) ----
      tl.fromTo(
        "#card-token",
        { opacity: 0, y: 44, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out", immediateRender: false },
        1.4
      );
      tl.fromTo("#glow-cyan", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.out", immediateRender: false }, 1.55);
      tl.fromTo("#token-glow", { opacity: 0 }, { opacity: 0.7, duration: 0.6, ease: "power3.out", immediateRender: false }, 1.6);

      // scope pips light (one coordinated micro-event, +0.62 after the card)
      tl.fromTo(
        ".pip-on",
        { opacity: 0.12 },
        { opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.16, immediateRender: false },
        2.02
      );

      // ---- THE TURN : light sweep across the panel band ----
      tl.fromTo("#sweep", { x: 0 }, { x: 1560, duration: 0.62, ease: "power2.inOut", immediateRender: false }, 2.5);
      tl.fromTo("#sweep", { opacity: 0 }, { opacity: 0.95, duration: 0.18, ease: "sine.out", immediateRender: false }, 2.5);
      tl.fromTo("#sweep", { opacity: 0.95 }, { opacity: 0, duration: 0.34, ease: "sine.in", immediateRender: false }, 2.72);

      // ---- THE TURN : master key card recedes and dims out entirely ----
      // 2.55 -> 3.50 local == output 40.65 -> 41.60, inside "without the master key" (40.18-41.78)
      tl.fromTo(
        "#card-master",
        { opacity: 1, scale: 1, x: 0, y: 0 },
        { opacity: 0, scale: 0.8, x: -70, y: 14, duration: 0.95, ease: "power2.inOut", immediateRender: false },
        2.55
      );
      tl.fromTo("#glow-slate", { opacity: 1 }, { opacity: 0, duration: 0.8, ease: "sine.inOut", immediateRender: false }, 2.55);

      // ---- ACT 2 : token card holds alone, recentred ----
      tl.fromTo(
        "#card-token",
        { x: 0, scale: 1 },
        { x: -231, scale: 1.06, duration: 0.85, ease: "power3.out", immediateRender: false },
        3.0
      );
      tl.fromTo("#glow-cyan", { x: 0 }, { x: -200, duration: 0.85, ease: "power3.out", immediateRender: false }, 3.0);

      // ---- ACT 2 : breathing. ODD repeats, both finish before the fade at 6.10 ----
      // 3.90 + (3+1)*0.50 + 0*3 = 5.90
      tl.fromTo(
        "#token-glow",
        { opacity: 0.7, scale: 1 },
        { opacity: 1, scale: 1.05, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, repeatDelay: 0, immediateRender: false },
        3.9
      );
      // 4.05 + (1+1)*0.65 + 0*1 = 5.35
      tl.fromTo(
        "#glow-cyan",
        { opacity: 1 },
        { opacity: 0.62, duration: 0.65, ease: "sine.inOut", yoyo: true, repeat: 1, repeatDelay: 0, immediateRender: false },
        4.05
      );

      // ---- fade FINISHES at exactly 6.400. Fade both the untransformed wrapper and
      //      the transformed push layer so no descendant is stranded.
      //      Two simultaneous fades MULTIPLY, so the composed curve is cos^2(p*pi/2):
      //      it is still ~3% at the final frame (6.367) and only reaches 0 at 6.400 --
      //      an eased pair such as power2.inOut would square to zero ~0.1s early. ----
      tl.fromTo("#fade-wrap", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "sine.in", immediateRender: false }, 6.1);
      tl.fromTo("#push", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "sine.in", immediateRender: false }, 6.1);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
