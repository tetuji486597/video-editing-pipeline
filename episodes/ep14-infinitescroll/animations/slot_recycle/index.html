<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* TRANSPARENT BAND FORMAT -- live footage shows through everywhere.
         No #bg-fill, no vignette, no full-frame child of any kind. */
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      body { font-family: Inter, sans-serif; }

      #stage { position: absolute; inset: 0; background: transparent; }

      /* ---------------------------------------------------------------
         RAIL GROUP -- canvas x 30-76, y 196-1264
         The rail is masked to nothing at BOTH ends, so it has no visible
         terminator and reads as continuing past the top and bottom edges
         of frame while every rendered pixel stays inside y 180-1280.
         --------------------------------------------------------------- */
      #rail-wrap {
        position: absolute;
        left: 30px;
        top: 196px;
        width: 46px;
        height: 1068px;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(
          to bottom,
          rgba(0,0,0,0) 0px, rgba(0,0,0,1) 96px,
          rgba(0,0,0,1) 972px, rgba(0,0,0,0) 1068px
        );
        mask-image: linear-gradient(
          to bottom,
          rgba(0,0,0,0) 0px, rgba(0,0,0,1) 96px,
          rgba(0,0,0,1) 972px, rgba(0,0,0,0) 1068px
        );
      }

      /* frame-0 state comes from CSS, never from tl.set() at position 0 */
      #rail-line {
        position: absolute;
        left: 20px;
        top: 0px;
        width: 2px;
        height: 1068px;
        background: rgba(226, 232, 240, 0.55);
        box-shadow: 0 0 10px rgba(226, 232, 240, 0.45),
                    0 0 2px rgba(0, 0, 0, 0.9);
        opacity: 0.5;               /* primary entrance starts here, not at 0 */
      }

      #flow { position: absolute; inset: 0; opacity: 0; }
      #flow-inner { position: absolute; inset: 0; }
      .fcard {
        position: absolute;
        left: 6px;
        width: 30px;
        height: 22px;
        border-radius: 5px;
        border: 1.5px solid rgba(125, 211, 252, 0.55);
        background: rgba(103, 232, 249, 0.12);   /* fill alpha 0.12 */
        box-shadow: 0 0 9px rgba(34, 211, 238, 0.35),
                    inset 0 0 6px rgba(103, 232, 249, 0.08);
      }

      #rail-hl {
        position: absolute;
        left: 17px;
        top: 0px;
        width: 8px;
        height: 120px;
        border-radius: 4px;
        background: linear-gradient(
          to bottom,
          rgba(103, 232, 249, 0) 0%,
          rgba(165, 243, 252, 0.9) 50%,
          rgba(103, 232, 249, 0) 100%
        );
        filter: blur(2px);
        opacity: 0;
      }

      /* ---------------------------------------------------------------
         METER GROUP -- label y 186-212, track y 252-266, x 106-238
         One label, no numeral. Lives in the plainest part of the plate
         (upper-left wall) and retires before Act 2 begins.
         --------------------------------------------------------------- */
      #meter-group { position: absolute; left: 106px; top: 186px; opacity: 0; }
      #meter-label {
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 22px;
        line-height: 26px;
        letter-spacing: 3.5px;
        color: rgba(241, 245, 249, 0.92);
        /* No outward glow on this label. Its cap-top sits at y=189; the
           widest shadow here reaches y=186, so nothing -- not even a
           sub-percent halo -- renders above the y=180 limit. Verified by
           measuring alpha YMAX over rows 0-180 on the rendered file. */
        text-shadow: 0 0 3px rgba(0, 0, 0, 0.95),
                     0 2px 6px rgba(0, 0, 0, 0.85);
        white-space: nowrap;
      }
      #meter-track {                 /* canvas y 252-266 */
        position: absolute;
        left: 0px;
        top: 66px;
        width: 132px;
        height: 14px;
        border-radius: 7px;
        border: 1.5px solid rgba(203, 213, 225, 0.5);
        background: rgba(148, 163, 184, 0.14);  /* fill alpha 0.14 */
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      #meter-fill {
        position: absolute;
        inset: 0;
        border-radius: 7px;
        background: rgba(226, 232, 240, 0.30);  /* fill alpha 0.30 */
        transform-origin: 0% 50%;
      }

      /* ---------------------------------------------------------------
         TILES -- canvas x 106-238, 132 x 88
         tops 306 / 434 / 562, bottoms 394 / 522 / 650, 40px gaps.
         No backing fill behind the photograph; the photo itself renders
         at alpha 0.50 so the live plate reads through it.
         --------------------------------------------------------------- */
      #tiles-layer { position: absolute; inset: 0; }
      .tile {
        position: absolute;
        left: 106px;
        width: 132px;
        height: 88px;
        border-radius: 10px;
        border: 1.5px solid rgba(203, 213, 225, 0.45);
        background: transparent;
        overflow: hidden;
        opacity: 0.5;               /* primary entrance starts here, not at 0 */
        box-shadow: 0 0 14px rgba(0, 0, 0, 0.5),
                    0 0 22px rgba(148, 163, 184, 0.22);
      }
      .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.5;
      }
      #tile-1 { top: 306px; }
      #tile-2 { top: 434px; }
      #tile-3 { top: 562px; }

      .pt {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: rgba(186, 230, 253, 0.95);
        box-shadow: 0 0 8px rgba(103, 232, 249, 0.85);
        opacity: 0;
      }

      /* ---------------------------------------------------------------
         INFINITY GLYPH -- box canvas x 110-300, y 440-540
         ink x 111.4-298.6, y 444.2-535.4 (stroke included)
         --------------------------------------------------------------- */
      #glyph {
        position: absolute;
        left: 110px;
        top: 440px;
        width: 190px;
        height: 100px;
        opacity: 0;
        filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.9))
                drop-shadow(0 0 12px rgba(34, 211, 238, 0.75))
                drop-shadow(0 0 34px rgba(34, 211, 238, 0.4));
      }
      #inf-path { stroke-dasharray: 700; stroke-dashoffset: 700; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6.50"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="6.50"
        data-track-index="1"
      >
        <div id="stage">
          <!-- the endless rail -->
          <div id="rail-wrap">
            <div id="rail-line"></div>
            <div id="flow">
              <div id="flow-inner">
                <div class="fcard" style="top: -110px"></div>
                <div class="fcard" style="top: 22px"></div>
                <div class="fcard" style="top: 154px"></div>
                <div class="fcard" style="top: 286px"></div>
                <div class="fcard" style="top: 418px"></div>
                <div class="fcard" style="top: 550px"></div>
                <div class="fcard" style="top: 682px"></div>
                <div class="fcard" style="top: 814px"></div>
                <div class="fcard" style="top: 946px"></div>
                <div class="fcard" style="top: 1078px"></div>
              </div>
            </div>
            <div id="rail-hl" data-layout-allow-overflow="true"></div>
          </div>

          <!-- memory meter: one label, no numeral -->
          <div id="meter-group">
            <div id="meter-label" data-layout-allow-occlusion="true">MEMORY</div>
            <div id="meter-track"><div id="meter-fill"></div></div>
          </div>

          <!-- real feed photos, translucent so the plate reads through -->
          <div id="tiles-layer">
            <div class="tile" id="tile-1"><img src="assets/tile_fjord.jpg" alt="" /></div>
            <div class="tile" id="tile-2"><img src="assets/tile_waterfall.jpg" alt="" /></div>
            <div class="tile" id="tile-3"><img src="assets/tile_strawberries.jpg" alt="" /></div>
          </div>

          <!-- the turn: cyan infinity draws itself -->
          <div id="glyph">
            <svg viewBox="8 28 84 44" width="190" height="100">
              <path
                id="inf-path"
                d="M10,50 C10,25 30,25 50,50 C70,75 90,75 90,50 C90,25 70,25 50,50 C30,75 10,75 10,50 Z"
                fill="none"
                stroke="#67e8f9"
                stroke-width="2.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- deterministic particle field (no Math.random, no Date.now) ----
      // [x within tile, y within tile, drift x, drift y] -- every value a literal
      const PSEED = [
        [14, 12, 34, 20],
        [52, 8, 56, 6],
        [96, 18, 70, 26],
        [120, 40, 62, 40],
        [24, 46, 22, 38],
        [66, 44, 46, 30],
        [104, 66, 64, 16],
        [34, 74, 30, 44],
      ];
      const TILE_TOPS = [306, 434, 562];
      const layer = document.getElementById("tiles-layer");
      const PARTS = [[], [], []];
      for (let t = 0; t < 3; t++) {
        for (let i = 0; i < PSEED.length; i++) {
          const s = PSEED[i];
          const el = document.createElement("i");
          el.className = "pt";
          el.style.left = 106 + s[0] + "px";
          el.style.top = TILE_TOPS[t] + s[1] + "px";
          layer.appendChild(el);
          PARTS[t].push({ el: el, dx: s[2], dy: s[3] });
        }
      }

      // exact draw length for the lemniscate (deterministic, read once at build)
      const path = document.getElementById("inf-path");
      const L = path.getTotalLength();
      gsap.set(path, { strokeDasharray: L, strokeDashoffset: L });

      const SLATE_RAIL = "rgba(226,232,240,0.55)";
      const CYAN_RAIL = "rgba(103,232,249,0.85)";

      // ================= ACT 1 =================
      // primary entrance at local t=0 (frame 0 is NOT blank: CSS holds 0.5)
      tl.fromTo(
        "#rail-line",
        { opacity: 0.5 },
        { opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );
      tl.fromTo(
        ".tile",
        { opacity: 0.5, y: 26 },
        { opacity: 1, y: 0, duration: 0.85, stagger: 0.09, ease: "power3.out" },
        0
      );

      // memory meter arrives (0.62s after the strip -- >= 0.6 stagger)
      tl.fromTo(
        "#meter-group",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false },
        0.62
      );

      // three unloads, 0.60s apart. "unloaded to save memory" = LOCAL 1.28,
      // which sits inside unload #1 (0.95-1.45) with #2 firing at 1.55.
      const UNLOAD = [0.95, 1.55, 2.15];
      const METER = [
        [1.0, 0.72],
        [0.72, 0.5],
        [0.5, 0.3],
      ];
      for (let t = 0; t < 3; t++) {
        const at = UNLOAD[t];
        tl.fromTo(
          "#tile-" + (t + 1),
          { opacity: 1, scale: 1 },
          {
            opacity: 0,
            scale: 0.94,
            duration: 0.5,
            ease: "power2.in",
            immediateRender: false,
          },
          at
        );
        PARTS[t].forEach(function (p) {
          tl.fromTo(
            p.el,
            { opacity: 0, x: 0, y: 0, scale: 0.35 },
            {
              opacity: 0.9,
              x: p.dx * 0.28,
              y: p.dy * 0.28,
              scale: 1,
              duration: 0.18,
              ease: "power2.out",
              immediateRender: false,
            },
            at + 0.04
          );
          tl.fromTo(
            p.el,
            { opacity: 0.9, x: p.dx * 0.28, y: p.dy * 0.28, scale: 1 },
            {
              opacity: 0,
              x: p.dx,
              y: p.dy,
              scale: 0.45,
              duration: 0.58,
              ease: "power2.out",
              immediateRender: false,
            },
            at + 0.22
          );
        });
        tl.fromTo(
          "#meter-fill",
          { scaleX: METER[t][0] },
          {
            scaleX: METER[t][1],
            duration: 0.4,
            ease: "power2.out",
            immediateRender: false,
          },
          at + 0.03
        );
      }

      // ================= THE TURN (2.65) =================
      // the meter settles, and the palette phase-shifts slate -> cyan
      tl.fromTo(
        "#meter-fill",
        { scaleX: 0.3 },
        { scaleX: 0.26, duration: 0.42, ease: "back.out(2.4)", immediateRender: false },
        2.75
      );
      tl.fromTo(
        "#rail-line",
        { backgroundColor: SLATE_RAIL },
        { backgroundColor: CYAN_RAIL, duration: 0.55, ease: "power2.out", immediateRender: false },
        2.65
      );
      tl.fromTo(
        "#meter-fill",
        { backgroundColor: "rgba(226,232,240,0.30)" },
        {
          backgroundColor: "rgba(103,232,249,0.30)",
          duration: 0.55,
          ease: "power2.out",
          immediateRender: false,
        },
        2.65
      );

      // ================= ACT 2 =================
      // the infinity glyph draws itself and COMPLETES at local 3.60
      // = output 37.90 = "feels infinite"
      tl.fromTo(
        "#glyph",
        { opacity: 0 },
        { opacity: 1, duration: 0.28, ease: "power2.out", immediateRender: false },
        2.95
      );
      tl.fromTo(
        path,
        { strokeDashoffset: L },
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.inOut", immediateRender: false },
        2.95
      );

      // the meter retires -- Act 2 carries zero text
      tl.fromTo(
        "#meter-group",
        { opacity: 1 },
        { opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false },
        3.05
      );

      // completion accent on the glyph
      tl.fromTo(
        "#glyph",
        { scale: 1 },
        { scale: 1.06, duration: 0.14, ease: "power4.out", immediateRender: false },
        3.6
      );
      tl.fromTo(
        "#glyph",
        { scale: 1.06 },
        { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false },
        3.74
      );

      // the strip becomes an endless conveyor: recycled outline cards flow
      // through the rail, entering and leaving inside the mask's soft ends.
      tl.fromTo(
        "#flow",
        { opacity: 0 },
        { opacity: 1, duration: 0.55, ease: "power2.out", immediateRender: false },
        3.6
      );
      // repeat arithmetic: 3.60 + (2+1)*0.84 = 6.12  <  6.20 (fade start)
      tl.fromTo(
        "#flow-inner",
        { y: 0 },
        { y: 132, duration: 0.84, ease: "none", repeat: 2, immediateRender: false },
        3.6
      );

      // glyph breathe: odd repeat so it lands back on the base value.
      // 4.10 + (3+1)*0.48 = 6.02  <  6.20
      tl.fromTo(
        "#glyph",
        { scale: 1 },
        {
          scale: 1.035,
          duration: 0.48,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 3,
          immediateRender: false,
        },
        4.1
      );

      // one non-repeating event in the tail: a highlight runs the rail once.
      tl.fromTo(
        "#rail-hl",
        { opacity: 0 },
        { opacity: 0.9, duration: 0.3, ease: "power2.out", immediateRender: false },
        4.4
      );
      tl.fromTo(
        "#rail-hl",
        { y: -120 },
        { y: 1080, duration: 1.2, ease: "sine.inOut", immediateRender: false },
        4.4
      );
      tl.fromTo(
        "#rail-hl",
        { opacity: 0.9 },
        { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false },
        5.3
      );

      // ================= FADE =================
      // Every transform-carrying layer is named explicitly -- ancestor opacity
      // is not applied uniformly to transformed descendants in this renderer.
      // 6.20 + 0.30 = 6.500 exactly, zero buffer.
      tl.fromTo(
        "#rail-line, #flow, #flow-inner, #tiles-layer, #glyph",
        { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false },
        6.2
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
