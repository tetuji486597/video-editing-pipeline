<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>EP27 payoff — break it yourself first (day / night card)</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: Inter, sans-serif; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .clip { position: absolute; inset: 0; }

  /* PHOTO CARD, still, in the UPPER BAND. Grid-measured on the real PAYOFF frames (src
     108.51-113.72 scaled to 1080x1920, zoom 1.0->1.08 about (540,730)): hair top ~330,
     brow ~730 (729 at zoom worst), eyes ~800. The card is a solid held card, so it sits
     over hair + neon + wall ONLY, above the brow: card x 90-850, y 210-690, slow drift
     1.00->1.025 about the card centre (470,450): x' 80.5-859.5, y' 204-696 -> clears the
     brow by 33px at worst, inside x70-870 / y200-1280. NO tease chip (series rule).
     Internal extents: caption y 222-278 | sun x 120-200 y 300-380 | monkey x 190-390 y 330-519
       | wrench x 350-420 y 380-470 | moon x 750-830 y 300-380 | bed x 510-700 y 400-540
       | unc chip x 740-840 y 550-620 | green strip y 610-670 across both halves */
  #card {
    position: absolute; left: 90px; top: 210px; width: 760px; height: 480px;
    border-radius: 26px; overflow: hidden;
    border: 4px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    opacity: 0.5; transform: scale(0.96); transform-origin: 50% 50%;
  }
  #day { position: absolute; left: 0; top: 0; width: 376px; height: 472px;
    background: linear-gradient(180deg, #7dd3fc 0%, #fde68a 70%, #86efac 100%); }
  #night { position: absolute; left: 376px; top: 0; width: 376px; height: 472px;
    background: linear-gradient(180deg, #0b1140 0%, #1e1b4b 65%, #0f172a 100%); }
  #split { position: absolute; left: 374px; top: 0; width: 4px; height: 472px; background: rgba(255,255,255,0.9); }
  #caption {
    position: absolute; left: 0; right: 0; top: 12px;      /* abs y 222-278 */
    text-align: center; font-size: 46px; line-height: 56px; font-weight: 900; letter-spacing: 1px;
    color: #ffffff; -webkit-text-stroke: 2px #000;
    text-shadow: 0 4px 0 #000, 0 0 18px rgba(0,0,0,0.7);
    white-space: nowrap; opacity: 0;
  }
  #sun { position: absolute; left: 30px; top: 90px; width: 80px; height: 80px; opacity: 0; transform-origin: 50% 50%; }
  #monkey { position: absolute; left: 100px; top: 120px; width: 200px; height: auto; opacity: 0; transform: scale(0.7); transform-origin: 50% 100%;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4)); }
  #wrench { position: absolute; left: 260px; top: 170px; width: 70px; height: 90px; opacity: 0; transform: rotate(-30deg); transform-origin: 50% 50%; }
  #moon { position: absolute; left: 660px; top: 90px; width: 80px; height: 80px; opacity: 0; }
  .star { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0; }
  #bed { position: absolute; left: 420px; top: 190px; width: 190px; height: 140px; opacity: 0; }
  #zz { position: absolute; left: 600px; top: 150px; width: 90px; height: 90px; opacity: 0; }
  #zz text { font-family: Inter, sans-serif; font-weight: 900; fill: #c4b5fd; }
  #unc {
    position: absolute; left: 650px; top: 340px; width: 100px; height: 70px;    /* abs x 740-840, y 550-620 */
    border-radius: 14px; background: rgba(255,255,255,0.92); border: 2px solid #4c1d95;
    display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0.5); transform-origin: 50% 50%;
  }
  #unc svg { width: 64px; height: 50px; }
  #strip { position: absolute; left: 0; top: 400px; width: 752px; height: 60px; }   /* abs y 610-670 */
  #strip svg { width: 752px; height: 60px; }
  #strip-line { fill: none; stroke: #39ff14; stroke-width: 6; stroke-linecap: round; }
  .sdot { fill: #39ff14; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4.7666" data-width="1080" data-height="1920">
  <section id="scene" class="clip" data-start="0" data-duration="4.7666" data-track-index="1">
    <div id="card">
      <div id="day"></div>
      <div id="night"></div>
      <div id="split"></div>

      <svg id="sun" viewBox="0 0 80 80">
        <g stroke="#f59e0b" stroke-width="5" stroke-linecap="round">
          <line x1="40" y1="4" x2="40" y2="14"/><line x1="40" y1="66" x2="40" y2="76"/><line x1="4" y1="40" x2="14" y2="40"/><line x1="66" y1="40" x2="76" y2="40"/>
          <line x1="15" y1="15" x2="22" y2="22"/><line x1="58" y1="58" x2="65" y2="65"/><line x1="15" y1="65" x2="22" y2="58"/><line x1="58" y1="22" x2="65" y2="15"/>
        </g>
        <circle cx="40" cy="40" r="20" fill="#fbbf24" stroke="#f59e0b" stroke-width="4"/>
      </svg>
      <img id="monkey" src="assets/chimpanzini_bananini_render.png" alt="" data-layout-allow-overflow="true" />
      <svg id="wrench" viewBox="0 0 70 90">
        <path d="M22 86 L22 40 A18 18 0 1 1 48 40 L48 86 Z" fill="#9ca3af" stroke="#374151" stroke-width="3" stroke-linejoin="round"/>
        <rect x="28" y="4" width="14" height="22" fill="#111827"/>
      </svg>

      <svg id="moon" viewBox="0 0 80 80">
        <path d="M52 8 A34 34 0 1 0 72 56 A26 26 0 0 1 52 8 Z" fill="#fde68a" stroke="#fbbf24" stroke-width="3"/>
      </svg>
      <div class="star" style="left: 420px; top: 60px"></div>
      <div class="star" style="left: 500px; top: 110px"></div>
      <div class="star" style="left: 590px; top: 50px"></div>
      <div class="star" style="left: 720px; top: 200px"></div>
      <div class="star" style="left: 460px; top: 160px"></div>
      <svg id="bed" viewBox="0 0 190 140">
        <rect x="160" y="10" width="22" height="110" rx="6" fill="#6b4423"/>
        <rect x="6" y="70" width="170" height="40" rx="8" fill="#e2e8f0"/>
        <rect x="6" y="76" width="120" height="34" rx="8" fill="#7c3aed"/>
        <rect x="130" y="58" width="40" height="22" rx="8" fill="#fff"/>
        <rect x="10" y="110" width="10" height="26" fill="#6b4423"/><rect x="166" y="110" width="10" height="26" fill="#6b4423"/>
        <image href="assets/amongus_red_crewmate_transparent.png" x="40" y="24" width="52" height="70" transform="rotate(-90 66 59)" />
      </svg>
      <svg id="zz" viewBox="0 0 90 90">
        <text x="6" y="80" font-size="26">z</text><text x="32" y="56" font-size="32">z</text><text x="58" y="30" font-size="38">z</text>
      </svg>

      <div id="unc">
        <svg viewBox="0 0 64 50">
          <path d="M10 8 L10 36 L36 36 L36 46 M14 36 L14 46 M10 8 L28 8 L28 22 L10 22" fill="none" stroke="#4c1d95" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 46 Q20 40 40 46" fill="none" stroke="#4c1d95" stroke-width="4" stroke-linecap="round"/>
          <path d="M50 12 Q56 10 56 18 L56 46" fill="none" stroke="#4c1d95" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <div id="strip">
        <svg viewBox="0 0 760 60" preserveAspectRatio="none">
          <path id="strip-line" d="M30,30 L730,30" />
          <circle class="sdot" id="sd1" cx="30" cy="30" r="10" /><circle class="sdot" id="sd2" cx="730" cy="30" r="10" />
        </svg>
      </div>

      <div id="caption">BREAK IT YOURSELF FIRST</div>
    </div>
  </section>
</div>

<script>
  gsap.defaults({ lazy: false });
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const D = 4.7666, FADE = 0.28, FADE_AT = D - FADE;   // 4.4866 + 0.28 = 4.7666 (143 frames @30fps)

  const sl = document.getElementById("strip-line"), sll = sl.getTotalLength();
  sl.style.strokeDasharray = String(sll); sl.style.strokeDashoffset = String(sll);

  // the card lands at t=0 ("break your own stuff" 47.812 = local -0.19..0.65)
  tl.fromTo("#card", { opacity: 0.5, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0);
  tl.fromTo("#caption", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.25);
  tl.fromTo("#sun", { opacity: 0, scale: 0.4, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.5)", immediateRender: false }, 0.4);
  tl.fromTo("#monkey", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, 0.6);
  tl.fromTo("#wrench", { opacity: 0, rotation: -30, x: -20 }, { opacity: 1, rotation: -30, x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.85);
  // all green: the strip draws across both halves
  tl.fromTo("#sd1", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, 0.9);
  tl.to("#strip-line", { strokeDashoffset: 0, duration: 0.7, ease: "none" }, 0.95);
  tl.fromTo("#sd2", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, 1.6);

  // "can't break you at night" (49.292 = local 1.29): the night side lights up
  tl.fromTo("#moon", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 1.25);
  document.querySelectorAll(".star").forEach((el, i) => {
    tl.fromTo(el, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.4 + i * 0.08);
  });
  tl.fromTo("#bed", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 1.6);
  tl.fromTo("#zz", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 2.1);
  // zzz drift (y in both from & to, odd repeat, finished before the fade: 2.5 + 4*0.45 = 4.3)
  tl.fromTo("#zz", { y: 0 }, { y: -10, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 2.5);
  // sun breathes (odd repeat) -- ends 4.1
  tl.fromTo("#sun", { scale: 1 }, { scale: 1.08, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 1.7);

  // "types like an unk" (51.872 = local 3.87): the unc chair chip pops
  tl.fromTo("#unc", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 3.85);

  // slow drift of the held card, then the fade finishing at EXACTLY D
  tl.fromTo("#card", { scale: 1 }, { scale: 1.025, duration: FADE_AT - 0.45, ease: "none", immediateRender: false }, 0.45);
  tl.fromTo("#card", { opacity: 1 }, { opacity: 0, duration: FADE, ease: "power2.out", immediateRender: false }, FADE_AT);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
