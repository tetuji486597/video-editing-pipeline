<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP27 build — Chaos Monkey unplugs one at 2:00 PM (transparent upper band)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent; /* MOTION GRAPHIC over live footage, upper band only */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* BAND: x 70-870, y 220-690. Grid-measured on the real BUILD frames (src 33.22-44.05
         scaled to 1080x1920, zoom 1.0->1.08 about (540,730)): hair top ~330 (298 worst),
         brow ~720 (719 worst), eyes ~800. Everything sits over hair / the neon sign /
         background, >=29px above the brow; fills translucent (<=0.32) per rule 11, the
         Kai photo card is the one solid element and it sits over hair+neon only.
         Absolute extents:
           chip      x 70-560   y 220-320
           rack      x 70-270   y 380-690
           monkey    x 290-480  y 508-687   (20px from the rack; joined by the cable)
           hat       x 345-425  y 458-518   (on the monkey's head; 95px from the clock)
           clock     x 520-670  y 380-530, label y 548-580 (40px from the monkey)
           kai card  x 700-870  y 380-690   (30px from the clock) */

      #chip {
        position: absolute;
        left: 70px;
        top: 220px;
        height: 100px;
        padding: 0 22px 0 10px;
        display: flex;
        align-items: center;
        gap: 14px;
        border-radius: 50px;
        background: rgba(30, 0, 4, 0.30);
        border: 3px solid #e50914;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
        opacity: 0.5;               /* frame-0: visible, entering (rule: entrance at t=0) */
        transform: scale(0.85);
        transform-origin: 0% 50%;
      }
      #chip-logo {
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: #e50914;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }
      #chip-logo img { width: 64px; height: 64px; }
      #chip-text {
        font-size: 44px;
        font-weight: 900;
        letter-spacing: 1px;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 14px rgba(229, 9, 20, 0.8);
        white-space: nowrap;
      }

      /* ---- rack ---- */
      #rack {
        position: absolute;
        left: 70px;
        top: 380px;
        width: 200px;
        height: 310px;
        border-radius: 14px;
        background: rgba(4, 22, 12, 0.30);
        border: 2px solid rgba(57, 255, 20, 0.85);
        box-shadow: 0 0 10px rgba(57, 255, 20, 0.35);
        opacity: 0;
      }
      #status {
        position: absolute;
        left: 8px;
        top: 6px;                   /* abs y 386-416 */
        width: 180px;
        height: 30px;
        border-radius: 8px;
        background: rgba(57, 255, 20, 0.18);
        border: 1px solid rgba(57, 255, 20, 0.7);
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 10px;
      }
      #status .dot { width: 10px; height: 10px; border-radius: 50%; background: #39ff14; box-shadow: 0 0 8px #39ff14; }
      #status span { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #39ff14; text-shadow: 0 0 8px rgba(57,255,20,0.9); }
      .unit {
        position: absolute;
        left: 8px;
        width: 180px;
        height: 52px;
        border-radius: 8px;
        background: rgba(10, 30, 16, 0.32);
        border: 1px solid rgba(57, 255, 20, 0.55);
        opacity: 0;
      }
      #u1 { top: 48px; }            /* abs 428-480 */
      #u2 { top: 110px; }           /* abs 490-542 */
      #u3 { top: 172px; }           /* abs 552-604 */
      #u4 { top: 234px; }           /* abs 614-666 */
      .led { position: absolute; left: 12px; top: 20px; width: 12px; height: 12px; border-radius: 50%; background: #39ff14; box-shadow: 0 0 8px #39ff14; }
      .slots { position: absolute; left: 36px; top: 14px; display: flex; gap: 6px; }
      .slots i { display: block; width: 20px; height: 24px; border-radius: 3px; background: rgba(57, 255, 20, 0.28); }
      #u2-x { position: absolute; left: 132px; top: 8px; width: 36px; height: 36px; opacity: 0; }

      /* ---- cable + plug + sparks ---- */
      #wires {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
        opacity: 0;
      }
      .cable { fill: none; stroke: #39ff14; stroke-width: 5; stroke-linecap: round; }
      .cable-glow { fill: none; stroke: rgba(57, 255, 20, 0.35); stroke-width: 13; stroke-linecap: round; }
      #cable-in, #cable-in-glow { opacity: 1; }
      #cable-out, #cable-out-glow { opacity: 0; }
      #plug { fill: #d9d9d9; stroke: #111; stroke-width: 2; }
      #sparks { opacity: 0; }
      #sparks line { stroke: #ffe14d; stroke-width: 4; stroke-linecap: round; }

      /* ---- monkey + chef hat ---- */
      #monkey {
        position: absolute;
        left: 290px;
        top: 508px;
        width: 190px;               /* 504x476 -> 190x179 */
        height: auto;
        opacity: 0;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
      }
      #hat {
        position: absolute;
        left: 345px;
        top: 458px;
        width: 80px;
        height: 60px;
        opacity: 0;
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.6));
      }

      /* ---- clock ---- */
      #clock {
        position: absolute;
        left: 520px;
        top: 380px;
        width: 150px;
        height: 150px;
        opacity: 0;
        transform: scale(0.6);
      }
      #clock-label {
        position: absolute;
        left: 520px;
        top: 548px;                 /* abs 548-580 */
        width: 150px;
        text-align: center;
        font-size: 28px;
        line-height: 32px;
        font-weight: 700;
        color: #ffe14d;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 12px rgba(255, 225, 77, 0.7);
        opacity: 0;
      }

      /* ---- Kai Cenat, calm, coffee ---- */
      #kai {
        position: absolute;
        left: 700px;
        top: 380px;
        width: 170px;
        height: 310px;
        border-radius: 18px;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        opacity: 0;
      }
      #kai img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 55% 18%;
      }
      #mug {
        position: absolute;
        left: 8px;                  /* abs x 711-767, y 617-685 */
        bottom: 6px;
        width: 56px;
        height: 68px;
        opacity: 0;
      }
      #steam { opacity: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8.70"
      data-width="1080"
      data-height="1920"
    >
      <section id="scene" class="clip" data-start="0" data-duration="8.70" data-track-index="1">
        <!-- ACT 1: the chip -->
        <div id="chip">
          <div id="chip-logo"><img src="assets/chaos_monkey_white.png" alt="" /></div>
          <div id="chip-text">CHAOS MONKEY</div>
        </div>

        <!-- the rack -->
        <div id="rack">
          <div id="status"><div class="dot"></div><span>ALL GOOD</span></div>
          <div class="unit" id="u1"><div class="led"></div><div class="slots"><i></i><i></i><i></i><i></i><i></i></div></div>
          <div class="unit" id="u2"><div class="led" id="u2-led"></div><div class="slots" id="u2-slots"><i></i><i></i><i></i></div>
            <svg id="u2-x" viewBox="0 0 36 36"><path d="M7 7 L29 29 M29 7 L7 29" stroke="#ff3b3b" stroke-width="5" stroke-linecap="round" fill="none"/></svg></div>
          <div class="unit" id="u3"><div class="led"></div><div class="slots"><i></i><i></i><i></i><i></i><i></i></div></div>
          <div class="unit" id="u4"><div class="led"></div><div class="slots"><i></i><i></i><i></i><i></i><i></i></div></div>
        </div>

        <!-- cable from unit 2 to the monkey's hand -->
        <svg id="wires" viewBox="0 0 1080 1920" data-layout-allow-overflow="true">
          <path id="cable-in-glow" class="cable-glow" d="M268,516 C284,536 280,556 296,572" />
          <path id="cable-in" class="cable" d="M268,516 C284,536 280,556 296,572" />
          <path id="cable-out-glow" class="cable-glow" d="M296,572 C270,556 292,530 316,540" />
          <path id="cable-out" class="cable" d="M296,572 C270,556 292,530 316,540" />
          <g id="plug-g">
            <rect id="plug" x="290" y="562" width="20" height="18" rx="3" />
          </g>
          <g id="sparks">
            <line x1="272" y1="512" x2="300" y2="488" />
            <line x1="274" y1="518" x2="310" y2="518" />
            <line x1="272" y1="524" x2="298" y2="548" />
          </g>
        </svg>

        <img id="monkey" src="assets/chimpanzini_bananini_render.png" alt="" data-layout-allow-overflow="true" />
        <svg id="hat" viewBox="0 0 80 60">
          <path d="M12 40 L12 54 Q40 60 68 54 L68 40 Z" fill="#ffffff" stroke="#222" stroke-width="2"/>
          <path d="M12 40 C0 40 0 22 14 24 C14 8 34 4 40 14 C46 4 66 8 66 24 C80 22 80 40 68 40 Z" fill="#ffffff" stroke="#222" stroke-width="2"/>
          <line x1="12" y1="44" x2="68" y2="44" stroke="#bbb" stroke-width="2"/>
        </svg>

        <!-- clock: hands written via trig in onUpdate (never GSAP rotation on a <line>) -->
        <svg id="clock" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="70" fill="rgba(0,0,0,0.30)" stroke="#ffe14d" stroke-width="4" />
          <g id="ticks" stroke="#ffe14d" stroke-width="3" stroke-linecap="round"></g>
          <line id="hour" x1="75" y1="75" x2="75" y2="40" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
          <line id="minute" x1="75" y1="75" x2="75" y2="20" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
          <circle cx="75" cy="75" r="6" fill="#ffe14d" />
        </svg>
        <div id="clock-label" class="mono">2:00 PM</div>

        <!-- ACT 2: Kai, calm -->
        <div id="kai">
          <img src="assets/kai_cenat_2025.jpg" alt="" />
          <svg id="mug" viewBox="0 0 56 68">
            <g id="steam" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
              <path d="M18 22 C14 16 22 12 18 4" />
              <path d="M30 22 C26 16 34 12 30 4" />
            </g>
            <rect x="8" y="26" width="34" height="34" rx="6" fill="#ffffff" stroke="#222" stroke-width="2"/>
            <path d="M42 34 C54 34 54 52 42 52" fill="none" stroke="#222" stroke-width="3"/>
            <rect x="10" y="28" width="30" height="8" rx="3" fill="#6b3e1e"/>
          </svg>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const FADE_AT = 8.42, FADE = 0.28;   // 8.42 + 0.28 = 8.70 = data-duration

      // deterministic clock ticks
      const ticks = document.getElementById("ticks");
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
        const r0 = i % 3 === 0 ? 56 : 62, r1 = 66;
        l.setAttribute("x1", (75 + Math.sin(a) * r0).toFixed(2));
        l.setAttribute("y1", (75 - Math.cos(a) * r0).toFixed(2));
        l.setAttribute("x2", (75 + Math.sin(a) * r1).toFixed(2));
        l.setAttribute("y2", (75 - Math.cos(a) * r1).toFixed(2));
        ticks.appendChild(l);
      }
      const hands = { h: 60, m: 270 };   // degrees; hour at 2 = 60deg, minute starts at 9 (270)
      const hourEl = document.getElementById("hour"), minEl = document.getElementById("minute");
      function writeHands() {
        const ha = (hands.h * Math.PI) / 180, ma = (hands.m * Math.PI) / 180;
        hourEl.setAttribute("x2", (75 + Math.sin(ha) * 36).toFixed(2));
        hourEl.setAttribute("y2", (75 - Math.cos(ha) * 36).toFixed(2));
        minEl.setAttribute("x2", (75 + Math.sin(ma) * 54).toFixed(2));
        minEl.setAttribute("y2", (75 - Math.cos(ma) * 54).toFixed(2));
      }
      writeHands();

      // ---------- ACT 1: "Chaos Monkey" (0.615) -- chip lands, at t=0 ----------
      tl.fromTo("#chip", { opacity: 0.5, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 0);
      tl.fromTo("#chip-logo", { opacity: 0, scale: 0.4, rotation: -90 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, 0.3);

      // the rack assembles (one element filling in -- not four independent reveals)
      tl.fromTo("#rack", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.95);
      ["#u1", "#u2", "#u3", "#u4"].forEach((u, i) => {
        tl.fromTo(u, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.1 + i * 0.1);
      });

      // monkey + cable
      tl.fromTo("#monkey", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 1.5);
      tl.fromTo("#wires", { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, 1.65);

      // ---------- TURN: "unplugs a server" (1.935) ----------
      tl.fromTo("#monkey", { x: 0 }, { x: 22, duration: 0.12, ease: "power4.out", immediateRender: false }, 1.95);
      tl.fromTo("#monkey", { x: 22 }, { x: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 2.07);
      tl.fromTo("#cable-in", { opacity: 1 }, { opacity: 0, duration: 0.06, immediateRender: false }, 1.97);
      tl.fromTo("#cable-in-glow", { opacity: 1 }, { opacity: 0, duration: 0.06, immediateRender: false }, 1.97);
      tl.fromTo("#cable-out", { opacity: 0 }, { opacity: 1, duration: 0.08, immediateRender: false }, 2.0);
      tl.fromTo("#cable-out-glow", { opacity: 0 }, { opacity: 1, duration: 0.08, immediateRender: false }, 2.0);
      tl.fromTo("#plug-g", { x: 0, y: 0 }, { x: 22, y: -30, duration: 0.15, ease: "power3.out", immediateRender: false }, 1.97);
      tl.fromTo("#sparks", { opacity: 0, scale: 0.5, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.1, ease: "power4.out", immediateRender: false }, 1.99);
      tl.fromTo("#sparks", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.1);
      tl.to("#u2-led", { backgroundColor: "#ff3b3b", boxShadow: "0 0 8px #ff3b3b", duration: 0.1 }, 2.1);
      tl.to("#u2-slots", { opacity: 0.25, duration: 0.2 }, 2.1);
      tl.fromTo("#u2-x", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out", immediateRender: false }, 2.15);
      tl.fromTo("#rack", { x: 0 }, { x: 5, duration: 0.05, yoyo: true, repeat: 5, immediateRender: false }, 1.97);

      // "middle of the day" (3.075): the clock pops and its minute hand sweeps to 12
      tl.fromTo("#clock", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)", immediateRender: false }, 2.85);
      tl.to(hands, { m: 360, duration: 0.7, ease: "power3.out", onUpdate: writeHands }, 2.95);
      tl.fromTo("#clock-label", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 3.4);
      // the dashboard STAYS green: a reassuring pulse on the status strip (odd repeat)
      tl.fromTo("#status", { boxShadow: "0 0 0px rgba(57,255,20,0)" }, { boxShadow: "0 0 18px rgba(57,255,20,0.9)", duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 3.7);

      // ---------- ACT 2: "sitting right there watching" (~4.3) -- Kai, calm ----------
      tl.fromTo("#kai", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 4.3);
      tl.fromTo("#mug", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.5)", immediateRender: false }, 4.95);
      tl.fromTo("#steam", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 5.3);   // ends 8.3

      // "diabolical" (6.3): the chip glows red once
      tl.fromTo("#chip", { boxShadow: "0 4px 10px rgba(0,0,0,0.35)" }, { boxShadow: "0 4px 22px rgba(229,9,20,0.9)", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 6.3);

      // "let him cook" (7.415): the chef hat drops on the monkey, monkey hops
      tl.fromTo("#hat", { opacity: 0, y: -50, scale: 1.3 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "bounce.out", immediateRender: false }, 7.35);
      tl.fromTo("#monkey", { y: 0 }, { y: -12, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 7.5);

      // ---------- fade: one per visible leaf, finishing at EXACTLY 8.70 ----------
      ["#chip", "#rack", "#wires", "#monkey", "#hat", "#clock", "#clock-label", "#kai"].forEach((s) => {
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: FADE, ease: "power2.out", immediateRender: false }, FADE_AT);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
