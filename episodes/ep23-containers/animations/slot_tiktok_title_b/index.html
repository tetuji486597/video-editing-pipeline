<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP23 TikTok-style Title Box (variant B)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* Variant-B wording per the skill table: abbreviated "RLLY", no leading
         "EXPLORING". Two boxes. Same geometry rationale as slot_tiktok_title:
         stack CENTRED on the true frame centre x=540 (left:0;right:0;margin:auto),
         font 56, no shadow. Widest line "RLLY COOL TECH:" measured 633.5px box at 66
         => text 569.5px; at 56px box ~= 569.5*56/66-ish ~ 547px -> x ~266-814; with
         the 1.01 drift about x=540: 540 + 274*1.01 = 816.7 <= 870 OK, left 263 >= 70.
         Vertical: top 210 (y>=200 margin); 2 line-boxes of 108 + 14 gap = 230 ->
         bottom 440, entirely over hair/background (hairline ~500 on this framing). */
      #stack {
        position: absolute;
        left: 0;
        right: 0;
        margin: 0 auto;
        top: 210px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        opacity: 0.6;
        transform: scale(0.94);
        transform-origin: 50% 12%;
      }
      .tt-line {
        background: #ffffff;
        color: #111111;
        font-size: 56px;
        line-height: 56px;
        font-weight: 800;
        letter-spacing: -1px;
        padding: 24px 32px 28px 32px;
        border-radius: 16px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.75"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="4.75"
        data-track-index="1"
      >
        <div id="stack">
          <div class="tt-line">RLLY COOL TECH:</div>
          <div class="tt-line">EPISODE 23</div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#stack",
        { opacity: 0.6, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" },
        0
      );

      tl.fromTo(
        "#stack",
        { scale: 1 },
        { scale: 1.01, duration: 4.19, ease: "none", immediateRender: false },
        0.28
      );

      // Fade finishes exactly at data-duration: 4.47 + 0.28 = 4.750.
      tl.fromTo(
        "#stack",
        { opacity: 1 },
        { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false },
        4.47
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
