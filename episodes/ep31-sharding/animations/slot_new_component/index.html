<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP31 new component — the shard key router</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* TRANSPARENT BAND over live footage, upper band y 220-590. NEW_COMPONENT frames
         grid-measured: hair top ~130, brow ~640 (zoom-worst 633), face x 250-820.
         COUNTDOWN RESERVE (x>=670, y<=330) stays empty: row 1 (key chip, x 80-430) and
         row 2 (lane x 80-500 + router x 500-580 + query card x 460-620, badge to 636)
         all end left of x=670; row 3 (shard boxes, up to x 840) starts at y=470.

         Rows: 1 key chip y 220-272 | 2 lane y 340-410, router diamond 335-415 |
               3 shard boxes y 470-590 (two 300x120) -> after the rebalance three boxes
               scaled 0.767 about their top-left: x 90-320 / 350-580 / 610-840, y 470-562.
         `hot` chip x 90-170, y 428-462 sits between rows 2 and 3 (gap 8 to the box
         top at 470; the box's red glow is a box-shadow that does not carry text).
         Route/fan lines live in the y 410-470 gutter only. */

      #key {
        position: absolute; left: 80px; top: 220px; height: 52px; padding: 0 18px;
        border-radius: 12px; background: rgba(8, 16, 28, 0.62);
        border: 2px solid rgba(103, 232, 249, 0.75); color: #cbd5e1;
        font-size: 26px; line-height: 48px; letter-spacing: 1px; white-space: nowrap;
        opacity: 0.5; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      }
      #key b { color: #a5f3fc; font-weight: 700; position: relative; }
      #key b i {
        position: absolute; left: 0; right: 0; bottom: -2px; height: 4px; border-radius: 2px;
        background: #fbbf24; transform: scaleX(0); transform-origin: 0 50%;
      }

      #router {
        position: absolute; left: 512px; top: 347px; width: 56px; height: 56px;
        transform: rotate(45deg); border-radius: 10px;
        background: rgba(8, 16, 28, 0.7); border: 3px solid rgba(103, 232, 249, 0.9);
        box-shadow: 0 0 10px rgba(103, 232, 249, 0.35); opacity: 0;
      }
      #router i { position: absolute; left: 20px; top: 20px; width: 10px; height: 10px; border-radius: 50%; background: #67e8f9; }

      .card {
        position: absolute; left: 80px; top: 340px; width: 120px; height: 70px;
        border-radius: 12px; background: rgba(12, 20, 32, 0.8);
        border: 2px solid rgba(148, 163, 184, 0.55);
        display: flex; align-items: center; gap: 10px; padding: 0 12px; opacity: 0;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.45);
      }
      .card .av { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; color: #0b1220; flex-shrink: 0; }
      .card .nm { font-size: 20px; color: #e2e8f0; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
      #c1 .av, #c3 .av { background: #67e8f9; }
      #c2 .av, #c4 .av { background: #c4b5fd; }

      #lines { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      .route { fill: none; stroke: #67e8f9; stroke-width: 4; stroke-linecap: round; opacity: 0; }
      .fan { fill: none; stroke: #fbbf24; stroke-width: 4; stroke-linecap: round; opacity: 0; }

      .shard {
        position: absolute; top: 470px; width: 300px; height: 120px; border-radius: 16px;
        background: linear-gradient(170deg, rgba(12, 20, 32, 0.78), rgba(7, 12, 20, 0.82));
        border: 2px solid rgba(148, 163, 184, 0.5);
        box-shadow: 0 8px 14px rgba(0, 0, 0, 0.45);
        transform-origin: 0 0; opacity: 0;
      }
      #b1 { left: 90px; }
      #b2 { left: 430px; }
      #b3 { left: 610px; transform: scale(0.767); }
      .shard .title {
        position: absolute; left: 16px; top: 12px; font-size: 24px; font-weight: 800;
        letter-spacing: 3px; color: #e2e8f0; transform-origin: 0 50%;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85); white-space: nowrap;
      }
      .rng {
        position: absolute; right: 14px; top: 12px; height: 34px; padding: 0 12px;
        border-radius: 8px; font-size: 22px; line-height: 30px; font-weight: 700;
        background: rgba(8, 47, 73, 0.9); border: 2px solid rgba(125, 211, 252, 0.8); color: #e0f2fe;
        opacity: 0; white-space: nowrap;
      }
      .blips { position: absolute; left: 16px; top: 62px; display: flex; gap: 8px; }
      .blip { width: 12px; height: 12px; border-radius: 3px; opacity: 0.25; }
      .blip.r { background: #34d399; }
      .blip.w { background: #fbbf24; }
      .track { position: absolute; left: 16px; top: 96px; width: 268px; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.14); }
      .load { width: 268px; height: 10px; border-radius: 5px; background: #67e8f9; transform: scaleX(0.35); transform-origin: 0 50%; }

      #hot {
        position: absolute; left: 90px; top: 428px; width: 80px; height: 34px; border-radius: 8px;
        background: rgba(69, 10, 10, 0.85); border: 2px solid #ef4444; color: #fecaca;
        font-size: 20px; line-height: 30px; text-align: center; letter-spacing: 2px; font-weight: 700;
        opacity: 0; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }

      #query {
        position: absolute; left: 460px; top: 340px; width: 160px; height: 70px;
        border-radius: 12px; background: rgba(40, 24, 4, 0.85);
        border: 2px solid rgba(251, 191, 36, 0.9); opacity: 0;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.45);
      }
      #query .qb { position: absolute; left: 14px; height: 10px; border-radius: 5px; background: rgba(253, 230, 138, 0.75); }
      #qmark {
        position: absolute; left: 600px; top: 322px; width: 36px; height: 36px; border-radius: 50%;
        background: #fbbf24; color: #1c1917; font-size: 26px; line-height: 36px; text-align: center;
        font-weight: 900; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.5" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="19.5" data-track-index="1">

        <div id="key" class="mono">shard key = <b>user_id<i></i></b></div>

        <svg id="lines" viewBox="0 0 1080 1920">
          <path class="route" id="r1" d="M540,415 C480,470 330,430 240,470" />
          <path class="route" id="r2" d="M540,415 C560,440 580,445 580,470" />
          <path class="fan" id="f1" d="M540,410 L205,470" />
          <path class="fan" id="f2" d="M540,410 L465,470" />
          <path class="fan" id="f3" d="M540,410 L725,470" />
        </svg>

        <div id="router"><i></i></div>

        <div class="card" id="c1"><div class="av">A</div><div class="nm">Alice</div></div>
        <div class="card" id="c2"><div class="av">N</div><div class="nm">Nia</div></div>
        <div class="card" id="c3"><div class="av">B</div><div class="nm">Bob</div></div>
        <div class="card" id="c4"><div class="av">Z</div><div class="nm">Zed</div></div>

        <div class="shard" id="b1">
          <div class="title">SHARD 1</div>
          <div class="rng mono old">A-M</div>
          <div class="rng mono new">A-H</div>
          <div class="blips"><div class="blip r"></div><div class="blip w"></div><div class="blip r"></div><div class="blip w"></div><div class="blip r"></div></div>
          <div class="track"><div class="load"></div></div>
        </div>
        <div class="shard" id="b2">
          <div class="title">SHARD 2</div>
          <div class="rng mono old">N-Z</div>
          <div class="rng mono new">I-Q</div>
          <div class="blips"><div class="blip w"></div><div class="blip r"></div><div class="blip r"></div><div class="blip w"></div><div class="blip r"></div></div>
          <div class="track"><div class="load"></div></div>
        </div>
        <div class="shard" id="b3">
          <div class="title">NEW</div>
          <div class="rng mono new">R-Z</div>
          <div class="blips"><div class="blip r"></div><div class="blip w"></div><div class="blip r"></div><div class="blip r"></div><div class="blip w"></div></div>
          <div class="track"><div class="load"></div></div>
        </div>

        <div id="hot">hot</div>

        <div id="query">
          <div class="qb" style="top:14px; width:96px"></div>
          <div class="qb" style="top:30px; width:128px"></div>
          <div class="qb" style="top:46px; width:70px"></div>
        </div>
        <div id="qmark">?</div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // deterministic dash setup for every drawn path (lengths kept for re-draws)
      const lens = {};
      ["r1", "r2", "f1", "f2", "f3"].forEach((id) => {
        const el = document.getElementById(id);
        const len = el.getTotalLength();
        lens["#" + id] = len;
        el.style.strokeDasharray = String(len);
        el.style.strokeDashoffset = String(len);
      });

      // ---------- ACT 1 (cyan): the key, the router, two shards ----------
      tl.fromTo("#key", { opacity: 0.5, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      // "user ID" @0.59: underline the key
      tl.fromTo("#key b i", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.6);
      // "decides which machine" @1.27: router + the two shards
      tl.fromTo("#router", { opacity: 0, scale: 0.4, rotation: 45 }, { opacity: 1, scale: 1, rotation: 45, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, 1.3);
      tl.fromTo("#b1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 1.7);
      tl.fromTo("#b2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 1.95);

      // a user card: fades in at the lane start, travels to the router, then is flicked
      // to a shard (x/y/scale repeated in every to-vars: seek-renderer trap).
      function travel(sel, t0) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, t0);
        tl.fromTo(sel, { x: 0, y: 0, scale: 1 }, { x: 290, y: 0, scale: 1, duration: 0.75, ease: "power2.inOut", immediateRender: false }, t0);
      }
      function flick(sel, path, dx, t0) {
        tl.fromTo(path, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, t0);
        tl.fromTo(path, { strokeDashoffset: lens[path] }, { strokeDashoffset: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t0);
        tl.to(path, { opacity: 0, duration: 0.3, ease: "power2.out" }, t0 + 0.55);
        tl.fromTo(sel, { x: 290, y: 0, scale: 1, opacity: 1 }, { x: 290 + dx, y: 155, scale: 0.3, opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, t0 + 0.05);
      }
      function flash(sel, t0) {
        tl.fromTo(sel, { scale: 1, color: "#e2e8f0" }, { scale: 1.1, color: "#ffffff", duration: 0.14, ease: "power2.out", immediateRender: false }, t0);
        tl.to(sel, { scale: 1, color: "#e2e8f0", duration: 0.3, ease: "power2.out" }, t0 + 0.14);
      }

      // "Simplified, users A through M" @3.21-5.05
      travel("#c1", 3.3);
      tl.fromTo("#b1 .old", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, 4.3);
      // "go on shard one" @5.07-5.95
      flick("#c1", "#r1", -190, 5.05);
      flash("#b1 .title", 5.7);
      // "N to Z" @6.25, "on shard two" @6.91-7.5
      travel("#c2", 5.6);
      tl.fromTo("#b2 .old", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, 6.25);
      flick("#c2", "#r2", 150, 6.9);
      flash("#b2 .title", 7.4);

      // "each shard handles reads and writes" @8.03-9.59: blips pulse (odd repeats, end 10.1)
      tl.fromTo(".blip", { opacity: 0.25 }, { opacity: 1, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: 0.03, immediateRender: false }, 8.1);
      travel("#c3", 8.0); flick("#c3", "#r1", -190, 8.75);
      travel("#c4", 9.0); flick("#c4", "#r2", 150, 9.75);

      // "when you need more capacity" @10.49-12.01: both shards fill up
      tl.fromTo("#b1 .load", { scaleX: 0.35 }, { scaleX: 0.82, duration: 1.0, ease: "power2.inOut", immediateRender: false }, 10.6);
      tl.fromTo("#b2 .load", { scaleX: 0.35 }, { scaleX: 0.78, duration: 1.0, ease: "power2.inOut", immediateRender: false }, 10.7);

      // ---------- TURN @12.39 ("add more machines"): a third machine, routes rebalance ----------
      tl.fromTo("#b1", { scale: 1, x: 0 }, { scale: 0.767, x: 0, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 12.4);
      tl.fromTo("#b2", { scale: 1, x: 0 }, { scale: 0.767, x: -80, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 12.4);
      tl.fromTo("#b3", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 0.767, duration: 0.4, ease: "back.out(1.5)", immediateRender: false }, 12.75);
      // ranges crossfade old -> new
      tl.fromTo("#b1 .old, #b2 .old", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 13.0);
      tl.fromTo("#b1 .new, #b2 .new, #b3 .new", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false, stagger: 0.08 }, 13.05);
      // load spreads out
      tl.fromTo("#b1 .load", { scaleX: 0.82 }, { scaleX: 0.5, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 13.1);
      tl.fromTo("#b2 .load", { scaleX: 0.78 }, { scaleX: 0.5, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 13.1);
      tl.fromTo("#b3 .load", { scaleX: 0 }, { scaleX: 0.5, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 13.15);

      // ---------- ACT 2 (amber): the hard parts @13.91 ----------
      tl.to("#key", { borderColor: "rgba(251,191,36,0.85)", duration: 0.5, ease: "sine.inOut" }, 13.9);
      tl.to("#key b", { color: "#fde68a", duration: 0.5, ease: "sine.inOut" }, 13.9);
      tl.to("#router", { borderColor: "rgba(251,191,36,0.9)", boxShadow: "0 0 10px rgba(251,191,36,0.35)", duration: 0.5, ease: "sine.inOut" }, 13.9);
      tl.to("#router i", { backgroundColor: "#fbbf24", duration: 0.5, ease: "sine.inOut" }, 13.9);
      // "spreads load evenly" @15.35-16.76: it does not -- shard 1 runs hot
      tl.fromTo("#b1 .load", { scaleX: 0.5 }, { scaleX: 1, duration: 0.5, ease: "power2.in", immediateRender: false }, 15.5);
      tl.to("#b1 .load", { backgroundColor: "#ef4444", duration: 0.4, ease: "power2.out" }, 15.6);
      tl.fromTo("#b2 .load", { scaleX: 0.5 }, { scaleX: 0.2, duration: 0.5, ease: "power2.out", immediateRender: false }, 15.6);
      tl.fromTo("#b3 .load", { scaleX: 0.5 }, { scaleX: 0.2, duration: 0.5, ease: "power2.out", immediateRender: false }, 15.65);
      tl.to("#b1", { borderColor: "rgba(239,68,68,0.95)", duration: 0.3, ease: "power2.out" }, 15.8);
      // red glow breathing on shard 1 (odd repeat: 16.0 + 4*0.35 = 17.4 < fade)
      tl.fromTo("#b1", { boxShadow: "0 8px 14px rgba(0,0,0,0.45)" },
        { boxShadow: "0 8px 14px rgba(0,0,0,0.45), 0 0 18px rgba(239,68,68,0.7)", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 16.0);
      tl.fromTo("#hot", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.8)", immediateRender: false }, 15.9);
      // "handling queries" @17.31: the router becomes a query
      tl.to("#router", { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.in" }, 17.15);
      tl.fromTo("#query", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, 17.3);
      tl.fromTo("#qmark", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 17.55);
      // "data from several shards" @17.71-19.39: it fans out to ALL of them
      [["#f1", 18.55], ["#f2", 18.65], ["#f3", 18.75]].forEach(([p, t]) => {
        tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, t);
        tl.to(p, { strokeDashoffset: 0, duration: 0.35, ease: "power3.out" }, t);
      });
      tl.to("#b2, #b3", { borderColor: "rgba(251,191,36,0.9)", duration: 0.25, ease: "power2.out" }, 18.95);

      // ---------- fade: finishes at EXACTLY 19.5 (19.2 + 0.3), zero buffer ----------
      ["#key", "#b1", "#b2", "#b3", "#query", "#qmark", "#hot"].forEach((s) => {
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 19.2);
      });
      tl.to("#lines, #b1 .title, #b2 .title, #b1 .new, #b2 .new, #b3 .new", { opacity: 0, duration: 0.3, ease: "power2.out" }, 19.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
