<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP31 hook — all of Facebook breaks into pieces</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* HALF-PANEL, upper band, translucent fills only (presenter visible below).
         HOOK frames grid-measured (1080x1920): hair top ~130, brow ~640 (zoom-worst
         633), face x 250-820. Everything lives in y 215-590 -> over hair/forehead only.
         COUNTDOWN RESERVE x>=670, y<=330 is empty on every frame: every element whose
         x reaches past 670 (piece #4, x 690-840) sits at y>=364; the burst glow is
         clipped to x<=665 / y>=200; the strain meter ends at x=644 (no glow).

         ACT 1 (cyan): one cylinder "ALL OF FACEBOOK" x 280-580, y 215-573 (bulge
         scaleX 1.06 about centre 430 -> x 271-589). `3B users` chip x 74-234, y 300-350
         (gap 37 to the bulged cylinder). Strain meter x 620-644, y 240-560 (gap 31).
         TURN @2.68 ("break"): burst + cylinder shatters.
         ACT 2 (amber): four pieces 150x190 at y 370-560, x 90-240 / 290-440 / 490-640 /
         690-840 (gaps 50); PIECES label x 90-, y 296-330 (gap 40 to the row).
         Shadows: pieces 0 8px 14px -> reach 560+8+22 = 590 < brow 633. */

      /* ---------- ACT 1: the one big database ---------- */
      #big {
        position: absolute;
        left: 280px;
        top: 215px;
        width: 300px;
        height: 360px;
        transform-origin: 50% 100%;
        opacity: 0.5;               /* frame-0 state from CSS; entrance animates up */
      }
      #big svg { width: 300px; height: 360px; overflow: visible; }
      .crack {
        fill: none;
        stroke: #fca5a5;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
      }
      #big-label {
        position: absolute;
        left: 280px;
        top: 360px;
        width: 300px;
        text-align: center;
        color: #e0f2fe;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
        opacity: 0.5;
        white-space: nowrap;
      }
      #big-label .l1 { display: block; font-size: 26px; letter-spacing: 6px; font-weight: 600; line-height: 30px; }
      #big-label .l2 { display: block; font-size: 44px; letter-spacing: 2px; font-weight: 800; line-height: 50px; margin-top: 6px; }

      #chip3b {
        position: absolute;
        left: 74px;
        top: 300px;
        width: 160px;
        height: 50px;
        border-radius: 12px;
        background: rgba(8, 16, 28, 0.62);
        border: 2px solid rgba(103, 232, 249, 0.7);
        color: #a5f3fc;
        font-size: 26px;
        line-height: 46px;
        text-align: center;
        letter-spacing: 1px;
        opacity: 0;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      }

      #meter {
        position: absolute;
        left: 620px;
        top: 240px;
        width: 24px;
        height: 320px;
        border-radius: 8px;
        background: rgba(8, 16, 28, 0.55);
        border: 2px solid rgba(148, 163, 184, 0.55);
        overflow: hidden;
        opacity: 0;
      }
      #meter-fill {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 6%;
        background: #34d399;
      }
      #meter-red {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 6%;
        background: #ef4444;
        opacity: 0;
      }

      /* ---------- TURN: the burst (clipped to the left band, never the reserve) ---------- */
      #burst-clip {
        position: absolute;
        left: 70px;
        top: 200px;
        width: 595px;
        height: 400px;
        overflow: hidden;
        pointer-events: none;
      }
      #burst {
        position: absolute;
        left: 60px;     /* centre (430,395) canvas -> clip-local (360,195); 600px wide */
        top: -105px;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(251, 191, 36, 0.55) 22%, rgba(251, 191, 36, 0) 58%);
        opacity: 0;
      }

      /* ---------- ACT 2: four pieces ---------- */
      .piece {
        position: absolute;
        top: 370px;
        width: 150px;
        height: 190px;
        opacity: 0;               /* hidden at rest until the split */
        filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.5));
      }
      .piece svg { width: 150px; height: 190px; overflow: visible; }
      #pc1 { left: 90px; }
      #pc2 { left: 290px; }
      #pc3 { left: 490px; }
      #pc4 { left: 690px; }

      #pieces-label {
        position: absolute;
        left: 90px;
        top: 296px;
        font-size: 30px;
        line-height: 34px;
        font-weight: 800;
        letter-spacing: 6px;
        color: #fbbf24;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
        opacity: 0;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.3" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="5.3" data-track-index="1">

        <div id="burst-clip"><div id="burst"></div></div>

        <div id="big">
          <svg viewBox="0 0 300 360">
            <path d="M5,40 L5,320 A145,38 0 0 0 295,320 L295,40 Z" fill="rgba(10,18,30,0.66)" stroke="#67e8f9" stroke-width="3" />
            <ellipse cx="150" cy="40" rx="145" ry="38" fill="rgba(14,116,144,0.55)" stroke="#67e8f9" stroke-width="3" />
            <path class="crack" id="ck1" d="M70,110 L92,150 L74,190 L104,232 L88,270" />
            <path class="crack" id="ck2" d="M232,96 L212,140 L238,178 L216,224 L240,262 L226,300" />
            <path class="crack" id="ck3" d="M150,300 L136,270 L158,244" />
          </svg>
        </div>
        <div id="big-label">
          <span class="l1">ALL OF</span>
          <span class="l2">FACEBOOK</span>
        </div>

        <div id="chip3b" class="mono">3B users</div>

        <div id="meter">
          <div id="meter-fill"></div>
          <div id="meter-red"></div>
        </div>

        <div id="pieces-label">PIECES</div>

        <div class="piece" id="pc1">
          <svg viewBox="0 0 150 190">
            <path d="M4,26 L4,166 A71,22 0 0 0 146,166 L146,26 Z" fill="rgba(30,20,8,0.7)" stroke="#fbbf24" stroke-width="3" />
            <ellipse cx="75" cy="26" rx="71" ry="22" fill="rgba(180,83,9,0.6)" stroke="#fbbf24" stroke-width="3" />
          </svg>
        </div>
        <div class="piece" id="pc2">
          <svg viewBox="0 0 150 190">
            <path d="M4,26 L4,166 A71,22 0 0 0 146,166 L146,26 Z" fill="rgba(30,20,8,0.7)" stroke="#fbbf24" stroke-width="3" />
            <ellipse cx="75" cy="26" rx="71" ry="22" fill="rgba(180,83,9,0.6)" stroke="#fbbf24" stroke-width="3" />
          </svg>
        </div>
        <div class="piece" id="pc3">
          <svg viewBox="0 0 150 190">
            <path d="M4,26 L4,166 A71,22 0 0 0 146,166 L146,26 Z" fill="rgba(30,20,8,0.7)" stroke="#fbbf24" stroke-width="3" />
            <ellipse cx="75" cy="26" rx="71" ry="22" fill="rgba(180,83,9,0.6)" stroke="#fbbf24" stroke-width="3" />
          </svg>
        </div>
        <div class="piece" id="pc4">
          <svg viewBox="0 0 150 190">
            <path d="M4,26 L4,166 A71,22 0 0 0 146,166 L146,26 Z" fill="rgba(30,20,8,0.7)" stroke="#fbbf24" stroke-width="3" />
            <ellipse cx="75" cy="26" rx="71" ry="22" fill="rgba(180,83,9,0.6)" stroke="#fbbf24" stroke-width="3" />
          </svg>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // crack paths: deterministic dash setup, drawn later
      ["ck1", "ck2", "ck3"].forEach((id) => {
        const el = document.getElementById(id);
        const len = el.getTotalLength();
        el.style.strokeDasharray = String(len);
        el.style.strokeDashoffset = String(len);
      });

      // ---------- ACT 1 (entrance at t=0; "single database server" 0.02-0.88) ----------
      tl.fromTo("#big", { opacity: 0.5, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo("#big-label", { opacity: 0.5, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.05);

      // "hold all of Facebook" @1.10-2.09: the count lands, the meter climbs, it strains
      tl.fromTo("#chip3b", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 1.1);
      tl.fromTo("#meter", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 1.15);
      tl.fromTo("#meter-fill", { height: "6%" }, { height: "100%", duration: 1.2, ease: "power2.in", immediateRender: false }, 1.2);
      tl.fromTo("#meter-red", { height: "6%", opacity: 0 }, { height: "100%", opacity: 1, duration: 1.2, ease: "power3.in", immediateRender: false }, 1.2);
      // bulge wobble: odd repeat -> lands on base; 1.3 + 6*0.18 = 2.38 < the snap
      tl.fromTo("#big", { scaleX: 1, scaleY: 1 }, { scaleX: 1.06, scaleY: 0.985, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 1.3);
      // cracks draw one after another
      [["#ck1", 1.7], ["#ck2", 2.0], ["#ck3", 2.3]].forEach(([s, t]) => {
        tl.to(s, { opacity: 1, duration: 0.08, ease: "power2.out" }, t);
        tl.to(s, { strokeDashoffset: 0, duration: 0.3, ease: "power3.out" }, t);
      });

      // ---------- TURN @2.68 ("break"): burst, the big one shatters ----------
      tl.fromTo("#burst", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.08, ease: "power4.out", immediateRender: false }, 2.66);
      tl.to("#burst", { opacity: 0, scale: 1.25, duration: 0.42, ease: "power2.out" }, 2.74);
      tl.to("#big", { opacity: 0, scale: 1.18, duration: 0.3, ease: "power3.out" }, 2.68);
      tl.to("#big-label", { opacity: 0, y: -18, duration: 0.25, ease: "power3.out" }, 2.68);
      tl.to("#chip3b", { opacity: 0, duration: 0.25, ease: "power2.out" }, 2.68);
      tl.to("#meter", { opacity: 0, duration: 0.25, ease: "power2.out" }, 2.68);

      // pieces fly from the big cylinder's centre (430,395) to their row (centres y 465)
      // every x/y/scale from-var is repeated in the to-vars (seek-renderer trap)
      const pieces = [
        ["#pc1", 265, -70, 2.72],
        ["#pc2", 65, -70, 2.80],
        ["#pc3", -135, -70, 2.88],
        ["#pc4", -335, -70, 2.96],
      ];
      pieces.forEach(([s, dx, dy, t]) => {
        tl.fromTo(s, { x: dx, y: dy, scale: 0.25, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, t);
      });

      // ---------- ACT 2 @3.60 ("pieces"): label; pieces settle and bob ----------
      tl.fromTo("#pieces-label", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 3.6);
      // gentle bob, odd repeat so it lands on base; pc4 is the last: 3.8 + 4*0.25 = 4.8 < fade @5.0
      pieces.forEach(([s], i) => {
        tl.fromTo(s, { y: 0 }, { y: -7, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 3.5 + i * 0.1);
      });
      // pc4 bob ends at 3.8 + 4*0.25 = 4.8 < 5.0

      // ---------- fade: finishes at EXACTLY 5.3 (5.0 + 0.3), zero buffer ----------
      // per-leaf fades on the transform carriers that are still visible
      ["#pc1", "#pc2", "#pc3", "#pc4", "#pieces-label"].forEach((s) => {
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 5.0);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
