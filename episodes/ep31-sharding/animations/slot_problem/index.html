<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP31 problem — the vertical wall</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* MOTION GRAPHIC over live footage, upper band. PROBLEM frames grid-measured:
         hair top ~130, brow ~640 (zoom-worst 633), face x 250-820. Everything sits in
         y 212-560 (+ the tipped price stack to y 556), x 90-840, so the countdown
         reserve (x>=670, y<=330) is empty: the only content right of x=670 is the
         tipped stack, whose highest point is y=399.

         ACT 1 (cyan): server box x 100-400, bottom fixed at y=556, grows 120 -> 170 ->
         230 -> 290 tall (top 436 -> 386 -> 326 -> 266). CPU / RAM chips inside it.
         Up-arrow x 440-520 (shaft x 478-482, y 300-540); VERTICAL label vertical text
         x 500-536, y 340-530. Ground line x 90-640, y 560-563.
         TURN @4.9 ("hard ceiling"): hazard bar x 90-640, y 236-258 slams (scaleY from
         the top, never above y=212); the box tops out at 266 -> 8px under the bar, bonks.
         ACT 2 (amber): price tags x 550-650, y 356-556 stack $ / $$ / $$$$ and tip
         over about the bottom-right corner (650,556): rotate 72deg -> bounds
         x 619-840, y 399-556. */

      #ground {
        position: absolute; left: 90px; top: 560px; width: 550px; height: 3px;
        background: rgba(226, 232, 240, 0.55); border-radius: 2px; opacity: 0.5;
      }

      /* #box is the full-size (300x290) container at its FINAL position; the visual
         shell inside it scales from the bottom (0.414 = 120px tall) so the growth is a
         transform, not a layout tween (the linter rejects top/height/fontSize motion).
         Chips live beside the shell, unscaled, pinned to the bottom. */
      #box {
        position: absolute; left: 100px; top: 266px; width: 300px; height: 290px;
        opacity: 0.5;
      }
      #shell {
        position: absolute; inset: 0;
        border-radius: 14px;
        background:
          repeating-linear-gradient(180deg, rgba(103, 232, 249, 0.10) 0 8px, rgba(0, 0, 0, 0) 8px 22px),
          linear-gradient(180deg, rgba(10, 18, 30, 0.72), rgba(6, 12, 20, 0.78));
        border: 3px solid rgba(103, 232, 249, 0.85);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.45);
        transform-origin: 50% 100%;
        transform: scaleY(0.414);
      }
      .chip {
        position: absolute; bottom: 18px; height: 46px; width: 104px;
        border-radius: 10px; background: rgba(8, 47, 73, 0.9);
        border: 2px solid rgba(125, 211, 252, 0.85); color: #e0f2fe;
        font-size: 24px; font-weight: 800; letter-spacing: 3px;
        display: flex; align-items: center; justify-content: center;
        transform-origin: 50% 100%;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      }
      #cpu { left: 24px; }
      #ram { right: 24px; }

      #bonk {
        position: absolute; left: 190px; top: 254px; width: 120px; height: 24px;
        border-radius: 50%; background: rgba(255, 255, 255, 0.95); opacity: 0;
      }

      #arrow {
        position: absolute; left: 440px; top: 290px; width: 80px; height: 280px; opacity: 0;
      }
      #arrow svg { width: 80px; height: 280px; overflow: visible; }
      #shaft { fill: none; stroke: #67e8f9; stroke-width: 6; stroke-linecap: round; }
      #head { fill: #67e8f9; opacity: 0; }
      #vlabel {
        position: absolute; left: 500px; top: 340px; width: 36px; height: 190px;
        writing-mode: vertical-rl; transform: rotate(180deg);
        font-size: 28px; font-weight: 800; letter-spacing: 5px; color: #a5f3fc;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
        line-height: 36px; opacity: 0; white-space: nowrap;
      }

      #ceiling {
        position: absolute; left: 90px; top: 236px; width: 550px; height: 22px;
        border-radius: 4px;
        background: repeating-linear-gradient(135deg, #fbbf24 0 18px, #1a1a1a 18px 36px);
        border: 2px solid rgba(239, 68, 68, 0.9);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        transform-origin: 50% 0%;
        opacity: 0;
      }

      #stack {
        position: absolute; left: 550px; top: 356px; width: 100px; height: 200px;
        transform-origin: 100% 100%;
        opacity: 0;
      }
      .tag {
        position: absolute; left: 0; width: 100px; height: 64px;
        border-radius: 10px; background: rgba(69, 26, 3, 0.85);
        border: 3px solid #fbbf24; color: #fde68a;
        font-size: 34px; font-weight: 800; letter-spacing: 1px;
        display: flex; align-items: center; justify-content: center;
        transform-origin: 50% 100%; opacity: 0;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      }
      #t1 { top: 136px; }
      #t2 { top: 68px; }
      #t3 { top: 0px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.7" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="7.7" data-track-index="1">
        <div id="ground"></div>

        <div id="ceiling"></div>

        <div id="box">
          <div id="shell"></div>
          <div class="chip" id="cpu">CPU</div>
          <div class="chip" id="ram">RAM</div>
        </div>
        <div id="bonk"></div>

        <div id="arrow">
          <svg viewBox="0 0 80 280">
            <path id="shaft" d="M40,270 L40,30" />
            <polygon id="head" points="40,4 16,40 64,40" />
          </svg>
        </div>
        <div id="vlabel">VERTICAL</div>

        <div id="stack">
          <div class="tag mono" id="t1">$</div>
          <div class="tag mono" id="t2">$$</div>
          <div class="tag mono" id="t3">$$$$</div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const shaft = document.getElementById("shaft");
      const shaftLen = shaft.getTotalLength();
      shaft.style.strokeDasharray = String(shaftLen);
      shaft.style.strokeDashoffset = String(shaftLen);

      // ---------- ACT 1: the box grows (entrance at t=0) ----------
      tl.fromTo("#box", { opacity: 0.5, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#ground", { opacity: 0.5 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);

      // "vertically" @0.73: the arrow draws upward, the label rides it; step 1
      tl.fromTo("#arrow", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, 0.75);
      tl.to("#shaft", { strokeDashoffset: 0, duration: 0.5, ease: "power3.out" }, 0.75);
      tl.fromTo("#head", { opacity: 0, scale: 0.4, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.8)", immediateRender: false }, 1.1);
      tl.fromTo("#vlabel", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, 1.2);
      // growth steps: shell scaleY 0.414 (120px) -> 0.586 (170) -> 0.793 (230) -> 1 (290)
      tl.fromTo("#shell", { scaleY: 0.414 }, { scaleY: 0.586, duration: 0.45, ease: "power3.out", immediateRender: false }, 0.95);

      // "bigger CPU" @2.21: step 2 + the CPU chip fattens (scale, not font-size)
      tl.fromTo("#shell", { scaleY: 0.586 }, { scaleY: 0.793, duration: 0.45, ease: "power3.out", immediateRender: false }, 2.2);
      tl.fromTo("#cpu", { scale: 1 }, { scale: 1.22, duration: 0.4, ease: "back.out(1.4)", immediateRender: false }, 2.25);
      // "more RAM" @3.01: step 3 + the RAM chip fattens
      tl.fromTo("#shell", { scaleY: 0.793 }, { scaleY: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 3.0);
      tl.fromTo("#ram", { scale: 1 }, { scale: 1.22, duration: 0.4, ease: "back.out(1.4)", immediateRender: false }, 3.05);
      // "same box" @3.75: the border breathes once (odd repeat, ends 3.8 + 2*0.35 = 4.5)
      tl.fromTo("#shell", { borderColor: "rgba(103,232,249,0.85)" },
        { borderColor: "rgba(165,243,252,1)", duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 3.8);

      // ---------- TURN @4.9 ("hard ceiling"): the bar slams, the box bonks ----------
      tl.fromTo("#ceiling", { opacity: 0, scaleY: 0.2, y: -24 },
        { opacity: 1, scaleY: 1, y: 0, duration: 0.18, ease: "power4.out", immediateRender: false }, 4.88);
      // shake (returns to y 0)
      tl.to("#ceiling", { y: 4, duration: 0.05, ease: "power2.out" }, 5.06);
      tl.to("#ceiling", { y: -3, duration: 0.05, ease: "power2.out" }, 5.11);
      tl.to("#ceiling", { y: 0, duration: 0.06, ease: "power2.out" }, 5.16);
      // the box tries once more, hits, squashes
      // (scaleY 1.035 -> top at 556 - 300.2 = 255.8, i.e. 2px INTO the bar's underside)
      tl.fromTo("#shell", { scaleY: 1 }, { scaleY: 1.035, duration: 0.14, ease: "power2.in", immediateRender: false }, 4.95);
      tl.fromTo("#shell", { scaleY: 1.035 }, { scaleY: 0.965, duration: 0.10, ease: "power2.out", immediateRender: false }, 5.09);
      tl.fromTo("#shell", { scaleY: 0.965 }, { scaleY: 1, duration: 0.22, ease: "power2.out", immediateRender: false }, 5.19);
      tl.to("#shell", { borderColor: "rgba(239,68,68,0.95)", duration: 0.12, ease: "power2.out" }, 5.06);
      tl.fromTo("#bonk", { opacity: 0, scaleX: 0.3, scaleY: 0.6 }, { opacity: 1, scaleX: 1, scaleY: 1, duration: 0.08, ease: "power4.out", immediateRender: false }, 5.06);
      tl.to("#bonk", { opacity: 0, scaleX: 1.5, scaleY: 1, duration: 0.3, ease: "power2.out" }, 5.14);
      // arrow + label drop out of the story after the wall
      tl.to("#arrow", { opacity: 0.35, duration: 0.4, ease: "power2.out" }, 5.2);
      tl.to("#vlabel", { opacity: 0.35, duration: 0.4, ease: "power2.out" }, 5.2);

      // ---------- ACT 2 @5.9 ("absurdly expensive"): the price stacks, then tips ----------
      tl.fromTo("#stack", { opacity: 0, rotation: 0 }, { opacity: 1, rotation: 0, duration: 0.1, ease: "power2.out", immediateRender: false }, 5.85);
      [["#t1", 5.9], ["#t2", 6.25], ["#t3", 6.6]].forEach(([s, t]) => {
        tl.fromTo(s, { opacity: 0, scale: 0.5, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(1.7)", immediateRender: false }, t);
      });
      // "fast" @7.23: the stack tips over about its bottom-right corner (div wrapper rotation)
      tl.fromTo("#stack", { rotation: 0 }, { rotation: 72, duration: 0.45, ease: "bounce.out", immediateRender: false }, 6.95);

      // ---------- fade: finishes at EXACTLY 7.7 (7.4 + 0.3), zero buffer ----------
      ["#box", "#stack", "#ceiling", "#ground"].forEach((s) => {
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 7.4);
      });
      ["#arrow", "#vlabel", "#shell", "#cpu", "#ram", "#t1", "#t2", "#t3", "#head"].forEach((s) => {
        tl.to(s, { opacity: 0, duration: 0.3, ease: "power2.out" }, 7.4);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
