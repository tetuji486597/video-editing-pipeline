<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP28 problem - 67 seconds of blank screen (takeover)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .fill { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }
      @font-face { font-family: "Impact"; src: local("Impact"); }
      .impact { font-family: Impact, Inter, sans-serif; }

      /* ---------- background (opaque, on a CHILD, instant) ---------- */
      #bg-fill {
        background: radial-gradient(120% 90% at 50% 10%, #2a0d3f 0%, #170726 45%, #0b0312 80%, #060109 100%);
      }
      /* colour phase: magenta (act 1) -> acid green (act 2). Both blobs dim enough
         that luma stays < 120 everywhere outside the band (margin audit exemption is
         judged by eye but we keep the glows below the threshold anyway). */
      #glow-a {
        position: absolute; left: 50%; top: 40%; width: 1500px; height: 1500px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255, 43, 214, 0.16) 0%, rgba(255, 43, 214, 0) 60%);
      }
      #glow-b {
        position: absolute; left: 50%; top: 62%; width: 1600px; height: 1600px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(182, 255, 43, 0.20) 0%, rgba(182, 255, 43, 0) 58%);
        opacity: 0;
      }
      #vignette {
        background: radial-gradient(ellipse 760px 1000px at 50% 46%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 50%, rgba(3,1,6,0.6) 80%, rgba(2,0,4,0.94) 100%);
      }

      /* push-in 1 -> 1.025 about (465, 780): content x 90-850 -> 80.6-859.6,
         y 300-1250 -> 288-1262. */
      #scene { transform-origin: 465px 780px; }

      /* ---------- ACT 1: the blank tab ---------- */
      #win {
        position: absolute;
        left: 90px;
        top: 300px;
        width: 740px;
        height: 700px;
        border-radius: 20px;
        background: #1c1c24;
        border: 2px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
        overflow: hidden;
        opacity: 0.55;
        transform: scale(0.96);
        transform-origin: 50% 50%;
      }
      #tabs { position: absolute; left: 0; top: 0; width: 100%; height: 64px; background: #2b2b35; }
      #tab {
        position: absolute; left: 16px; top: 12px; height: 52px; width: 300px;
        border-radius: 12px 12px 0 0; background: #1c1c24;
        display: flex; align-items: center; gap: 12px; padding: 0 18px;
        color: #e6e6ee; font-size: 22px; font-weight: 600;
      }
      #tab .fav { width: 22px; height: 22px; border-radius: 6px; background: #b6ff2b; }
      #tab .ttl { flex: 1; white-space: nowrap; }
      #tabx {
        width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        color: #cfcfd8; font-size: 24px; font-weight: 700; transform-origin: 50% 50%;
      }
      #urlbar {
        position: absolute; left: 0; top: 64px; width: 100%; height: 62px; background: #2b2b35;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      #url {
        position: absolute; left: 118px; top: 10px; width: 520px; height: 42px; border-radius: 21px;
        background: #1c1c24; color: #a7a7b3; font-size: 20px; line-height: 42px; padding-left: 18px;
        letter-spacing: 0.3px;
      }
      #nav { position: absolute; left: 20px; top: 16px; display: flex; gap: 14px; }
      #nav i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #6b6b78; display: block; }
      #page {
        position: absolute; left: 0; top: 126px; width: 100%; height: 574px;
        background: #f2f2f6; /* the blank page. Window bottom = 1000, far above the caption band */
      }
      /* spinner: page-local centre (200, 250) -> abs (290, 676), 150px */
      #spin {
        position: absolute; left: 125px; top: 175px; width: 150px; height: 150px;
        transform-origin: 50% 50%;
      }
      #spin svg { width: 150px; height: 150px; }
      /* Trippi Troppi, confused, staring at the spinner: page-local x 440-720, y
         90-560 -> abs x 530-810, y 516-986 (inside the window). */
      #trippi {
        position: absolute; left: 440px; top: 90px; width: 280px; height: 470px;
        object-fit: contain; transform-origin: 50% 100%;
        filter: drop-shadow(0 10px 16px rgba(0,0,0,0.35));
      }
      /* "?" marks over Trippi's head (SVG), hidden at rest */
      #qq { position: absolute; left: 470px; top: 40px; width: 120px; height: 90px; opacity: 0; }

      /* ---------- stopwatch: abs y 1050-1250, x 420-850 (right of the LaMelo corner) ---------- */
      #watch {
        position: absolute; left: 400px; top: 1050px; width: 430px; height: 200px;
        opacity: 0;
      }
      #dial { position: absolute; left: 0; top: 10px; width: 150px; height: 180px; }
      #dial svg { width: 150px; height: 180px; }
      #digits {
        position: absolute; left: 160px; top: 30px; width: 270px; height: 140px;
        display: flex; align-items: center; justify-content: flex-end;
        color: #f6f6fb; font-size: 96px; line-height: 140px; font-weight: 700;
        text-shadow: 0 0 22px rgba(255, 43, 214, 0.55), 0 4px 10px rgba(0,0,0,0.7);
      }
      .col { position: relative; width: 66px; height: 140px; }
      .col.colon { width: 60px; text-align: center; }
      .col span { position: absolute; left: 0; top: 0; width: 100%; text-align: center; opacity: 0; }
      .col span.on { opacity: 1; }

      /* ---------- LaMelo 6-7 pop: bottom-left corner of the band ---------- */
      #melo {
        position: absolute; left: 90px; top: 1000px; width: 300px; height: 260px;
        opacity: 0; transform-origin: 50% 80%;
      }
      #melo img { position: absolute; left: 0; top: 40px; width: 220px; height: 220px; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.6)); }
      #melo .tag {
        position: absolute; left: 8px; top: 0; height: 52px; padding: 0 16px; border-radius: 10px;
        background: #ff2bd6; color: #fff; font-size: 40px; line-height: 52px; letter-spacing: 2px;
        transform: rotate(-6deg); transform-origin: 0 100%;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }
      .hand { position: absolute; width: 64px; height: 64px; }
      #hand1 { left: 222px; top: 100px; }
      #hand2 { left: 222px; top: 178px; }

      /* ---------- TURN: smash on the tab X ---------- */
      #crack { position: absolute; left: 300px; top: 300px; width: 140px; height: 140px; opacity: 0; transform-origin: 50% 50%; }
      #flash { background: #ffffff; opacity: 0; }

      /* ---------- ACT 2: touch grass ---------- */
      /* grass strip rises from below the window's old bottom: x 90-850, y 960-1080
         (blades) + ground 1040-1100. Trippi lands with feet at ~1040. */
      #ground { position: absolute; left: 90px; top: 1040px; width: 740px; height: 60px; border-radius: 30px; background: #2f7d1a; opacity: 0; }
      #grass { position: absolute; left: 90px; top: 950px; width: 740px; height: 110px; opacity: 0; transform-origin: 50% 100%; }
      /* Trippi act-2 body: separate img so act 1's can stay inside the window and fly
         away with it. Rest hidden. x 560-840, y 570-1040 (feet on the ground line). */
      #trippi2 {
        position: absolute; left: 560px; top: 570px; width: 280px; height: 470px; object-fit: contain;
        opacity: 0; transform-origin: 50% 100%;
        filter: drop-shadow(0 10px 16px rgba(0,0,0,0.45));
      }
      #tg {
        position: absolute; left: 90px; top: 830px; height: 74px; padding: 0 24px; border-radius: 14px;
        background: #b6ff2b; color: #0b1a03; font-size: 50px; line-height: 74px; letter-spacing: 3px;
        opacity: 0; transform-origin: 50% 50%;
        box-shadow: 0 6px 14px rgba(0,0,0,0.5);
      }
      /* SYBAU slam: centre 470, y 330-500 */
      #sybau {
        position: absolute; left: 90px; top: 330px; width: 760px; height: 170px;
        text-align: center; color: #fff; font-size: 150px; line-height: 170px; letter-spacing: 6px;
        opacity: 0; transform-origin: 50% 50%;
        text-shadow: 0 0 30px rgba(255, 43, 214, 0.9), 0 8px 0 #7a0d63, 0 12px 26px rgba(0,0,0,0.8);
      }
      /* static seeded grain tile (assets/grain.png) instead of a per-frame feTurbulence
         filter -- identical look, and it cut the takeover render time ~6x */
      #dither { opacity: 0.045; background: url(assets/grain.png) repeat; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.6" data-width="1080" data-height="1920">
      <section id="main-clip" class="clip" data-start="0" data-duration="9.6" data-track-index="1">
        <div id="bg-fill" class="fill">
          <div id="glow-a"></div>
          <div id="glow-b"></div>
          <div id="vignette" class="fill"></div>
        </div>

        <div id="scene" class="fill">
          <div id="win">
            <div id="tabs">
              <div id="tab"><span class="fav"></span><span class="ttl">chat</span><span id="tabx">&#x2715;</span></div>
            </div>
            <div id="urlbar">
              <div id="nav"><i></i><i></i></div>
              <div id="url">chat.app/c/new</div>
            </div>
            <div id="page">
              <div id="spin">
                <svg viewBox="0 0 150 150" fill="none">
                  <circle cx="75" cy="75" r="58" stroke="#d0d0da" stroke-width="14"/>
                  <path d="M75 17 a58 58 0 0 1 58 58" stroke="#ff2bd6" stroke-width="14" stroke-linecap="round"/>
                </svg>
              </div>
              <img id="trippi" src="assets/trippi_troppi_render.png" alt="" data-layout-allow-overflow="true" />
              <svg id="qq" viewBox="0 0 120 90" fill="none">
                <text x="6" y="70" font-family="Impact, sans-serif" font-size="70" fill="#a80f86">?</text>
                <text x="66" y="52" font-family="Impact, sans-serif" font-size="50" fill="#a80f86">?</text>
              </svg>
            </div>
          </div>

          <svg id="crack" viewBox="0 0 140 140" fill="none" stroke="#ff2bd6" stroke-width="6" stroke-linecap="round">
            <path d="M70 70 L20 30 M70 70 L118 26 M70 70 L30 118 M70 70 L120 104 M70 70 L70 12 M70 70 L14 76 M70 70 L126 66 M70 70 L64 128"/>
          </svg>

          <div id="watch">
            <div id="dial">
              <svg viewBox="0 0 150 180" fill="none">
                <rect x="62" y="6" width="26" height="18" rx="4" fill="#e9e9f2"/>
                <rect x="70" y="20" width="10" height="16" fill="#e9e9f2"/>
                <circle cx="75" cy="105" r="66" stroke="#e9e9f2" stroke-width="10"/>
                <circle id="ring" cx="75" cy="105" r="66" stroke="#ff2bd6" stroke-width="10" stroke-linecap="round" transform="rotate(-90 75 105)"/>
                <circle cx="75" cy="105" r="8" fill="#e9e9f2"/>
                <line id="needle" x1="75" y1="105" x2="75" y2="50" stroke="#ff2bd6" stroke-width="7" stroke-linecap="round"/>
              </svg>
            </div>
            <div id="digits" class="mono">
              <div class="col" id="cm"><span class="on">0</span><span>1</span></div>
              <div class="col colon"><span class="on">:</span></div>
              <div class="col" id="ct"><span class="on">0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
              <div class="col" id="co"><span class="on">0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
            </div>
          </div>

          <div id="melo">
            <div class="tag impact">6 7</div>
            <img src="assets/lamelo_67_sticker.png" alt="" data-layout-allow-overflow="true" />
            <svg class="hand" id="hand1" viewBox="0 0 64 64" fill="#ffd7b0" stroke="#7a3d12" stroke-width="3" stroke-linejoin="round">
              <path d="M18 58 V30 a4 4 0 0 1 8 0 V22 a4 4 0 0 1 8 0 V20 a4 4 0 0 1 8 0 V24 a4 4 0 0 1 8 0 V44 c0 10 -8 16 -16 16 z"/>
            </svg>
            <svg class="hand" id="hand2" viewBox="0 0 64 64" fill="#ffd7b0" stroke="#7a3d12" stroke-width="3" stroke-linejoin="round">
              <path d="M18 58 V30 a4 4 0 0 1 8 0 V22 a4 4 0 0 1 8 0 V20 a4 4 0 0 1 8 0 V24 a4 4 0 0 1 8 0 V44 c0 10 -8 16 -16 16 z"/>
            </svg>
          </div>

          <!-- ACT 2 -->
          <div id="ground"></div>
          <svg id="grass" viewBox="0 0 760 110" fill="none" stroke="#5be03a" stroke-width="8" stroke-linecap="round">
            <path d="M30 108 q-6 -40 10 -70 M70 108 q10 -36 -4 -66 M120 108 q-4 -46 14 -80 M170 108 q8 -30 -8 -58 M220 108 q-10 -40 6 -74 M270 108 q6 -36 -6 -64 M320 108 q-8 -46 12 -82 M370 108 q10 -34 -6 -60 M420 108 q-6 -42 10 -72 M470 108 q8 -30 -8 -56 M520 108 q-10 -46 8 -80 M570 108 q6 -36 -6 -66 M620 108 q-8 -40 12 -74 M670 108 q10 -32 -6 -58 M720 108 q-6 -46 10 -78"/>
          </svg>
          <img id="trippi2" src="assets/trippi_troppi_render.png" alt="" data-layout-allow-overflow="true" />
          <div id="tg" class="impact">TOUCH GRASS</div>
          <div id="sybau" class="impact">SYBAU</div>
        </div>

        <div id="flash" class="fill"></div>
        <div id="dither" class="fill"></div>
      </section>
    </div>


    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // stopwatch ring draw: circumference 2*pi*66 = 414.7
      const ring = document.getElementById("ring");
      ring.style.strokeDasharray = "414.7";
      ring.style.strokeDashoffset = "414.7";
      // needle: NEVER GSAP-rotate a degenerate <line>; write endpoints via trig
      const needle = document.getElementById("needle");
      const hand = { a: 0 };
      function setNeedle() {
        const r = 55, rad = (hand.a - 90) * Math.PI / 180;
        needle.setAttribute("x2", (75 + r * Math.cos(rad)).toFixed(2));
        needle.setAttribute("y2", (105 + r * Math.sin(rad)).toFixed(2));
      }

      // slow push-in under everything (1 -> 1.025, origin 465/780)
      tl.fromTo("#scene", { scale: 1 }, { scale: 1.025, duration: 9.6, ease: "sine.inOut" }, 0);

      // ---------- ACT 1 (magenta): the blank tab, t=0 entrance ----------
      tl.fromTo("#win", { opacity: 0.55, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0);
      // spinner: constant rotation is the point (ease none permitted); 0.9s/turn,
      // repeat 5 -> 0.2 + 6*0.9 = 5.6, then a final half turn to land before the
      // smash (5.98): 5.6 + 0.45 = 6.05 -- but the window is on its way out by then,
      // and the spinner leaves with it; nothing repeats past the fade.
      tl.fromTo("#spin", { rotation: 0 }, { rotation: 360, duration: 0.9, ease: "none", repeat: 5, immediateRender: false }, 0.2);
      tl.fromTo("#spin", { rotation: 0 }, { rotation: 180, duration: 0.44, ease: "none", immediateRender: false }, 5.61);
      // Trippi: a slow confused sway (yoyo, odd repeat: 0.6 + 8*0.55 = 5.0)
      tl.fromTo("#trippi", { rotation: -3 }, { rotation: 3, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, 0.6);
      tl.fromTo("#qq", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, 1.1);
      tl.fromTo("#qq", { y: 0 }, { y: -8, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, 1.5);
      // 1.5 + 8*0.5 = 5.5

      // stopwatch appears (0.35) and counts 0:00 -> 1:07 from 0.5 to 1.80 (lands
      // on the first "sixty-seven seconds" @1.80). Stacked digit spans, swapped with
      // zero-duration sets: only the OUTGOING span is hidden and the incoming span
      // shown -- two different targets, never a blanket hide + show at one position.
      tl.fromTo("#watch", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.35);
      const cm = document.querySelectorAll("#cm span"), ct = document.querySelectorAll("#ct span"), co = document.querySelectorAll("#co span");
      const T0 = 0.5, T1 = 1.8, N = 67;
      for (let s = 1; s <= N; s++) {
        const t = T0 + (T1 - T0) * (s / N);
        const pm = Math.floor((s - 1) / 60), pt = Math.floor(((s - 1) % 60) / 10), po = (s - 1) % 10;
        const m = Math.floor(s / 60), tt = Math.floor((s % 60) / 10), o = s % 10;
        if (o !== po) { tl.set(co[po], { opacity: 0 }, t); tl.set(co[o], { opacity: 1 }, t); }
        if (tt !== pt) { tl.set(ct[pt], { opacity: 0 }, t); tl.set(ct[tt], { opacity: 1 }, t); }
        if (m !== pm) { tl.set(cm[pm], { opacity: 0 }, t); tl.set(cm[m], { opacity: 1 }, t); }
      }
      tl.fromTo("#ring", { strokeDashoffset: 414.7 }, { strokeDashoffset: 0, duration: 1.3, ease: "none", immediateRender: false }, T0);
      tl.fromTo(hand, { a: 0 }, { a: 360 + 42, duration: 1.3, ease: "none", onUpdate: setNeedle, immediateRender: false }, T0);
      // hit on 1:07: pulse the digits + the ring glow
      tl.fromTo("#digits", { scale: 1 }, { scale: 1.12, duration: 0.14, ease: "power3.out", yoyo: true, repeat: 1, immediateRender: false }, 1.8);
      // second "sixty-seven" @4.44: pulse again
      tl.fromTo("#digits", { scale: 1 }, { scale: 1.12, duration: 0.14, ease: "power3.out", yoyo: true, repeat: 1, immediateRender: false }, 4.44);

      // ---------- LaMelo 6-7 pops @1.80 and @4.44 (~1.2s each) ----------
      function meloPop(t) {
        tl.fromTo("#melo", { opacity: 0, scale: 0.3, rotation: -12 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.25, ease: "back.out(2)", immediateRender: false }, t);
        tl.fromTo("#melo", { rotation: -4 }, { rotation: 5, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, t + 0.25);
        // hand bob: alternate up/down, 0.12s x 6 iterations -> ends t + 0.97
        tl.fromTo("#hand1", { y: 0 }, { y: -16, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, t + 0.25);
        tl.fromTo("#hand2", { y: 0 }, { y: 16, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, t + 0.25);
        tl.fromTo("#melo", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.4, duration: 0.2, ease: "power3.in", immediateRender: false }, t + 1.0);
      }
      meloPop(1.8);
      meloPop(4.44);

      // ---------- TURN @5.98 "close the tab": the X gets smashed, the window flies off ----------
      tl.fromTo("#tabx", { scale: 1, color: "#cfcfd8" }, { scale: 2.2, color: "#ff2bd6", duration: 0.16, ease: "power4.out", immediateRender: false }, 5.98);
      tl.fromTo("#crack", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.out", immediateRender: false }, 5.98);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.7, duration: 0.05, ease: "power3.out", immediateRender: false }, 6.0);
      tl.fromTo("#flash", { opacity: 0.7 }, { opacity: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 6.05);
      tl.fromTo("#win", { x: 0, y: 0, rotation: 0 }, { x: 40, y: -1500, rotation: 8, duration: 0.7, ease: "power3.in", immediateRender: false }, 6.2);
      tl.fromTo("#crack", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 6.25);
      tl.fromTo("#watch", { opacity: 1, y: 0 }, { opacity: 0, y: 40, duration: 0.35, ease: "power3.in", immediateRender: false }, 6.3);
      // colour phase-shift: magenta glow out, acid-green glow in
      tl.fromTo("#glow-a", { opacity: 1 }, { opacity: 0.2, duration: 0.8, ease: "sine.inOut", immediateRender: false }, 6.3);
      tl.fromTo("#glow-b", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut", immediateRender: false }, 6.3);

      // ---------- ACT 2 (green) @7.16 "touch grass" ----------
      tl.fromTo("#ground", { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 7.0);
      tl.fromTo("#grass", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: "back.out(1.4)", immediateRender: false }, 7.1);
      // Trippi drops in from above (act-2 body), lands on the grass, then walks left
      tl.fromTo("#trippi2", { opacity: 0, y: -420, x: 0 }, { opacity: 1, y: 0, x: 0, duration: 0.55, ease: "power3.in", immediateRender: false }, 7.05);
      tl.fromTo("#trippi2", { scaleY: 1 }, { scaleY: 0.86, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 7.6);
      tl.fromTo("#trippi2", { x: 0 }, { x: -60, duration: 1.4, ease: "none", immediateRender: false }, 7.85);
      tl.fromTo("#trippi2", { y: 0 }, { y: -18, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 7.85);
      // 7.85 + 6*0.2 = 9.05 <= 9.3 (fade start); odd repeat lands back on y=0
      tl.fromTo("#grass", { skewX: 0 }, { skewX: 6, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 7.6);
      // 7.6 + 4*0.45 = 9.4 -> too late; trimmed below to repeat 3 @0.4 = 9.2
      tl.fromTo("#tg", { opacity: 0, scale: 0.4, rotation: -8 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 7.3);
      // "Psy bow" @8.74: SYBAU slam
      tl.fromTo("#sybau", { opacity: 0, scale: 2.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.in", immediateRender: false }, 8.72);
      tl.fromTo("#scene", { x: 0 }, { x: 10, duration: 0.05, ease: "none", yoyo: true, repeat: 5, immediateRender: false }, 8.94);
      // 8.94 + 6*0.05 = 9.24

      // ---------- fade lands EXACTLY at 9.6 = 9.3 + 0.3 (288 frames on the 30fps grid) ----------
      ["#bg-fill", "#scene", "#trippi2", "#tg", "#sybau", "#grass", "#ground"].forEach((s) =>
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 9.3)
      );
      // the grain tile rests at 0.045 -- its fade MUST start from that value, not 1 (a
      // from-value of 1 rendered one frame of full-strength white noise at 9.3)
      tl.fromTo("#dither", { opacity: 0.045 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 9.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
