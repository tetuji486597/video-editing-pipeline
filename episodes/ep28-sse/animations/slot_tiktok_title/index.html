<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP28 TikTok-style Title Box (brainrot intro)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;   /* never a takeover -- the presenter stays visible */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* Copied from EP25 slot_tiktok_title (centered, margin-fixed construction).
         Stack centred on x=540 (left:0/right:0/margin:auto). Widest line is
         "EXPLAINING STREAMING" (20 chars): at 56px it would be ~740px text -> too
         wide for the <=660px box rule, so this sticker runs 44px: ~581px text + 48px
         padding = ~629px box, x = 540 +- 314.5 = 225.5..854.5; drift 1.01 about the
         top-centre origin -> 540 +- 317.6 = 222.4..857.6 (<=870).
         Measured on THIS intro take (src 23.5s scaled 1080x1920): hair top ~120,
         glasses/brow ~640-650. Stack top 230, 3 boxes x 91px + 2 x 12px gap = 297px
         -> 230..527, clears the brow by ~113px; sits over hair only (EP19
         convention: a solid box over hair is fine, over facial features is not). */
      #stack {
        position: absolute;
        left: 0;
        right: 0;
        margin: 0 auto;
        top: 230px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        /* Frame-0 state from CSS -- tl.set() at 0 never fires in this renderer, and
           the primary entrance must not be at opacity 0 on frame 0. */
        opacity: 0.6;
        transform: scale(0.94);
        transform-origin: 50% 0%;
      }
      .tt-line {
        background: #ffffff;
        color: #111111;
        font-size: 44px;
        line-height: 44px;
        font-weight: 800;
        letter-spacing: -0.5px;
        padding: 22px 24px 25px 24px;
        border-radius: 16px;
        white-space: nowrap;
        /* soft shadow only; reach 1.6*16 = ~26px, far inside every band */
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.22);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3.1"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="3.1"
        data-track-index="1"
      >
        <div id="stack">
          <div class="tt-line">EXPLAINING STREAMING</div>
          <div class="tt-line">TO GEN ALPHA</div>
          <div class="tt-line">IN 30 SECONDS</div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // The three lines are ONE sticker -- they land together.
      tl.fromTo(
        "#stack",
        { opacity: 0.6, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" },
        0
      );

      // Imperceptible drift so the motion linter's seek check advances (1.00 -> 1.01).
      tl.fromTo(
        "#stack",
        { scale: 1 },
        { scale: 1.01, duration: 2.54, ease: "none", immediateRender: false },
        0.28
      );

      // Fade FINISHES at exactly data-duration, zero buffer: 2.82 + 0.28 = 3.100.
      tl.fromTo(
        "#stack",
        { opacity: 1 },
        { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false },
        2.82
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
