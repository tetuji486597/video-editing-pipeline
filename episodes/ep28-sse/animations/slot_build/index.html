<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP28 build - one pipe, words falling down it (motion graphic)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent; /* MOTION GRAPHIC over live footage, no opaque fill */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      @font-face { font-family: "Impact"; src: local("Impact"); }
      .impact { font-family: Impact, Inter, sans-serif; }

      /* Grid-measured on the BUILD frames (src 67.2 / 72.8 / 75.0): hair top ~100,
         glasses/brow ~640-700, chin ~1180, face x 180-820. Upper band only, over
         hair: everything lives in y 214-600, x 80-850 (translucent fills + linework
         so hair reads through; the phone screen is the one darker box, 0.62). */
      #stage { position: absolute; inset: 0; opacity: 0.6; }

      /* MODEL chip: x 80-290, y 240-420 */
      #model {
        position: absolute; left: 80px; top: 240px; width: 210px; height: 180px;
        border-radius: 22px;
        background: rgba(10, 4, 20, 0.30);
        border: 2px solid rgba(255, 43, 214, 0.75);
        box-shadow: 0 0 22px rgba(255, 43, 214, 0.35);
        transform-origin: 50% 50%;
      }
      #model svg { position: absolute; left: 45px; top: 16px; width: 120px; height: 110px; }
      #model .lbl {
        position: absolute; left: 0; top: 128px; width: 100%; text-align: center;
        color: #ffd6f6; font-size: 30px; font-weight: 800; letter-spacing: 4px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      }

      /* the chute: an SVG tube from (290, 330) down to (640, 500) -- in a
         full-frame svg so the coordinates ARE canvas pixels */
      #pipe-svg { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: visible; }
      #tube-fill { fill: none; stroke: rgba(41, 240, 255, 0.16); stroke-width: 74; stroke-linecap: round; }
      #tube-edge { fill: none; stroke: #29f0ff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 0; }
      #tube-glow { fill: none; stroke: #b6ff2b; stroke-width: 84; stroke-linecap: round; opacity: 0; filter: url(#soft); }

      /* PHONE: x 640-850, y 214-600 (210 x 386) */
      #phone {
        position: absolute; left: 640px; top: 214px; width: 210px; height: 386px;
        border-radius: 30px;
        background: rgba(14, 14, 20, 0.62);
        border: 3px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.45), 0 4px 10px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        transform-origin: 50% 50%;
      }
      #notch { position: absolute; left: 70px; top: 10px; width: 64px; height: 12px; border-radius: 6px; background: rgba(255,255,255,0.4); }
      #screen { position: absolute; left: 14px; top: 40px; width: 182px; height: 320px; }
      .row { position: absolute; left: 0; width: 182px; height: 44px; display: flex; gap: 8px; align-items: center; }
      .w {
        height: 34px; line-height: 34px; padding: 0 6px; border-radius: 8px;
        background: rgba(255, 255, 255, 0.92); color: #111; font-size: 20px; font-weight: 700;
        opacity: 0; white-space: nowrap; transform-origin: 50% 50%;
      }

      /* the monkeys: each is an absolutely positioned wrapper with an explicit
         CSS left/top base (the chute start), moved by GSAP x/y (both in from AND
         to vars). Word chip rides above the monkey's head. Rest state hidden. */
      .runner { position: absolute; left: 245px; top: 265px; width: 100px; height: 130px; opacity: 0; }
      .runner img { position: absolute; left: 0; top: 40px; width: 100px; height: 90px; object-fit: contain; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5)); }
      .runner .chip {
        position: absolute; left: 6px; top: 0; height: 36px; line-height: 36px; padding: 0 10px;
        border-radius: 9px; background: #fff; color: #111; font-size: 24px; font-weight: 700; white-space: nowrap;
        box-shadow: 0 3px 8px rgba(0,0,0,0.5);
      }

      /* labels: ONE PIPE above the chute (x 330-560, y 250-300), OPEN below it */
      #onepipe {
        position: absolute; left: 330px; top: 214px; height: 56px; padding: 0 18px; border-radius: 12px;
        background: rgba(41, 240, 255, 0.92); color: #06222a; font-size: 40px; line-height: 56px; letter-spacing: 3px;
        opacity: 0; transform-origin: 50% 50%; white-space: nowrap;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }
      #open {
        position: absolute; left: 300px; top: 508px; height: 56px; padding: 0 18px; border-radius: 12px;
        background: #b6ff2b; color: #0b1a03; font-size: 40px; line-height: 56px; letter-spacing: 3px;
        opacity: 0; transform-origin: 50% 50%; white-space: nowrap;
        box-shadow: 0 0 24px rgba(182, 255, 43, 0.7), 0 4px 10px rgba(0,0,0,0.5);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.9" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="7.9" data-track-index="1">
        <div id="stage">
          <svg id="pipe-svg" viewBox="0 0 1080 1920">
            <defs>
              <filter id="soft" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
            </defs>
            <path id="tube-glow" d="M290 330 L640 500" />
            <path id="tube-fill" d="M290 330 L640 500" />
            <path id="tube-edge" d="M290 293 L640 463 M290 367 L640 537" />
          </svg>

          <div id="model">
            <svg viewBox="0 0 120 110" fill="none" stroke="#ff2bd6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M40 22 a18 18 0 0 1 36 0 a16 16 0 0 1 18 20 a16 16 0 0 1 -4 30 a18 18 0 0 1 -26 18 a18 18 0 0 1 -30 -6 a16 16 0 0 1 -12 -26 a16 16 0 0 1 8 -30 z"/>
              <path d="M58 22 v66 M40 44 h36 M46 66 h26" opacity="0.7"/>
              <circle cx="40" cy="44" r="4" fill="#ff2bd6"/><circle cx="76" cy="44" r="4" fill="#ff2bd6"/>
              <circle cx="46" cy="66" r="4" fill="#ff2bd6"/><circle cx="72" cy="66" r="4" fill="#ff2bd6"/>
              <circle cx="58" cy="88" r="4" fill="#ff2bd6"/>
            </svg>
            <div class="lbl">MODEL</div>
          </div>

          <div id="phone">
            <div id="notch"></div>
            <div id="screen">
              <div class="row" style="top: 0px"><span class="w" id="w0">chat</span><span class="w" id="w1">is</span><span class="w" id="w2">this</span></div>
              <div class="row" style="top: 56px"><span class="w" id="w3">real</span><span class="w" id="w4">6 7</span><span class="w" id="w5">fr</span></div>
              <div class="row" style="top: 112px"><span class="w" id="w6">skibidi</span></div>
              <div class="row" style="top: 168px"><span class="w" id="w7">no</span><span class="w" id="w8">cap</span></div>
            </div>
          </div>

          <div id="onepipe" class="impact">ONE PIPE</div>
          <div id="open" class="impact">OPEN</div>

          <!-- 9 monkeys, one word each -->
          <div class="runner" id="r0"><div class="chip">chat</div><img src="assets/chimpanzini_bananini_render.png" alt="" /></div>
          <div class="runner" id="r1"><div class="chip">is</div><img src="assets/chimpanzini_bananini_render.png" alt="" /></div>
          <div class="runner" id="r2"><div class="chip">this</div><img src="assets/chimpanzini_bananini_render.png" alt="" /></div>
          <div class="runner" id="r3"><div class="chip">real</div><img src="assets/chimpanzini_bananini_render.png" alt="" /></div>
          <div class="runner" id="r4"><div class="chip">6 7</div><img src="assets/chimpanzini_bananini_render.png" alt="" /></div>
          <div class="runner" id="r5"><div class="chip">fr</div><img src="assets/chimpanzini_bananini_render.png" alt="" /></div>
          <div class="runner" id="r6"><div class="chip">skibidi</div><img src="assets/chimpanzini_bananini_render.png" alt="" /></div>
          <div class="runner" id="r7"><div class="chip">no</div><img src="assets/chimpanzini_bananini_render.png" alt="" /></div>
          <div class="runner" id="r8"><div class="chip">cap</div><img src="assets/chimpanzini_bananini_render.png" alt="" /></div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // chute edge lines draw in (deterministic length measured at load)
      const edge = document.getElementById("tube-edge");
      const L = edge.getTotalLength();
      edge.style.strokeDasharray = String(L);
      edge.style.strokeDashoffset = String(L);

      // ---------- ACT 1: the rig assembles, entrance at t=0 ----------
      tl.fromTo("#stage", { opacity: 0.6 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#model", { scale: 0.7 }, { scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0);
      tl.fromTo("#tube-edge", { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 0.4);
      tl.fromTo("#tube-fill", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.6);
      tl.fromTo("#phone", { scale: 0.8, y: 20 }, { scale: 1, y: 0, duration: 0.5, ease: "back.out(1.4)", immediateRender: false }, 0.8);
      // model "thinks": a slow breathing glow on its border (odd repeat, ends 1.0+8*0.7 = 6.6)
      tl.fromTo("#model", { boxShadow: "0 0 22px rgba(255,43,214,0.35)" }, { boxShadow: "0 0 40px rgba(255,43,214,0.8)", duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, 1.0);

      // ---------- monkeys sprint down the chute ("backshots" @1.47, "the second it
      //            pops out" ~4.1). Path: (290,330) -> (640,500) in canvas px; the
      //            runner's CSS base is (245,265) so its centre-bottom sits on the
      //            tube start; x/y offsets are relative to that base. ----------
      const dx = 350, dy = 170, run = 1.1;
      const starts = [1.47, 1.95, 2.43, 2.91, 3.39, 3.87, 5.55, 6.05, 6.55];
      starts.forEach((t, i) => {
        const r = "#r" + i;
        tl.fromTo(r, { opacity: 0, x: -40, y: -20, scale: 0.6 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, t - 0.25);
        tl.fromTo(r, { x: 0, y: 0 }, { x: dx, y: dy, duration: run, ease: "power1.in", immediateRender: false }, t);
        // splat into the phone: monkey vanishes at the chute mouth, word lands on screen
        tl.fromTo(r, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.5, duration: 0.18, ease: "power3.in", immediateRender: false }, t + run - 0.05);
        tl.fromTo("#w" + i, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, t + run);
        tl.fromTo("#phone", { scale: 1 }, { scale: 1.03, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t + run);
      });

      // ---------- TURN: "one pipe" @4.87 label, "stays open" @5.59 the tube glows ----------
      tl.fromTo("#onepipe", { opacity: 0, scale: 0.4, rotation: -6 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 4.85);
      tl.fromTo("#tube-glow", { opacity: 0 }, { opacity: 0.55, duration: 0.35, ease: "power2.out", immediateRender: false }, 5.55);
      tl.fromTo("#tube-glow", { opacity: 0.55 }, { opacity: 0.25, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 5.9);
      // 5.9 + 4*0.5 = 7.9 -> too late: trimmed to repeat 3 @0.4 -> 7.5 (see below)
      tl.fromTo("#tube-fill", { stroke: "rgba(41,240,255,0.16)" }, { stroke: "rgba(182,255,43,0.30)", duration: 0.4, ease: "power2.out", immediateRender: false }, 5.55);
      tl.fromTo("#open", { opacity: 0, scale: 0.4, rotation: 6 }, { opacity: 1, scale: 1, rotation: 3, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 5.58);

      // ---------- ACT 2: words keep falling (runners 6-8 @5.55/6.05/6.55) ----------
      // (scheduled above via `starts`; last word lands at 6.55 + 1.1 = 7.65)

      // ---------- fade lands EXACTLY at 7.9 = 7.6 + 0.3 ----------
      tl.fromTo("#stage", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 7.6);
      ["#phone", "#model", "#onepipe", "#open"].forEach((s) =>
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 7.6)
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
