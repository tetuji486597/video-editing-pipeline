<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* TRANSPARENT BAND format: linework only. No #bg-fill, no vignette,
         no full-frame grain, no full-frame wash of any kind. */
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      body { font-family: Inter, sans-serif; }

      :root {
        --cy: #67e8f9;          /* crisp linework */
        --cy-glow: rgba(34, 211, 238, 0.2); /* geometric glow stroke */
      }

      #root { position: relative; width: 1080px; height: 1920px; }
      #scene { position: absolute; inset: 0; }

      /* ---------------------------------------------------------------
         ACT 1 — the baseline axis. Primary entrance, begins at local t=0
         and is VISIBLE on frame 0 (CSS opacity .55, scaleX .12).
         Element box: left 140 / top 575 / 800 x 44  ->  x 140-940, y 575-619
         Rule ink  : y 593-605 (crisp 3px at y=599 + 12px glow stroke)
         Tick ink  : y 594-613 (ticks point DOWN from the rule)
         Single dark drop-shadow, blur 6, offsetY 2
             up-reach   = 1.6*6 - 2 =  7.6  -> top    585.4
             down-reach = 1.6*6 + 2 = 11.6  -> bottom 624.6
        --------------------------------------------------------------- */
      #axis {
        position: absolute;
        left: 140px;
        top: 575px;
        width: 800px;
        height: 44px;
        overflow: visible;
        transform-origin: 50% 50%;
        transform: scaleX(0.12);
        opacity: 0.55;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.95));
      }

      /* ---------------------------------------------------------------
         ACT 1 — the three glyphs. 130x130 boxes, top 518 bottom edge.
         box y 388-518 ; single dark drop-shadow blur 7 offsetY 3
             up-reach   = 1.6*7 - 3 =  8.2
             down-reach = 1.6*7 + 3 = 14.2  -> use 14.2 both ways (safe)
             -> y 373.8 - 532.2
         x: pin 215-345, clock 475-605, amount 735-865
             + 1.6*7 = 11.2 lateral -> 203.8-356.2 / 463.8-616.2 / 723.8-876.2
        --------------------------------------------------------------- */
      .gwrap { position: absolute; top: 388px; width: 130px; height: 130px; }
      #g-pin { left: 215px; }
      #g-clk { left: 475px; }
      #g-amt { left: 735px; }
      .glyph {
        display: block;
        width: 130px;
        height: 130px;
        overflow: visible;
        filter: drop-shadow(0 3px 7px rgba(0, 0, 0, 0.95));
      }
      .ln {
        fill: none;
        stroke: var(--cy);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* geometric glow: a wide low-alpha copy of the same path.
         Adds ZERO filter reach — its extent is exactly stroke-width/2. */
      .gl {
        fill: none;
        stroke: var(--cy-glow);
        stroke-width: 16;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hand { stroke-width: 6; }
      .hand-gl { stroke-width: 14; }
      .hidden0 { opacity: 0; }

      /* ---------------------------------------------------------------
         ACT 2 — halo scrim. 400x400 centred (540,448) -> x 340-740, y 248-648.
         Peak alpha 0.32 (the transparent-band ceiling). No filter.
        --------------------------------------------------------------- */
      #halo {
        position: absolute;
        left: 340px;
        top: 248px;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(
          circle,
          rgba(6, 26, 34, 0.32) 0%,
          rgba(6, 26, 34, 0.2) 46%,
          rgba(6, 26, 34, 0) 74%
        );
      }

      /* ---------------------------------------------------------------
         ACT 2 — the baseline ring.
         circle c(540,448) r=172, crisp stroke 6 + glow stroke 20
             -> ink radius 182
         breathe scale 1.045 -> 190.2
         single dark drop-shadow blur 8 offsetY 3
             up-reach   = 1.6*8 - 3 =  9.8 -> top    248.0
             down-reach = 1.6*8 + 3 = 15.8 -> bottom 654.0
             lateral    = 1.6*8      = 12.8 -> x 337.0 - 743.2
        --------------------------------------------------------------- */
      #ring-svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
        filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.95));
      }
      #ring-glow { fill: none; stroke: rgba(34, 211, 238, 0.2); stroke-width: 20; }
      #ring { fill: none; stroke: var(--cy); stroke-width: 6; }
      #pulse { fill: none; stroke: rgba(103, 232, 249, 0.9); stroke-width: 3; opacity: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.2"
      data-width="1080"
      data-height="1920"
    >
      <section id="scene" class="clip" data-start="0" data-duration="5.2" data-track-index="1">
        <!-- ============ ACT 1 : baseline axis (visible on frame 0) ============ -->
        <svg id="axis" viewBox="0 0 800 44">
          <!-- rule: local y=24  -> canvas y=599 ; x 20..780 -> canvas 160..920 -->
          <line class="gl" x1="20" y1="24" x2="780" y2="24" stroke-width="12" />
          <line class="ln" x1="20" y1="24" x2="780" y2="24" stroke-width="3" />
          <!-- slot ticks, pointing DOWN (local 24 -> 33  =  canvas 599 -> 608) -->
          <line class="gl" x1="140" y1="24" x2="140" y2="33" stroke-width="10" />
          <line class="gl" x1="400" y1="24" x2="400" y2="33" stroke-width="10" />
          <line class="gl" x1="660" y1="24" x2="660" y2="33" stroke-width="10" />
          <line class="ln" x1="140" y1="24" x2="140" y2="33" stroke-width="3" />
          <line class="ln" x1="400" y1="24" x2="400" y2="33" stroke-width="3" />
          <line class="ln" x1="660" y1="24" x2="660" y2="33" stroke-width="3" />
        </svg>

        <!-- ============ glyph 1 : MAP PIN  ("where") ============ -->
        <div id="g-pin" class="gwrap">
          <svg class="glyph" viewBox="0 0 130 130">
            <path
              class="gl d-pin-body"
              d="M 65 118 C 55 96 31 72 31 50 A 34 34 0 1 1 99 50 C 99 72 75 96 65 118 Z"
            />
            <path
              class="ln d-pin-body"
              d="M 65 118 C 55 96 31 72 31 50 A 34 34 0 1 1 99 50 C 99 72 75 96 65 118 Z"
            />
            <circle class="gl d-pin-dot" cx="65" cy="50" r="12" />
            <circle class="ln d-pin-dot" cx="65" cy="50" r="12" />
          </svg>
        </div>

        <!-- ============ glyph 2 : CLOCK  ("when") ============ -->
        <div id="g-clk" class="gwrap">
          <svg class="glyph" viewBox="0 0 130 130">
            <circle class="gl d-clk-face" cx="65" cy="65" r="47" />
            <circle class="ln d-clk-face" cx="65" cy="65" r="47" />
            <!-- hands start at angle 0 (straight up).  x1===x2 => degenerate bbox,
                 so GSAP `rotation` is NEVER used on these; a numeric angle is
                 tweened and x2/y2 are written in onUpdate via sin/cos. -->
            <line class="gl hand-gl h-hour hidden0" x1="65" y1="65" x2="65" y2="42" />
            <line class="gl hand-gl h-min hidden0" x1="65" y1="65" x2="65" y2="31" />
            <line class="ln hand h-hour hidden0" x1="65" y1="65" x2="65" y2="42" />
            <line class="ln hand h-min hidden0" x1="65" y1="65" x2="65" y2="31" />
            <circle class="hub hidden0" cx="65" cy="65" r="9" fill="rgba(34,211,238,0.25)" />
            <circle class="hub hidden0" cx="65" cy="65" r="4" fill="#67e8f9" />
          </svg>
        </div>

        <!-- ============ glyph 3 : AMOUNT MARK  ("how much") ============ -->
        <div id="g-amt" class="gwrap">
          <svg class="glyph" viewBox="0 0 130 130">
            <path class="gl d-amt-stem" d="M 65 10 L 65 120" />
            <path
              class="gl d-amt-s"
              d="M 92 38 C 92 26 80 19 65 19 C 50 19 38 27 38 40 C 38 64 92 58 92 86 C 92 99 80 107 65 107 C 50 107 38 99 38 88"
            />
            <path class="ln d-amt-stem" d="M 65 10 L 65 120" />
            <path
              class="ln d-amt-s"
              d="M 92 38 C 92 26 80 19 65 19 C 50 19 38 27 38 40 C 38 64 92 58 92 86 C 92 99 80 107 65 107 C 50 107 38 99 38 88"
            />
          </svg>
        </div>

        <!-- ============ ACT 2 : the baseline ring ============ -->
        <div id="halo"></div>
        <svg id="ring-svg" viewBox="0 0 1080 1920">
          <circle id="pulse" cx="540" cy="448" r="26" />
          <g id="ring-g">
            <circle id="ring-glow" class="d-ring" cx="540" cy="448" r="172" />
            <circle id="ring" class="d-ring" cx="540" cy="448" r="172" />
          </g>
        </svg>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });

      /* ---- deterministic stroke-draw setup (measured at load) ---- */
      document
        .querySelectorAll(
          ".d-pin-body, .d-pin-dot, .d-clk-face, .d-amt-stem, .d-amt-s, .d-ring"
        )
        .forEach(function (el) {
          /* +4 so the gap is strictly LONGER than the path: at full offset the
             seam at the path's start point cannot leak a sub-pixel dash. */
          var len = el.getTotalLength() + 4;
          el.style.strokeDasharray = String(len);
          el.style.strokeDashoffset = String(len);
        });

      /* ---- clock hands: numeric angle -> explicit endpoint coordinates.
              NEVER GSAP `rotation` on these <line>s (x1===x2 at rest). ---- */
      var CX = 65,
        CY = 65,
        L_MIN = 34,
        L_HOUR = 23;
      var ang = { min: 0, hour: 0 };
      var minEls = document.querySelectorAll(".h-min");
      var hourEls = document.querySelectorAll(".h-hour");
      function handXY(deg, len) {
        var r = (deg * Math.PI) / 180;
        return [CX + len * Math.sin(r), CY - len * Math.cos(r)];
      }
      function writeHands() {
        var m = handXY(ang.min, L_MIN);
        var h = handXY(ang.hour, L_HOUR);
        minEls.forEach(function (e) {
          e.setAttribute("x2", m[0].toFixed(2));
          e.setAttribute("y2", m[1].toFixed(2));
        });
        hourEls.forEach(function (e) {
          e.setAttribute("x2", h[0].toFixed(2));
          e.setAttribute("y2", h[1].toFixed(2));
        });
      }
      var MIN_END = 312,
        HOUR_END = 26;
      var mEnd = handXY(MIN_END, L_MIN);
      var hEnd = handXY(HOUR_END, L_HOUR);

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* =====================================================================
         ACT 1 — the baseline axis extends.  Primary entrance AT local t=0,
         visible on frame 0 (CSS opacity .55 / scaleX .12).
         ===================================================================== */
      tl.fromTo(
        "#axis",
        { opacity: 0.55, scaleX: 0.12 },
        { opacity: 0.92, scaleX: 1, duration: 0.95, ease: "power3.out" },
        0
      );
      /* ambient life while the axis waits for the first word.
         repeat 3 (ODD) + yoyo -> ends on the BASE value.
         true end = 0.95 + (3+1)*0.55 = 3.15   (fade starts at 4.90) */
      tl.fromTo(
        "#axis",
        { scaleX: 1 },
        {
          scaleX: 1.012,
          duration: 0.55,
          ease: "sine.inOut",
          repeat: 3,
          yoyo: true,
          immediateRender: false,
        },
        0.95
      );

      /* ---- glyph 1 : MAP PIN  — lands on "where"  (local 1.44) ---- */
      tl.to(".d-pin-body", { strokeDashoffset: 0, duration: 0.55, ease: "power3.out" }, 1.44);
      tl.to(".d-pin-dot", { strokeDashoffset: 0, duration: 0.28, ease: "power3.out" }, 1.74);

      /* ---- glyph 2 : CLOCK — lands on "when"  (local 2.20) ---- */
      tl.to(".d-clk-face", { strokeDashoffset: 0, duration: 0.52, ease: "power3.out" }, 2.2);
      tl.fromTo(
        [".h-min", ".h-hour", ".hub"],
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "power3.out", immediateRender: false },
        2.52
      );
      tl.to(
        ang,
        {
          min: MIN_END,
          hour: HOUR_END,
          duration: 0.44,
          ease: "power2.inOut",
          onUpdate: writeHands,
        },
        2.56
      );
      /* belt-and-braces: stamp the resting hand geometry once the sweep ends.
         (a tl.set AFTER position 0 does fire, and is seek-safe) */
      tl.set(".h-min", { attr: { x2: +mEnd[0].toFixed(2), y2: +mEnd[1].toFixed(2) } }, 3.0);
      tl.set(".h-hour", { attr: { x2: +hEnd[0].toFixed(2), y2: +hEnd[1].toFixed(2) } }, 3.0);

      /* ---- glyph 3 : AMOUNT MARK — lands on "how much"  (local 3.00) ---- */
      tl.to(".d-amt-stem", { strokeDashoffset: 0, duration: 0.26, ease: "power3.out" }, 3.0);
      tl.to(".d-amt-s", { strokeDashoffset: 0, duration: 0.46, ease: "power3.out" }, 3.08);

      /* =====================================================================
         THE TURN (3.56 -> 3.92) — the three signals converge on one point
         and the flat axis collapses into it.
         ===================================================================== */
      tl.fromTo(
        "#g-pin",
        { x: 0, y: 0, scale: 1, opacity: 1 },
        { x: 260, y: -5, scale: 0.42, opacity: 0, duration: 0.36, ease: "power2.in", immediateRender: false },
        3.56
      );
      tl.fromTo(
        "#g-clk",
        { x: 0, y: 0, scale: 1, opacity: 1 },
        { x: 0, y: -5, scale: 0.42, opacity: 0, duration: 0.36, ease: "power2.in", immediateRender: false },
        3.56
      );
      tl.fromTo(
        "#g-amt",
        { x: 0, y: 0, scale: 1, opacity: 1 },
        { x: -260, y: -5, scale: 0.42, opacity: 0, duration: 0.36, ease: "power2.in", immediateRender: false },
        3.56
      );
      tl.fromTo(
        "#axis",
        { opacity: 0.92, scaleX: 1 },
        { opacity: 0, scaleX: 0.06, duration: 0.36, ease: "power2.in", immediateRender: false },
        3.56
      );

      /* impact ripple of the merge — transient, fully gone by 4.43 */
      tl.fromTo(
        "#pulse",
        { attr: { r: 26 }, opacity: 0.75 },
        { attr: { r: 195 }, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false },
        3.88
      );

      /* =====================================================================
         ACT 2 — one baseline ring, breathing.   Lands ~4.20.
         ===================================================================== */
      tl.fromTo(
        "#halo",
        { opacity: 0 },
        { opacity: 1, duration: 0.36, ease: "power3.out", immediateRender: false },
        3.92
      );
      /* power3.out => 97.3% drawn at 4.20: the ring has LANDED on 4.2. Ends 4.32. */
      tl.to(".d-ring", { strokeDashoffset: 0, duration: 0.4, ease: "power3.out" }, 3.92);

      /* breathe: repeat 1 (ODD) + yoyo -> returns to the BASE scale.
         true end = 4.32 + (1+1)*0.28 = 4.88  <  fade start 4.90 */
      tl.fromTo(
        "#ring-g",
        { scale: 1, svgOrigin: "540 448" },
        {
          scale: 1.045,
          svgOrigin: "540 448",
          duration: 0.28,
          ease: "sine.inOut",
          repeat: 1,
          yoyo: true,
          immediateRender: false,
        },
        4.32
      );

      /* =====================================================================
         FADE — one tween per visible LEAF layer (no nested fading ancestors).
         4.90 + 0.30 = 5.200 exactly, zero buffer.
         ===================================================================== */
      tl.fromTo(
        "#ring-g",
        { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false },
        4.9
      );
      tl.fromTo(
        "#halo",
        { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false },
        4.9
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
