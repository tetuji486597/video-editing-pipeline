<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP26 ai angle — regrow the gap</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* TRANSPARENT BAND over live footage -- linework only, no opaque fill.
         Face this beat is the tightest of the episode: brow ~660 (zoom-worst 646).
         All content ends by y=610 (+glow 13 -> 623). */
      #band { position: absolute; inset: 0; opacity: 0.5; }

      .bar {
        position: absolute; width: 10px; border-radius: 5px;
        background: rgba(34, 211, 238, 0.8); transform-origin: 50% 100%;
        box-shadow: 0 0 8px rgba(34, 211, 238, 0.4);
      }
      .bar.ghost {
        background: rgba(148, 163, 184, 0.25); box-shadow: none;
        border: 1px dashed rgba(239, 68, 68, 0.6);
      }
      #baseline {
        position: absolute; left: 110px; top: 492px; width: 710px; height: 3px;
        background: linear-gradient(90deg, rgba(34,211,238,0.05), rgba(34,211,238,0.45) 12%, rgba(34,211,238,0.45) 88%, rgba(34,211,238,0.05));
      }

      /* the AI shimmer beam */
      #beam {
        position: absolute; left: 0px; top: 205px; width: 90px; height: 405px;
        background: linear-gradient(90deg, rgba(167, 139, 250, 0) 0%, rgba(167, 139, 250, 0.28) 50%, rgba(167, 139, 250, 0) 100%);
        opacity: 0;
      }
      #ai-chip {
        position: absolute; left: 22px; top: 215px; width: 56px; padding: 6px 0 8px 0;
        text-align: center; border-radius: 10px;
        background: rgba(30, 20, 50, 0.4); border: 2px solid rgba(167, 139, 250, 0.75);
        font-size: 26px; color: #ddd6fe; letter-spacing: 2px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        box-shadow: 0 0 10px rgba(167, 139, 250, 0.35);
      }

      /* background-noise fuzz (dissolves) */
      .fuzz {
        position: absolute; width: 6px; height: 6px; border-radius: 50%;
        background: rgba(203, 213, 225, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.6" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="5.6" data-track-index="1">
        <div id="band">
          <div id="baseline"></div>
          <div id="beam"><div id="ai-chip" class="mono">AI</div></div>
          <!-- bars + fuzz injected in JS from literal arrays -->
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const band = document.getElementById("band");

      // ---------- the waveform with a hole in it (literal heights) ----------
      const H = [44, 78, 56, 108, 64, 90, 48, 120, 70, 96, 58, 112, 76, 88,
                 100, 82, 94, 68, 104, 52, 86, 114, 60, 92, 46, 106, 72, 98,
                 54, 110, 66, 84];
      const GAPI = [14, 15, 16, 17, 18]; // x 428-516: the missing milliseconds
      const REGROW = [52, 96, 74, 88, 62]; // literal regrown heights
      for (let i = 0; i < 32; i++) {
        const d = document.createElement("div");
        d.className = "bar" + (GAPI.includes(i) ? " ghost" : "");
        d.id = "w" + i;
        d.style.left = (120 + i * 22) + "px";
        if (GAPI.includes(i)) {
          d.style.top = "482px"; d.style.height = "8px";
        } else {
          d.style.top = (490 - H[i]) + "px"; d.style.height = H[i] + "px";
        }
        band.appendChild(d);
      }
      // separate regrown bars (final geometry in CSS; revealed by scaleY+opacity only --
      // never tween top/height, layout props snap to device pixels)
      GAPI.forEach((i, k) => {
        const d = document.createElement("div");
        d.className = "bar";
        d.id = "r" + k;
        d.style.left = (120 + i * 22) + "px";
        d.style.top = (490 - REGROW[k]) + "px";
        d.style.height = REGROW[k] + "px";
        d.style.opacity = "0";
        d.style.background = "rgba(52,211,153,0.85)";
        d.style.boxShadow = "0 0 10px rgba(52,211,153,0.5)";
        band.appendChild(d);
      });
      // fuzz speckles beneath the wave (literal scatter)
      const FUZZ = [
        [140, 548], [188, 572], [232, 552], [280, 586], [318, 560], [366, 578],
        [404, 550], [452, 590], [498, 566], [540, 548], [586, 582], [624, 556],
        [668, 574], [710, 552], [752, 588], [790, 562], [826, 576], [164, 592],
        [340, 596], [516, 594], [692, 596], [770, 594], [214, 566], [598, 560],
      ];
      FUZZ.forEach((p, i) => {
        const d = document.createElement("div");
        d.className = "fuzz";
        d.id = "f" + i;
        d.style.left = p[0] + "px";
        d.style.top = p[1] + "px";
        band.appendChild(d);
      });

      // ---------- entrance at t=0: bars rise, staggered fast ----------
      tl.fromTo("#band", { opacity: 0.5 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
      for (let i = 0; i < 32; i++) {
        if (GAPI.includes(i)) continue;
        tl.fromTo("#w" + i, { scaleY: 0.25 }, { scaleY: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.05 + (i % 9) * 0.045);
        // ambient breathing, odd repeats, ends 0.65 + 10*0.4 = 4.65 < 5.3
        tl.fromTo("#w" + i, { scaleY: 1 }, { scaleY: 1.14, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 9, immediateRender: false }, 0.55 + (i % 3) * 0.033);
      }

      // ---------- the AI shimmer sweeps (1.6 -> 2.9) ----------
      tl.fromTo("#beam", { x: 100, opacity: 0 }, {x: 100, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 1.55);
      tl.fromTo("#beam", { x: 100 }, { x: 730, duration: 1.35, ease: "power1.inOut", immediateRender: false }, 1.6);
      tl.to("#beam", { opacity: 0, duration: 0.3, ease: "power2.out" }, 2.95);

      // ---------- the gap regrows as the beam crosses it ----------
      // ("reconstruct the missing milliseconds" 1.63-3.32: completes 3.1)
      GAPI.forEach((i, k) => {
        const t = 2.25 + k * 0.17; // beam reaches x~428 at ~2.25
        // ghost stub dissolves, the green bar grows in its place
        tl.to("#w" + i, { opacity: 0, duration: 0.2, ease: "power2.out" }, t);
        tl.fromTo("#r" + k, { scaleY: 0.05, opacity: 0 },
          { scaleY: 1, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
        // regrown bars join the breathing briefly (odd repeat, ends 3.35+4*0.4=4.95)
        tl.fromTo("#r" + k, { scaleY: 1 }, { scaleY: 1.14, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 3.35);
      });

      // ---------- the noise fuzz dissolves ("strip background noise" 3.57-4.57) ----------
      FUZZ.forEach((_, i) => {
        tl.to("#f" + i, { opacity: 0, y: 10, duration: 0.4, ease: "power2.in" }, 3.6 + (i % 8) * 0.09);
      });

      // ---------- fade: finishes at EXACTLY 5.6 (5.3 + 0.3), zero buffer ----------
      tl.fromTo("#band", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 5.3);
      // transformed leaves (bars carry scaleY, beam carries x) fade with it
      for (let i = 0; i < 32; i++) {
        tl.to("#w" + i, { opacity: 0, duration: 0.3, ease: "power2.out" }, 5.3);
      }
      GAPI.forEach((_, k) => tl.to("#r" + k, { opacity: 0, duration: 0.3, ease: "power2.out" }, 5.3));
      tl.to("#beam", { opacity: 0, duration: 0.3, ease: "power2.out" }, 5.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
