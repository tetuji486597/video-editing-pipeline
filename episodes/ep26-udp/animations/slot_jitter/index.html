<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP26 jitter buffer tank</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* HALF-PANEL, upper band. Face this beat: brow ~700 (zoom-worst 688), chin ~1180.
         Panel y 200-640 + shadow reach (blur 14, off 10): top 187.6, bottom 662.4 --
         clears y=180 and the brow. Presenter fully visible below. */
      #panel {
        position: absolute; left: 80px; top: 200px; width: 770px; height: 440px;
        border-radius: 24px;
        background: linear-gradient(170deg, rgba(10, 15, 24, 0.78), rgba(6, 9, 15, 0.85));
        border: 2px solid rgba(148, 163, 184, 0.3);
        box-shadow: 0 10px 14px rgba(0, 0, 0, 0.5);
        opacity: 0.5;
      }
      #label {
        position: absolute; left: 317px; top: 225px; width: 326px; text-align: center;
        font-size: 40px; font-weight: 800; letter-spacing: 3px; color: #e2e8f0;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        white-space: nowrap; opacity: 0;
      }

      /* the tank */
      #tank {
        position: absolute; left: 340px; top: 320px; width: 280px; height: 220px;
        border: 3px solid rgba(34, 211, 238, 0.7);
        border-top-color: rgba(34, 211, 238, 0.25);
        border-radius: 0 0 26px 26px;
        overflow: hidden;
        box-shadow: inset 0 0 24px rgba(34, 211, 238, 0.12);
      }
      /* base water level 70px; all slosh is GSAP-only scaleY about the bottom edge
         (no CSS transform -- gsap_css_transform_conflict) */
      #water-wrap { position: absolute; left: 0; bottom: 0; width: 274px; height: 70px; transform-origin: 50% 100%; }
      #water {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(34, 211, 238, 0.55), rgba(14, 116, 144, 0.75));
        border-top: 3px solid rgba(165, 243, 252, 0.8);
      }
      /* valve + handle (rotates a WRAPPER with real bounds, never a bare line) */
      #valve {
        position: absolute; left: 455px; top: 538px; width: 50px; height: 44px;
        background: rgba(15, 23, 42, 0.95); border: 2px solid rgba(148, 163, 184, 0.6);
        border-radius: 8px;
      }
      #handle-wrap {
        position: absolute; left: 460px; top: 552px; width: 40px; height: 16px;
        display: flex; align-items: center; justify-content: center;
      }
      #handle { width: 34px; height: 8px; border-radius: 4px; background: #fbbf24; }

      /* outflow pipe line */
      #out-lane {
        position: absolute; left: 505px; top: 608px; width: 320px; height: 3px;
        background: linear-gradient(90deg, rgba(34, 211, 238, 0.5), rgba(34, 211, 238, 0.06));
        opacity: 0;
      }

      .pkt-in {
        position: absolute; left: 0; top: 0; width: 30px; height: 30px;
        border-radius: 7px; background: rgba(251, 191, 36, 0.9);
        border: 2px solid rgba(254, 240, 138, 0.8);
        box-shadow: 0 0 8px rgba(251, 191, 36, 0.5); opacity: 0;
      }
      .pkt-out {
        position: absolute; left: 0; top: 0; width: 30px; height: 30px;
        border-radius: 7px; background: rgba(34, 211, 238, 0.9);
        border: 2px solid rgba(165, 243, 252, 0.8);
        box-shadow: 0 0 8px rgba(34, 211, 238, 0.5); opacity: 0;
      }

      #cap-chip {
        position: absolute; left: 660px; top: 400px; padding: 10px 16px 12px 16px;
        border-radius: 12px; background: rgba(6, 10, 18, 0.32);
        border: 2px solid rgba(34, 211, 238, 0.6);
        font-size: 34px; color: #a5f3fc; letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.25);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.0" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="5.0" data-track-index="1">
        <div id="panel"></div>
        <div id="label">JITTER BUFFER</div>
        <div id="tank"><div id="water-wrap"><div id="water"></div></div></div>
        <div id="valve"></div>
        <div id="handle-wrap"><div id="handle"></div></div>
        <div id="out-lane"></div>
        <div id="cap-chip" class="mono">~0.2s</div>
        <!-- packets injected in JS with hard-coded uneven spawn times -->
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const scene = document.getElementById("scene");

      // ---------- entrance (frame-0 panel at 0.5 from CSS) ----------
      tl.fromTo("#panel", { opacity: 0.5 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo("#tank", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.25);
      tl.fromTo("#valve", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.3);
      tl.fromTo("#handle-wrap", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.3);
      // label lands ON "tiny jitter buffer" (@0.40)
      tl.fromTo("#label", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, 0.4);

      // ---------- ACT 1: bunched, uneven arrivals (amber) ----------
      // hard-coded clumpy spawn times -- the unevenness IS the content
      const inSpawns = [0.5, 0.62, 0.71, 1.5, 1.58, 2.4, 2.9, 2.98, 3.8, 3.88, 3.96];
      inSpawns.forEach((t0, i) => {
        const d = document.createElement("div");
        d.className = "pkt-in";
        d.id = "pi" + i;
        scene.appendChild(d);
        const sel = "#pi" + i;
        // diagonal approach (110,240) -> tank mouth (465,325), then drop into the tank
        tl.fromTo(sel, { x: 110, y: 240, opacity: 0 }, { x: 110, y: 240, opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, t0);
        tl.to(sel, { x: 465, y: 325, duration: 0.45, ease: "power1.in" }, t0);
        tl.to(sel, { y: 445, opacity: 0, duration: 0.3, ease: "power2.in" }, t0 + 0.45);
      });
      // water slosh: level rises with the first clump, then uneven wobble
      // (base 70px; scaleY 1.45 -> 101px, still inside the 220px tank)
      tl.fromTo("#water-wrap", { scaleY: 1 }, { scaleY: 1.35, duration: 0.5, ease: "sine.inOut", immediateRender: false }, 0.9);
      tl.to("#water-wrap", { scaleY: 1.15, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.9);
      tl.to("#water-wrap", { scaleY: 1.42, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.15);
      // the 3.8 clump ("arriving unevenly" @3.80): a harder slosh
      tl.to("#water-wrap", { scaleY: 1.45, duration: 0.25, ease: "power2.out" }, 4.13);
      tl.to("#water-wrap", { scaleY: 1.25, duration: 0.25, ease: "sine.inOut" }, 4.38);

      // ---------- TURN @2.2: the valve opens ----------
      // rotate the handle WRAPPER (real 40x16 bounds -- rule 13 safe)
      tl.fromTo("#handle-wrap", { rotation: 0 }, { rotation: 90, duration: 0.35, ease: "power3.out", immediateRender: false }, 2.2);
      tl.fromTo("#out-lane", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.35);
      tl.fromTo("#cap-chip", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.7)", immediateRender: false }, 2.3);

      // ---------- ACT 2: perfectly even outflow (cyan) ----------
      // exact 0.3s spacing -- the evenness IS the payoff (constant velocity, ease none)
      const outSpawns = [2.5, 2.8, 3.1, 3.4, 3.7];
      outSpawns.forEach((t0, i) => {
        const d = document.createElement("div");
        d.className = "pkt-out";
        d.id = "po" + i;
        scene.appendChild(d);
        const sel = "#po" + i;
        tl.fromTo(sel, { x: 480, y: 592, opacity: 0 }, { x: 480, y: 592, opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, t0);
        tl.to(sel, { x: 790, duration: 0.9, ease: "none" }, t0);
        tl.to(sel, { opacity: 0, duration: 0.15, ease: "power2.out" }, t0 + 0.75);
      });

      // ---------- fade: finishes at EXACTLY 5.0 (4.7 + 0.3), zero buffer ----------
      ["#panel", "#label", "#tank", "#valve", "#handle-wrap", "#out-lane", "#cap-chip"].forEach((s) => {
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 4.7);
      });
      // transformed leaves (water wrapper) + any straggler packets
      tl.to("#water-wrap", { opacity: 0, duration: 0.3, ease: "power2.out" }, 4.7);
      inSpawns.forEach((_, i) => tl.to("#pi" + i, { opacity: 0, duration: 0.25, ease: "power2.out" }, 4.7));
      outSpawns.forEach((_, i) => tl.to("#po" + i, { opacity: 0, duration: 0.25, ease: "power2.out" }, 4.7));

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
