<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP22 HOOK — the push that was never asked for</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;   /* TRANSPARENT BAND format: live footage stays visible */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* LAYOUT (absolute canvas px, HOOK shot measured: face x>=330 at eye rows, cheek
         left edge ~360 below; brow ~650, eyes 700-790, chin ~1120, shoulder rises ~1150
         at x<250. TikTok band: text/UI inside x=60-860, y=180-1280.)
         - #notif-card  x 90-810,  y 350-600  (solid card over hair/neon, ABOVE brow 650)
         - #tag         x 90-~400, y 250-310  (40px above card top 350)
         - #phone       x 90-310,  y 700-1130 (left column, translucent linework;
                        glow blur 10 -> reach 16px -> x 74, y 1146, inside limits)
         - #ask-chip    x 90-~320, y 1170-1240 (40px below phone bottom 1130; floor 1280 ok)
         Pairwise: card(600) vs phone(700) gap 100; card(600) vs tag(310) gap 40;
         phone(1130) vs chip(1170) gap 40. No overlaps.
         Title sticker (A/B) spans y 210-560/440, x ~105-815: it spatially overlaps the
         card zone but the title's enable-window ENDS (fully faded) at the exact output
         time this overlay starts (zero-gap), and the only element up during hook's first
         frames is #phone (y>=700, x<=310) which clears the sticker (bottom 560) by 140px
         vertically anyway. #notif-card does not enter until local t=2.05. */

      #phone {
        position: absolute;
        left: 90px;
        top: 700px;
        width: 220px;
        height: 430px;
        border-radius: 36px;
        border: 3px solid rgba(148, 197, 255, 0.85);
        background: rgba(6, 10, 18, 0.22);           /* translucent, rule-11 style */
        box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
        opacity: 0.5;                                 /* frame-0 state from CSS */
      }
      #phone-notch {
        position: absolute;
        left: 50%;
        top: 14px;
        width: 74px;
        height: 10px;
        transform: translateX(-50%);
        border-radius: 6px;
        background: rgba(148, 197, 255, 0.55);
      }
      #phone-screen {
        position: absolute;
        inset: 16px 12px 12px 12px;
        border-radius: 26px;
        background: rgba(10, 16, 28, 0.25);
      }
      #phone-clock {
        position: absolute;
        left: 0;
        right: 0;
        top: 52px;
        text-align: center;
        color: rgba(191, 219, 254, 0.9);
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      /* echo of the push landing on the phone screen */
      #phone-echo {
        position: absolute;
        left: 50%;
        top: 120px;
        width: 156px;
        height: 54px;
        transform: translateX(-50%);
        border-radius: 12px;
        border: 2px solid rgba(74, 222, 128, 0.9);
        background: rgba(20, 40, 30, 0.35);
        box-shadow: 0 0 10px rgba(74, 222, 128, 0.45);
        opacity: 0;
      }

      #notif-card {
        position: absolute;
        left: 90px;
        top: 350px;
        width: 720px;
        height: 250px;
        border-radius: 26px;
        background: linear-gradient(165deg, rgba(248, 250, 252, 0.97), rgba(226, 232, 240, 0.95));
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        padding: 24px 32px;
        opacity: 0;
      }
      #notif-head {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #notif-icon {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: #635bff;                     /* stripe-like indigo tile */
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 30px;
        font-weight: 800;
      }
      #notif-app {
        color: #334155;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      #notif-when {
        margin-left: auto;
        color: #94a3b8;
        font-size: 24px;
      }
      #notif-title {
        margin-top: 12px;
        color: #0f172a;
        font-size: 40px;
        font-weight: 600;
      }
      #notif-amount {
        margin-top: 6px;
        color: #059669;
        font-size: 88px;
        line-height: 92px;
        font-weight: 800;
        letter-spacing: -1px;
      }

      #tag {
        position: absolute;
        left: 90px;
        top: 250px;
        height: 60px;
        padding: 0 24px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        border-radius: 14px;
        border: 2px solid rgba(251, 191, 36, 0.85);
        background: rgba(30, 20, 4, 0.30);
        box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
        color: #fcd34d;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 3px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        opacity: 0;
      }
      #tag-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fbbf24;
        box-shadow: 0 0 8px rgba(251, 191, 36, 0.9);
      }

      #ask-chip {
        position: absolute;
        left: 90px;
        top: 1170px;
        height: 70px;
        padding: 0 22px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        border-radius: 14px;
        border: 2px solid rgba(248, 113, 113, 0.85);
        background: rgba(30, 8, 8, 0.30);
        box-shadow: 0 0 10px rgba(248, 113, 113, 0.4);
        opacity: 0;
      }
      #ask-chip svg { display: block; }
      #ask-label {
        color: #fecaca;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      }
      #ask-strike {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 50%;
        height: 5px;
        border-radius: 3px;
        background: #ef4444;
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
        transform: scaleX(0);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.7"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="4.7"
        data-track-index="1"
      >
        <!-- ACT 1: idle phone, screen dim, nobody is checking -->
        <div id="phone">
          <div id="phone-notch"></div>
          <div id="phone-screen">
            <div id="phone-clock" class="mono">9:41</div>
            <div id="phone-echo"></div>
          </div>
        </div>

        <!-- TURN: the unprompted push -->
        <div id="notif-card">
          <div id="notif-head">
            <div id="notif-icon">S</div>
            <div id="notif-app">Stripe</div>
            <div id="notif-when">now</div>
          </div>
          <div id="notif-title">Payment succeeded</div>
          <div id="notif-amount" class="mono">$1,250.00</div>
        </div>

        <!-- naming tag, lands on "That's called a webhook" -->
        <div id="tag"><span id="tag-dot"></span>WEBHOOK</div>

        <!-- ACT 2: the outbound question that never happened -->
        <div id="ask-chip">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
            <path d="M10 34 L30 14" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" />
            <path d="M18 12 L30 14 L32 26" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </svg>
          <span id="ask-label" data-layout-allow-occlusion="true">never asked</span>
          <div id="ask-strike"></div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- ACT 1: phone settles in at local t=0 (entrance from CSS opacity .5) ----
      tl.fromTo("#phone", { opacity: 0.5, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0);
      // idle breathe on the dim screen: 0.6 + 4*0.55 = 2.8 -> done before fade at 4.42;
      // odd repeat (3) so it lands back on the base value.
      tl.fromTo("#phone-screen",
        { backgroundColor: "rgba(10,16,28,0.25)" },
        { backgroundColor: "rgba(16,24,40,0.38)", duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false },
        0.6);

      // ---- TURN: push notification arrives unprompted; lands on "the instant it
      // happens" (word "happens" = local 2.38-2.74 in both variants) ----
      tl.fromTo("#notif-card",
        { opacity: 0, y: -90 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false },
        2.05);
      // phone wakes on arrival
      tl.to("#phone-screen", { backgroundColor: "rgba(30,58,98,0.5)", duration: 0.18, ease: "power3.out" }, 2.35);
      tl.to("#phone", { boxShadow: "0 0 22px rgba(96,165,250,0.85)", duration: 0.2, ease: "power3.out" }, 2.35);
      tl.fromTo("#phone-echo",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power3.out", immediateRender: false },
        2.42);
      // card glow breathe: 2.75 + 2*0.8 = 4.35 -> done just before fade; odd repeat.
      tl.fromTo("#notif-card",
        { boxShadow: "0 18px 40px rgba(0,0,0,0.45)" },
        { boxShadow: "0 18px 46px rgba(5,150,105,0.35)", duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false },
        2.75);

      // ---- ACT 2: "did the app ask?" -> it never did. On "without ever checking"
      // (local 2.78-3.66). ----
      tl.fromTo("#ask-chip",
        { opacity: 0, scale: 0.85 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.5)", immediateRender: false },
        2.95);
      tl.fromTo("#ask-strike",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.28, ease: "power3.out", immediateRender: false },
        3.4);

      // naming tag on "That's called a webhook" (phrase local 3.82-4.56; entrance ends
      // 4.36, BEFORE the 4.42 fade start so the two opacity tweens never overlap) ----
      tl.fromTo("#tag",
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.6)", immediateRender: false },
        4.10);

      // ---- the phone exits EARLY (3.1-3.4): its story is done once the push landed,
      // and the presenter leans LEFT into the x 90-310 column across the back half of
      // the beat (measured: cheek edge reaches x~280 by source 55.5 = local ~3.26, and
      // x~270 with the eye in-column by 56.55 = local ~4.3) -- holding the phone to the
      // end would sit linework on his face for the last ~1.5s. ----
      tl.fromTo("#phone", { opacity: 1, x: 0 }, { opacity: 0, x: -40, duration: 0.3, ease: "power2.in", immediateRender: false }, 3.1);

      // ---- fade out: each remaining top-level leaf fades (transforms live on the
      // leaves, so no faded-ancestor-vs-transformed-child trap). Front-loaded, ends
      // EXACTLY at 4.70. ----
      for (const sel of ["#notif-card", "#ask-chip", "#tag"]) {
        tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false }, 4.42);
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
