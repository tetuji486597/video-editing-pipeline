<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP21 slot_hook — breach-warning dialog</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;   /* panel over live footage, NOT a takeover */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      #panel-all { position: absolute; inset: 0; }

      /* Chrome-style card, translucent (rule 11: lightened fill may sit over hair).
         x 90-830, y 190-520. Footage framing here: hairline ~500 (worst zoomed ~479),
         brow ~620 — bottom edge grazes only the topmost forehead in the worst case. */
      #dlg {
        position: absolute;
        left: 90px; top: 190px; width: 740px; height: 330px;
        border-radius: 20px;
        background: rgba(8, 12, 20, 0.32);
        border: 1.5px solid rgba(148, 163, 184, 0.70);
        box-shadow: 0 0 6px rgba(56, 189, 248, 0.35); /* reach 1.6*6=9.6 -> y180.4 OK */
        transform-origin: 50% 50%;
        /* Frame-0 state from CSS; fades live on THIS element because it carries the
           transform — ancestor opacity is not applied uniformly to transformed
           descendants in this renderer, so the transformed leaf fades itself. */
        opacity: 0.55;
      }
      #bar {
        position: absolute;
        left: 0; top: 0; width: 100%; height: 44px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.45);
        display: flex; align-items: center;
      }
      .dot { width: 13px; height: 13px; border-radius: 50%; margin-left: 12px;
             background: rgba(203, 213, 225, 0.75); }
      .dot:first-child { margin-left: 24px; }
      #url {
        margin-left: 22px;
        color: #cbd5e1; font-size: 20px; letter-spacing: 0.5px;
        text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      }
      #warn-icon { position: absolute; left: 40px; top: 70px; width: 60px; height: 60px; opacity: 0; }
      #dlg-title {
        position: absolute; left: 120px; top: 62px;
        color: #f8fafc; font-size: 38px; font-weight: 700; letter-spacing: -0.3px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.95), 0 0 24px rgba(0,0,0,0.7);
        opacity: 0;
      }
      #dlg-body {
        position: absolute; left: 120px; top: 122px;
        color: #cbd5e1; font-size: 24px;
        text-shadow: 0 2px 8px rgba(0,0,0,0.95);
        opacity: 0;
      }

      /* Act 2 row: local password field + outbound arrow + server chip. y 400-464 abs. */
      #pw-row { position: absolute; left: 0; top: 210px; width: 740px; height: 64px; opacity: 0; }
      #pw-field {
        position: absolute; left: 40px; top: 0; width: 320px; height: 64px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.30);
        border: 1.5px solid rgba(148, 163, 184, 0.75);
        color: #e2e8f0; font-size: 30px; letter-spacing: 4px;
        display: flex; align-items: center; padding-left: 22px;
        text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      }
      #srv-chip {
        position: absolute; left: 560px; top: 0; width: 140px; height: 64px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.30);
        border: 1.5px solid rgba(148, 163, 184, 0.75);
        color: #cbd5e1; font-size: 20px; letter-spacing: 1px;
        display: flex; align-items: center; justify-content: center;
        text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      }
      #arrow-svg { position: absolute; left: 0; top: 0; width: 740px; height: 64px; overflow: visible; }
      #x-stamp { position: absolute; left: 427px; top: 174px; width: 76px; height: 76px; opacity: 0; }
      #ok-badge { position: absolute; left: 338px; top: 188px; width: 44px; height: 44px; opacity: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.5"
      data-width="1080"
      data-height="1920"
    >
      <section id="scene" class="clip" data-start="0" data-duration="5.5" data-track-index="1">
        <div id="panel-all">
          <div id="dlg">
            <div id="bar">
              <div class="dot"></div><div class="dot"></div><div class="dot"></div>
              <div id="url" class="mono">passwords.google.com/checkup</div>
            </div>

            <svg id="warn-icon" viewBox="0 0 60 60">
              <path d="M30 6 L56 52 L4 52 Z" fill="rgba(239,68,68,0.18)"
                    stroke="#ef4444" stroke-width="3.5" stroke-linejoin="round" />
              <line x1="30" y1="24" x2="30" y2="38" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
              <circle cx="30" cy="45" r="2.6" fill="#ef4444" />
            </svg>
            <div id="dlg-title">Change your password</div>
            <div id="dlg-body">Found in a data breach</div>

            <div id="pw-row">
              <svg id="arrow-svg" viewBox="0 0 740 64">
                <path id="out-line" d="M380 32 L540 32" fill="none"
                      stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
                <path id="out-head" d="M528 22 L546 32 L528 42" fill="none"
                      stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <div id="pw-field" class="mono">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</div>
              <div id="srv-chip" class="mono">server</div>
            </div>

            <svg id="x-stamp" viewBox="0 0 76 76">
              <circle cx="38" cy="38" r="34" fill="rgba(127,29,29,0.35)"
                      stroke="#ef4444" stroke-width="4" />
              <line x1="24" y1="24" x2="52" y2="52" stroke="#ef4444" stroke-width="7" stroke-linecap="round" />
              <line x1="52" y1="24" x2="24" y2="52" stroke="#ef4444" stroke-width="7" stroke-linecap="round" />
            </svg>
            <svg id="ok-badge" viewBox="0 0 44 44">
              <circle cx="22" cy="22" r="20" fill="rgba(20,83,45,0.5)"
                      stroke="#22c55e" stroke-width="3" />
              <path d="M12 23 L19 30 L32 15" fill="none" stroke="#22c55e"
                    stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });

      // deterministic line-draw setup for the outbound arrow
      const outLine = document.getElementById("out-line");
      const llen = outLine.getTotalLength();
      outLine.style.strokeDasharray = String(llen);
      outLine.style.strokeDashoffset = String(llen);
      const outHead = document.getElementById("out-head");
      outHead.style.opacity = "0";

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- Act 1: the dialog assembles ----------
      // Entrance at t=0, frame 0 NOT transparent (CSS opacity 0.55 on #panel-all).
      tl.fromTo("#dlg", { opacity: 0.55, scale: 0.96, y: -14 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#dlg-title", { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 0.7);
      tl.fromTo("#warn-icon", { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)", immediateRender: false }, 1.1);
      tl.fromTo("#dlg-body", { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 1.35);

      // ---------- Turn (~2.0): "how did it know?" — dialog dims, the wire appears ----------
      tl.to(["#dlg-title", "#dlg-body", "#warn-icon"],
        { opacity: 0.35, duration: 0.35, ease: "power3.out" }, 2.0);
      tl.fromTo("#pw-row", { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 2.0);
      tl.to("#out-line", { strokeDashoffset: 0, duration: 0.3, ease: "power3.out" }, 2.15);
      tl.to("#out-head", { opacity: 1, duration: 0.12, ease: "power3.out" }, 2.4);

      // ---------- Act 2: the password never leaves ----------
      // X slams on the outbound arrow — lands on "you ever sending" (abs ~11.5s in A).
      tl.fromTo("#x-stamp", { opacity: 0, scale: 1.6 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 2.55);
      tl.to(["#out-line", "#out-head"], { stroke: "#ef4444", opacity: 0.55, duration: 0.25 }, 2.6);

      // Local side gets the checkmark: hashing stays on-device.
      tl.fromTo("#ok-badge", { opacity: 0, scale: 0.5 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, 3.3);
      tl.to("#pw-field", { borderColor: "rgba(34,197,94,0.85)", duration: 0.35, ease: "power3.out" }, 3.35);

      // ---------- ambient: border glow breathes (odd repeat, done before fade) ----------
      // ends 3.9 + 2*0.5 = 4.9 < 5.2 fade start.
      tl.to("#dlg", { boxShadow: "0 0 6px rgba(34,197,94,0.55)",
        duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.9);

      // ---------- fade out, FINISHING exactly at 5.5 ----------
      // On #dlg (the transformed leaf), not a wrapper — see CSS note.
      tl.fromTo("#dlg", { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 5.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
