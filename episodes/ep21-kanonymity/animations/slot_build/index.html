<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP21 slot_build — snip the prefix</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;   /* motion graphic over live footage */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* All content lives on #gfx — the transformed leaf fades itself. */
      #gfx {
        position: absolute; inset: 0;
        transform-origin: 455px 350px;
        opacity: 0.55;             /* frame-0 state from CSS */
      }

      .chip {
        position: absolute;
        border-radius: 12px;
        background: rgba(8, 12, 20, 0.30);
        border: 1.5px solid rgba(148, 163, 184, 0.70);
        color: #e2e8f0;
        display: flex; align-items: center;
        text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      }
      #hdr-chip { left: 100px; top: 195px; width: 436px; height: 42px;
                  font-size: 24px; line-height: 42px; padding-left: 14px; gap: 10px;
                  white-space: nowrap; }
      #hdr-chip svg { width: 20px; height: 30px; flex-shrink: 0; }

      #srv-chip { left: 660px; top: 206px; width: 150px; height: 38px;
                  font-size: 22px; justify-content: center; opacity: 0; }

      /* the REAL SHA-1 of password123, split 20+20, JetBrains Mono 54px (0.6em=32.4px/ch,
         20ch = 648px -> x 156-804) */
      .digest-line {
        position: absolute; left: 156px;
        color: #f1f5f9; font-size: 54px; font-weight: 700;
        letter-spacing: 0; white-space: nowrap; line-height: 60px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.95), 0 0 26px rgba(0,0,0,0.8);
        clip-path: inset(0 100% 0 0);
      }
      #dl1 { top: 282px; }
      #dl2 { top: 354px; }
      #prefix5 { color: #fbbf24; }

      #snip-svg { position: absolute; left: 280px; top: 254px; width: 120px; height: 120px;
                  overflow: visible; opacity: 0; }

      /* flying copy of the 5-char prefix */
      #fly-chip {
        position: absolute; left: 146px; top: 272px;
        padding: 4px 12px; border-radius: 10px;
        background: rgba(120, 78, 5, 0.55);
        border: 1.5px solid rgba(251, 191, 36, 0.9);
        color: #fbbf24; font-size: 54px; font-weight: 700; line-height: 60px;
        text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        opacity: 0;
      }

      #lock-chip { left: 100px; top: 456px; width: 250px; height: 48px;
                   font-size: 24px; padding-left: 14px; gap: 10px; opacity: 0; }
      #lock-chip svg { width: 26px; height: 30px; flex-shrink: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.6"
      data-width="1080"
      data-height="1920"
    >
      <section id="scene" class="clip" data-start="0" data-duration="5.6" data-track-index="1">
        <div id="gfx">
          <div id="hdr-chip" class="chip mono">
            <svg viewBox="0 0 20 30">
              <rect x="1.5" y="1.5" width="17" height="27" rx="3.5" fill="none"
                    stroke="#94a3b8" stroke-width="2" />
              <line x1="7" y1="25" x2="13" y2="25" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span>SHA-1 &middot; hashed on-device</span>
          </div>

          <div id="srv-chip" class="chip mono"><span>&#8594; server</span></div>

          <div id="dl1" class="digest-line mono"><span id="prefix5">CBFDA</span><span id="rest1">C6008F9CAB40837</span></div>
          <div id="dl2" class="digest-line mono">84CBD1874F76618D2A97</div>

          <svg id="snip-svg" viewBox="0 0 120 120">
            <line id="cut-line" x1="42" y1="10" x2="42" y2="106"
                  stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 8" />
            <g id="scissors" transform="translate(42,10)">
              <circle cx="-10" cy="-8" r="6" fill="none" stroke="#fbbf24" stroke-width="3" />
              <circle cx="10" cy="-8" r="6" fill="none" stroke="#fbbf24" stroke-width="3" />
              <line x1="-7" y1="-3" x2="8" y2="16" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
              <line x1="7" y1="-3" x2="-8" y2="16" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
            </g>
          </svg>

          <div id="fly-chip" class="mono" data-layout-allow-overlap="true">CBFDA</div>

          <div id="lock-chip" class="chip mono">
            <svg viewBox="0 0 26 30">
              <rect x="2" y="13" width="22" height="15" rx="3" fill="rgba(148,163,184,0.25)"
                    stroke="#94a3b8" stroke-width="2" />
              <path d="M7 13 V9 a6 6 0 0 1 12 0 V13" fill="none" stroke="#94a3b8" stroke-width="2.5" />
            </svg>
            <span>stays local</span>
          </div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- Act 1: the hash types out on-device ----------
      tl.fromTo("#gfx", { opacity: 0.55, scale: 0.97 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0);
      // type-on via clip-path reveal, matched to "hashes the password locally"
      tl.fromTo("#dl1", { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power1.inOut", immediateRender: false }, 0.4);
      tl.fromTo("#dl2", { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power1.inOut", immediateRender: false }, 1.15);

      // ambient: prefix glow breathes once (odd repeat; ends 1.95+2*0.5=2.95 < snip)
      tl.to("#prefix5", { textShadow: "0 0 22px rgba(251,191,36,0.95), 0 2px 8px rgba(0,0,0,0.9)",
        duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.95);

      // ---------- Turn (~3.1 local = "first five characters"): the snip ----------
      tl.fromTo("#snip-svg", { opacity: 0 },
        { opacity: 1, duration: 0.18, ease: "power3.out", immediateRender: false }, 3.05);
      // scissors ride down the cut line: translate the GROUP (real bbox), never
      // rotate/animate a bare degenerate line (rule 13)
      tl.fromTo("#scissors", { y: 0 },
        { y: 88, duration: 0.45, ease: "power2.inOut", immediateRender: false }, 3.1);
      tl.to("#prefix5", { color: "#fde68a", duration: 0.2 }, 3.15);

      // ---------- Act 2: ONLY the prefix travels; the rest stays locked ----------
      tl.fromTo("#fly-chip", { opacity: 0, x: 0, y: 0, scale: 1 },
        {x: 0, y: 0, opacity: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, 3.55);
      tl.to("#prefix5", { opacity: 0.3, duration: 0.3, ease: "power3.out" }, 3.6);
      tl.to("#fly-chip", {
        x: 512, y: -62, scale: 0.62, duration: 0.85, ease: "power2.inOut" }, 3.75);
      // resolved end pos: left 146+12(pad)~ chip x 146-333 -> at scale .62 & x+512,
      // right edge ~ 146+512+187*0.62 = 774 < 860. Fades as it "leaves".
      tl.to("#fly-chip", { opacity: 0, duration: 0.25, ease: "power2.in" }, 4.35);
      tl.fromTo("#srv-chip", { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 4.4);

      // padlock on the 35 chars that never leave — lands into "just the prefix"
      tl.fromTo("#lock-chip", { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 4.55);
      // server chip acknowledges the prefix on the word "prefix" (abs ~29.8 in A)
      tl.to("#srv-chip", { borderColor: "rgba(251,191,36,0.9)", color: "#fbbf24",
        duration: 0.25, ease: "power3.out" }, 4.85);

      // ---------- fade out, FINISHING exactly at 5.6 (on the transformed leaf) ----------
      tl.fromTo("#gfx", { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 5.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
