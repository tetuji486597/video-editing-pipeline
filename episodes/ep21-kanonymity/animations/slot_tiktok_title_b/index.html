<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP21-B TikTok-style Title Box</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* B variant: 2 boxes, abbreviated cool-tech wording (skill table: "RLLY", no
         leading "EXPLORING"). The B intro take (src 21.14) has hairline ~470-500 and
         brow ~620. User feedback fix: stack CENTRED ON x=540 (true frame centre,
         left:0;right:0 + flex centring); widest box measured 594px -> x ~243-837,
         540 + 300*1.01(drift) = ~843 <= 870. Top moved 185 -> 204 for the y>=200
         border margin (stack h 220, origin 12% -> worst drift-scaled top ~203.7).
         Bottom 204+220=424, clear of the zoom-displaced hairline (~449) by ~25px. */
      #stack {
        position: absolute;
        left: 0;
        right: 0;                 /* full-width flex column -> boxes centre on x=540 */
        top: 204px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        opacity: 0.6;
        transform: scale(0.94);
        transform-origin: 50% 12%;
      }
      .tt-line {
        background: #ffffff;
        color: #111111;
        font-size: 62px;
        line-height: 62px;
        font-weight: 800;
        letter-spacing: -0.5px;
        padding: 20px 26px 22px 26px;
        border-radius: 15px;
        white-space: nowrap;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.20);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7.4"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="7.4"
        data-track-index="1"
      >
        <div id="stack">
          <div class="tt-line">RLLY COOL TECH:</div>
          <div class="tt-line">EPISODE 21</div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#stack",
        { opacity: 0.6, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" },
        0
      );

      // Hold drift for the motion linter's seek check; fromTo to avoid the
      // gsap_css_transform_conflict trap.
      tl.fromTo(
        "#stack",
        { scale: 1 },
        { scale: 1.01, duration: 6.84, ease: "none", immediateRender: false },
        0.28
      );

      // Fade FINISHES at exactly data-duration: 7.12 + 0.28 = 7.400.
      tl.fromTo(
        "#stack",
        { opacity: 1 },
        { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false },
        7.12
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
