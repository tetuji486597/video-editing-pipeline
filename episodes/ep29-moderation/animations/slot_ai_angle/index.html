<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP29 AI angle — human in the loop (transparent band)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      .meme { font-family: Anton, Inter, sans-serif; }

      /* TRANSPARENT BAND: x 70-860, y 210-600. Grid-measured on the real AI_ANGLE frame
         (src 230s): hair top ~110 raw, brow ~660 raw / ~654 at the 1.08 zoom worst
         case. Linework + type only; the backdrop is a 0.22-alpha wash with a border
         (rule 11), so hair shows through. Band bottom 600 + shadow 22 = 622 < 654. */
      #band { position: absolute; left: 70px; top: 210px; width: 790px; height: 390px; border-radius: 22px;
        background: rgba(6, 8, 18, 0.22); border: 2px solid rgba(34, 211, 238, 0.5); opacity: 0.5;
        box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3); }
      #flash { position: absolute; left: 70px; top: 210px; width: 790px; height: 390px; border-radius: 22px; background: #fff; opacity: 0; }

      /* headline: x 70-860 centred, y 222-286 */
      #head { position: absolute; left: 70px; top: 222px; width: 790px; height: 64px; text-align: center; font-size: 56px; line-height: 64px;
        letter-spacing: 4px; color: #f8fafc; opacity: 0.5; text-shadow: 0 3px 10px rgba(0, 0, 0, 0.9), 0 0 18px rgba(34, 211, 238, 0.45); }

      /* two blocks: ROBOT x 90-440, HUMAN x 490-840; y 300-520; labels y 530-566 */
      .blk { position: absolute; top: 300px; width: 350px; height: 220px; border-radius: 16px; opacity: 0;
        border: 2px solid rgba(148, 163, 184, 0.35); background: rgba(10, 14, 26, 0.18); overflow: hidden; }
      #robot-blk { left: 90px; }
      #human-blk { left: 490px; }
      .lbl { position: absolute; top: 530px; width: 350px; height: 36px; text-align: center; font-size: 30px; line-height: 36px; letter-spacing: 4px; opacity: 0;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9); }
      #l-pile { left: 90px; color: #a5f3fc; }
      #l-goofy { left: 490px; color: #fbcfe8; }
      #l-vol { left: 90px; color: #a5f3fc; }
      #l-vibes { left: 490px; color: #fbcfe8; }

      /* robot glyph (block-local 115..235 x, 100..216 y) */
      .glyph { position: absolute; left: 115px; top: 100px; width: 120px; height: 116px; opacity: 0; }
      .glyph path, .glyph rect, .glyph circle { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      #g-robot path, #g-robot rect, #g-robot circle { stroke: #22d3ee; }
      #g-human path, #g-human circle { stroke: #f472b6; }
      /* raining post chips (24x16) inside the robot block; base at block-local (0,0) */
      .chip { position: absolute; left: 0; top: 0; width: 24px; height: 16px; border-radius: 3px; background: #a5f3fc; opacity: 0;
        box-shadow: 0 0 6px rgba(165, 243, 252, 0.7); }
      /* the one weird card: block-local x 115-235, y 10-96 (120x86) */
      #weird { position: absolute; left: 115px; top: 10px; width: 120px; height: 86px; border-radius: 10px; background: #fdf2f8; border: 2px solid #f472b6; opacity: 0;
        transform-origin: 50% 50%; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); }
      #weird svg { width: 100%; height: 100%; }
      /* loop arrow glyph between the blocks: x 435-495, y 380-440 (rotates in a wrapper) */
      #loop { position: absolute; left: 435px; top: 380px; width: 60px; height: 60px; opacity: 0; transform-origin: 50% 50%;
        filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.8)); }
      #loop path { fill: none; stroke: #e0f2fe; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      /* flex bars: block-local x 125-225, grow from y 210 up to y 20 */
      .bar { position: absolute; left: 125px; top: 20px; width: 100px; height: 190px; border-radius: 10px; opacity: 0; transform-origin: 50% 100%; transform: scaleY(0.04); }
      #bar-vol { background: linear-gradient(180deg, #a5f3fc, #0891b2); box-shadow: 0 0 14px rgba(34, 211, 238, 0.6); }
      #bar-vibes { background: linear-gradient(180deg, #fbcfe8, #db2777); box-shadow: 0 0 14px rgba(244, 114, 182, 0.6); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.5" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="9.5" data-track-index="1">
        <div id="band"></div>
        <div id="flash"></div>
        <div id="head" class="meme">HUMAN IN THE LOOP</div>

        <div class="blk" id="robot-blk">
          <div class="chip" id="c1"></div><div class="chip" id="c2"></div><div class="chip" id="c3"></div><div class="chip" id="c4"></div>
          <div class="chip" id="c5"></div><div class="chip" id="c6"></div><div class="chip" id="c7"></div><div class="chip" id="c8"></div>
          <div class="chip" id="c9"></div><div class="chip" id="c10"></div><div class="chip" id="c11"></div><div class="chip" id="c12"></div>
          <div class="chip" id="c13"></div><div class="chip" id="c14"></div><div class="chip" id="c15"></div><div class="chip" id="c16"></div>
          <div class="chip" id="c17"></div><div class="chip" id="c18"></div>
          <svg class="glyph" id="g-robot" viewBox="0 0 120 116">
            <rect x="18" y="30" width="84" height="70" rx="14"/>
            <path d="M60 30 L60 12 M52 10 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0"/>
            <rect x="34" y="50" width="18" height="14" rx="4"/><rect x="68" y="50" width="18" height="14" rx="4"/>
            <path d="M40 80 L80 80"/>
            <path d="M8 60 L18 60 M102 60 L112 60"/>
          </svg>
          <div class="bar" id="bar-vol"></div>
        </div>

        <div class="blk" id="human-blk">
          <div id="weird"><svg viewBox="0 0 120 86">
            <circle cx="60" cy="40" r="26" fill="#fcd9b6"/>
            <circle cx="50" cy="34" r="6" fill="#1f2937"/><circle cx="72" cy="38" r="3" fill="#1f2937"/>
            <path d="M46 54 C54 62 70 48 78 56" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
            <path d="M34 22 C40 4 80 4 88 24" fill="#7c3aed"/>
            <path d="M20 74 L100 74" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
          </svg></div>
          <svg class="glyph" id="g-human" viewBox="0 0 120 116">
            <circle cx="60" cy="40" r="24"/>
            <path d="M18 112 C18 80 40 70 60 70 C80 70 102 80 102 112"/>
          </svg>
          <div class="bar" id="bar-vibes"></div>
        </div>

        <div class="lbl meme" id="l-pile">GIANT PILE</div>
        <div class="lbl meme" id="l-goofy">GOOFY ONES</div>
        <div class="lbl meme" id="l-vol">VOLUME</div>
        <div class="lbl meme" id="l-vibes">VIBES</div>

        <svg id="loop" viewBox="0 0 60 60">
          <path d="M46 30 A16 16 0 1 1 30 14"/>
          <path d="M30 6 L30 22 M30 14 L40 14"/>
        </svg>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- entrance: headline lands "human in the loop" (@0.27) ----------
      tl.fromTo("#band", { opacity: 0.5, y: 22 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#head", { opacity: 0.5, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.32, ease: "power4.out" }, 0);

      // ---------- ACT 1 (cyan/pink): robot = the giant pile; human = the goofy ones ----------
      tl.fromTo("#robot-blk", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 1.2);
      tl.fromTo("#g-robot", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, 1.4);
      tl.fromTo("#l-pile", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.85);
      // the torrent: 18 chips rain from block-local y 6 to y 100 (into the robot head) in
      // 6 columns, 3 waves each, hardcoded; every x/y repeated in the to-vars
      const cols = [40, 90, 140, 190, 240, 290];
      for (let i = 0; i < 18; i++) {
        const cx = cols[i % 6] + (i % 3) * 6, t0 = 1.9 + i * 0.16;
        tl.fromTo("#c" + (i + 1), { opacity: 0, x: cx, y: 6 }, { opacity: 1, x: cx, y: 30, duration: 0.12, ease: "power2.out", immediateRender: false }, t0);
        tl.fromTo("#c" + (i + 1), { x: cx, y: 30, opacity: 1 }, { x: cx, y: 100, opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, t0 + 0.12);
      } // last chip done at 1.9 + 17*0.16 + 0.62 = 5.24
      tl.fromTo("#human-blk", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 3.0);
      tl.fromTo("#g-human", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, 3.15);
      tl.fromTo("#weird", { opacity: 0, scale: 0.5, rotation: -12 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 3.37);
      tl.fromTo("#weird", { rotation: -6 }, { rotation: 6, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 3.75); // ends 6.45
      tl.fromTo("#l-goofy", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.6);
      // the loop between them ("keeps learning from the people" ~4.9)
      tl.fromTo("#loop", { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 4.9);
      tl.fromTo("#loop", { rotation: 0 }, { rotation: 720, duration: 3.6, ease: "none", immediateRender: false }, 5.25); // ends 8.85
      tl.fromTo("#g-robot", { scale: 1 }, { scale: 1.08, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 5.3); // ends 6.5

      // ---------- TURN @6.93 ("mogs on volume"): flash, phase-shift to the flex meters ----------
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.5, duration: 0.05, ease: "power3.out", immediateRender: false }, 6.85);
      tl.to("#flash", { opacity: 0, duration: 0.25, ease: "power3.out" }, 6.9);
      tl.fromTo("#g-robot", { opacity: 1, scale: 1 }, { opacity: 0.3, scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 6.85);
      tl.fromTo("#g-human", { opacity: 1, scale: 1 }, { opacity: 0.3, scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 6.85);
      tl.fromTo("#weird", { opacity: 1, rotation: -6 }, { opacity: 0, rotation: -6, duration: 0.3, ease: "power2.out", immediateRender: false }, 6.85);
      tl.fromTo("#l-pile", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 6.85);
      tl.fromTo("#l-goofy", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 8.3);
      tl.fromTo("#band", { borderColor: "rgba(34,211,238,0.5)" }, { borderColor: "rgba(244,114,182,0.7)", duration: 0.5, ease: "power2.out", immediateRender: false }, 6.9);
      // ---------- ACT 2: VOLUME bar (robot) @6.93, VIBES bar (human) @8.47 ----------
      tl.fromTo("#bar-vol", { opacity: 1, scaleY: 0.04 }, { opacity: 1, scaleY: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 6.93);
      tl.fromTo("#l-vol", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 7.05);
      tl.fromTo("#bar-vibes", { opacity: 1, scaleY: 0.04 }, { opacity: 1, scaleY: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 8.47);
      tl.fromTo("#l-vibes", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 8.55);

      // ---------- fade: finishes at EXACTLY 9.5 (9.2 + 0.3), zero buffer; per leaf ----------
      tl.fromTo("#band", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 9.2);
      ["#head", "#robot-blk", "#human-blk", "#l-vol", "#l-vibes", "#loop", "#g-robot", "#g-human", "#bar-vol", "#bar-vibes"].forEach((s) => {
        tl.to(s, { opacity: 0, duration: 0.3, ease: "power2.out" }, 9.2);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
