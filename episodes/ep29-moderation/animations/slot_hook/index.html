<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP29 hook — a billion posts a day (half-panel)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent; /* HALF-PANEL: presenter visible below the band */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      .meme { font-family: Anton, Inter, sans-serif; }

      /* Band: x 70-860, y 210-552. Grid-measured on the real HOOK frame (src 18.5s
         scaled to 1080x1920, zoom 1.08->1.0 about (540,730)): hair top ~100 raw
         (~50 at zoom-worst), brow ~590 raw / ~579 zoom-worst, glasses 650-860,
         chin ~1220. The whole panel sits over hair/background only; panel bottom 552
         + shadow reach (6 + 1.6*10 = 22) = 574 < 579 brow. Fill is TRANSLUCENT
         (rule 11) because it overlaps hair. Every child resolves against #panel
         (position:absolute), abs = local + (70, 210). */
      #panel {
        position: absolute;
        left: 70px;
        top: 210px;
        width: 790px;
        height: 342px;
        border-radius: 22px;
        background: linear-gradient(165deg, rgba(10, 12, 26, 0.32), rgba(6, 8, 18, 0.30));
        border: 2px solid rgba(34, 211, 238, 0.55);
        box-shadow: 0 6px 10px rgba(0, 0, 0, 0.35);
        opacity: 0.5;
      }
      #flash {
        position: absolute;
        inset: 0;
        border-radius: 22px;
        background: #fff;
        opacity: 0;
      }

      /* kicker: local 16..40 -> abs y 226-250, x 100.. */
      #kicker {
        position: absolute;
        left: 30px;
        top: 16px;
        font-size: 26px;
        letter-spacing: 5px;
        color: #a5f3fc;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 14px rgba(34, 211, 238, 0.5);
      }

      /* counter: local top 50, line 112 -> abs y 260-372; 13 mono chars @100px =
         ~780px -> abs x 100-850. Explicit left/top base so a dropped transform
         degrades gracefully. Scaled 0.5 about top-left at the turn -> x 100-475,
         y 260-316. */
      #counter {
        position: absolute;
        left: 30px;
        top: 50px;
        width: 790px;
        height: 112px;
        transform-origin: 0% 0%;
      }
      .val {
        position: absolute;
        left: 0;
        top: 0;
        font-size: 100px;
        line-height: 112px;
        font-weight: 800;
        color: #fde047;
        letter-spacing: -2px;
        white-space: nowrap;
        opacity: 0;
        text-shadow: 0 3px 0 #b45309, 0 6px 18px rgba(0, 0, 0, 0.85);
      }
      #v0 { opacity: 1; } /* frame-0 state from CSS */

      /* MrBeast avatar: local 30,170 150x150 -> abs x 100-250, y 380-530.
         Real photo (CC BY 4.0, Steven Khan, Wikimedia) inset in a ring. */
      #beast {
        position: absolute;
        left: 30px;
        top: 170px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid #fde047;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform-origin: 50% 90%;
      }
      #beast img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }

      /* counting hand: local 192,196 72x92 -> abs x 262-334, y 406-498 */
      #hand {
        position: absolute;
        left: 192px;
        top: 196px;
        width: 72px;
        height: 92px;
        opacity: 0;
        transform-origin: 50% 100%;
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6));
      }
      /* sweat drop: local 150,168 -> abs x 220-242, y 378-408 */
      #sweat {
        position: absolute;
        left: 150px;
        top: 168px;
        width: 22px;
        height: 30px;
        opacity: 0;
      }

      /* the pile (clip container): local 300,160 480x172 -> abs x 370-850, y 370-542.
         Everything that "pours in" starts ABOVE the container's top edge and is
         clipped, so nothing ever draws outside the band. */
      #pile {
        position: absolute;
        left: 300px;
        top: 160px;
        width: 480px;
        height: 172px;
        overflow: hidden;
        border-radius: 12px;
      }
      .post {
        position: absolute;
        left: 0;
        top: 0;
        width: 92px;
        height: 62px;
        border-radius: 8px;
        background: #f8fafc;
        border: 2px solid #cbd5e1;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.45);
        opacity: 0;
      }
      .post::before, .post::after {
        content: "";
        position: absolute;
        left: 10px;
        height: 6px;
        border-radius: 3px;
        background: #94a3b8;
      }
      .post::before { top: 12px; width: 44px; }
      .post::after { top: 26px; width: 66px; }
      .post .av {
        position: absolute;
        right: 10px;
        top: 10px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #f472b6;
      }
      /* Trippi Troppi (confused shrimp-cat): 100x170 in pile-local (250,20)
         -> abs x 620-720, y 370-542 (head clear above the top card row, body buried) */
      #trippi {
        position: absolute;
        left: 240px;
        top: -40px;
        width: 120px;
        height: 204px;
        opacity: 0;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
      }
      /* Skibidi Toilet peeks from the pile: 72x110 at pile-local (400,62)
         -> abs x 770-842, y 432-542 */
      #toilet {
        position: absolute;
        left: 400px;
        top: 62px;
        width: 72px;
        height: 110px;
        opacity: 0;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
      }
      /* help sign: OUTSIDE the pile so it is not clipped; local 570,125 96x40 ->
         abs x 640-736, y 335-375 (+stick to 397). Appears after the counter has
         shrunk to x<=475, so it never sits on the number. */
      #help {
        position: absolute;
        left: 570px;
        top: 125px;
        width: 96px;
        height: 40px;
        background: #fff7ed;
        border: 3px solid #7c2d12;
        border-radius: 6px;
        color: #7c2d12;
        font-size: 26px;
        line-height: 34px;
        text-align: center;
        letter-spacing: 2px;
        opacity: 0;
        transform-origin: 50% 100%;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      }
      #help .stick {
        position: absolute;
        left: 44px;
        top: 34px;
        width: 5px;
        height: 24px;
        background: #7c2d12;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.2" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="5.2" data-track-index="1">
        <div id="panel">
          <div id="flash"></div>
          <div id="kicker" class="meme" data-layout-allow-overlap="true">POSTS PER DAY</div>

          <div id="counter" class="mono">
            <span class="val" id="v0">0</span>
            <span class="val" id="v1">7</span>
            <span class="val" id="v2">84</span>
            <span class="val" id="v3">913</span>
            <span class="val" id="v4">6,420</span>
            <span class="val" id="v5">58,311</span>
            <span class="val" id="v6">437,206</span>
            <span class="val" id="v7">3,905,118</span>
            <span class="val" id="v8">24,771,050</span>
            <span class="val" id="v9">199,340,612</span>
            <span class="val" id="v10">806,113,975</span>
            <span class="val" id="v11">1,000,000,000</span>
          </div>

          <div id="beast"><img src="assets/mrbeast_2023_600.jpg" alt="" /></div>
          <svg id="hand" viewBox="0 0 72 92">
            <rect x="26" y="2" width="20" height="50" rx="10" fill="#f5c9a5" stroke="#8a5a3a" stroke-width="3"/>
            <path d="M8 50 C8 40 20 38 30 40 L64 40 C70 40 70 52 64 54 L64 76 C64 86 54 92 38 92 C22 92 8 86 8 74 Z" fill="#f5c9a5" stroke="#8a5a3a" stroke-width="3" stroke-linejoin="round"/>
            <path d="M8 56 C2 58 2 70 10 72" fill="#f5c9a5" stroke="#8a5a3a" stroke-width="3" stroke-linecap="round"/>
            <path d="M40 54 L58 54 M40 66 L58 66 M40 78 L54 78" stroke="#8a5a3a" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <svg id="sweat" viewBox="0 0 22 30">
            <path d="M11 1 C11 1 21 15 21 20 A10 10 0 0 1 1 20 C1 15 11 1 11 1 Z" fill="#7dd3fc" stroke="#0369a1" stroke-width="2"/>
          </svg>

          <div id="pile">
            <img id="trippi" src="assets/trippi_troppi_render.png" alt="" />
            <div class="post" id="c1"><span class="av"></span></div>
            <div class="post" id="c2"><span class="av"></span></div>
            <div class="post" id="c3"><span class="av"></span></div>
            <div class="post" id="c4"><span class="av"></span></div>
            <div class="post" id="c5"><span class="av"></span></div>
            <div class="post" id="c6"><span class="av"></span></div>
            <div class="post" id="c7"><span class="av"></span></div>
            <div class="post" id="c8"><span class="av"></span></div>
            <div class="post" id="c9"><span class="av"></span></div>
            <div class="post" id="c10"><span class="av"></span></div>
            <div class="post" id="c11"><span class="av"></span></div>
            <div class="post" id="c12"><span class="av"></span></div>
            <div class="post" id="c13"><span class="av"></span></div>
            <div class="post" id="c14"><span class="av"></span></div>
            <img id="toilet" src="assets/skibidi_toilet_transparent.png" alt="" />
          </div>
          <div id="help" class="meme">help<span class="stick"></span></div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- ACT 1 (cyan/yellow hype): the counter spins ----------
      tl.fromTo("#panel", { opacity: 0.5, y: 22 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#kicker", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.12);

      // stacked-value spin: swap outgoing/incoming as two different targets (never a
      // blanket hide-all). Lands on 1,000,000,000 at 0.82 = spoken "billion" (4.67 out).
      const N = 12;
      for (let i = 1; i < N; i++) {
        const t = 0.05 + (i - 1) * 0.07;
        tl.set("#v" + (i - 1), { opacity: 0 }, t);
        tl.set("#v" + i, { opacity: 1 }, t);
      }
      // landing pop (explicit x/y repeated in to-vars)
      tl.fromTo("#counter", { scale: 1.1, x: 0, y: 0 }, { scale: 1, x: 0, y: 0, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 0.82);
      tl.fromTo("#v11", { textShadow: "0 3px 0 #b45309, 0 6px 18px rgba(0,0,0,0.85), 0 0 40px rgba(253,224,71,0.9)" },
        { textShadow: "0 3px 0 #b45309, 0 6px 18px rgba(0,0,0,0.85), 0 0 0px rgba(253,224,71,0)", duration: 0.8, ease: "power2.out", immediateRender: false }, 0.85);

      // MrBeast slides in on "MrBeast" (5.14 out -> 1.29 local)
      tl.fromTo("#beast", { opacity: 0, x: -40, rotation: 0 }, { opacity: 1, x: 0, rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 1.25);
      tl.fromTo("#hand", { opacity: 0, rotation: 0, y: 12 }, { opacity: 1, rotation: 0, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 1.5);
      // counting bobs: 1.6 + 6*0.13 = 2.38 end (odd repeat -> lands on base)
      tl.fromTo("#hand", { y: 0, rotation: 0 }, { y: -10, rotation: -8, duration: 0.13, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 1.6);
      // gives up on "can't even count" (6.23 out -> 2.38 local)
      tl.fromTo("#beast", { rotation: 0, x: 0 }, { rotation: -12, x: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 2.4);
      tl.fromTo("#hand", { rotation: 0, y: 0 }, { rotation: 42, y: 10, duration: 0.4, ease: "power2.in", immediateRender: false }, 2.4);
      tl.fromTo("#sweat", { opacity: 0, y: -6, x: 0 }, { opacity: 1, y: 14, x: 0, duration: 0.5, ease: "power1.in", immediateRender: false }, 2.5);

      // ---------- TURN @3.0: flash, counter recedes, colour phase-shift ----------
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.6, duration: 0.05, ease: "power3.out", immediateRender: false }, 3.0);
      tl.to("#flash", { opacity: 0, duration: 0.22, ease: "power3.out" }, 3.05);
      tl.fromTo("#counter", { scale: 1, x: 0, y: 0 }, { scale: 0.5, x: 0, y: 0, duration: 0.45, ease: "power3.inOut", immediateRender: false }, 3.0);
      tl.fromTo("#panel", { borderColor: "rgba(34,211,238,0.55)" }, { borderColor: "rgba(244,114,182,0.8)", duration: 0.5, ease: "power2.out", immediateRender: false }, 3.0);
      tl.fromTo("#kicker", { color: "#a5f3fc" }, { color: "#fbcfe8", duration: 0.5, ease: "power2.out", immediateRender: false }, 3.0);
      tl.fromTo("#sweat", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 3.0);

      // ---------- ACT 2 (magenta chaos): the pile pours in, Trippi buried ----------
      // Trippi drops in from above the clip edge first, then the cards bury him.
      tl.fromTo("#trippi", { opacity: 1, y: -200, x: 0 }, { opacity: 1, y: 0, x: 0, duration: 0.42, ease: "power2.in", immediateRender: false }, 3.05);
      // hardcoded pile positions (pile-local), stacked bottom-up; all inside 480x172
      const rest = [
        [0, 110], [90, 112], [180, 108], [270, 112], [360, 106], [40, 66], [130, 70],
        [372, 66], [215, 84], [330, 88], [10, 30], [110, 32], [380, 28], [150, 92],
      ];
      rest.forEach((p, i) => {
        const rot = [-8, 5, -3, 9, -6, 4, -10, 7, -2, 6, -7, 3, -5, 8][i];
        tl.fromTo("#c" + (i + 1),
          { opacity: 1, x: p[0], y: -80, rotation: rot },
          { opacity: 1, x: p[0], y: p[1], rotation: rot, duration: 0.36, ease: "power2.in", immediateRender: false },
          3.12 + i * 0.045);
      });
      // help sign on "who's reading" (~7.6 out -> 3.75 local)
      tl.fromTo("#help", { opacity: 0, scale: 0.6, rotation: -6 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 3.75);
      tl.fromTo("#help", { rotation: -6 }, { rotation: 6, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 4.05); // ends 4.55 < fade start 4.9
      // Skibidi Toilet peeks on "skibidi posts" (7.97 out -> 4.12 local)
      tl.fromTo("#toilet", { opacity: 1, y: 120, x: 0 }, { opacity: 1, y: 0, x: 0, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, 4.12);

      // ---------- fade: finishes at EXACTLY 5.2 (4.9 + 0.3), zero buffer ----------
      tl.fromTo("#panel", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 4.9);
      // defensive per-leaf fades on transformed descendants so nothing strands
      ["#counter", "#beast", "#hand", "#help", "#trippi", "#toilet", ".post", "#kicker"].forEach((s) => {
        tl.to(s, { opacity: 0, duration: 0.3, ease: "power2.out" }, 4.9);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
