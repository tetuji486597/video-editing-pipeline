<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP24 hook — 3AM crash, nobody paged</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent; /* HALF-PANEL: upper band only, presenter stays visible */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      :root {
        --cyan: #22d3ee;
        --amber: #fbbf24;
        --red: #ef4444;
        --green: #34d399;
      }

      #content-all { position: absolute; inset: 0; opacity: 0.55; } /* frame-0 visible */

      /* ---- Act 1: status card, upper band over hair (measured: hair ~195-600, brow ~720) ---- */
      #status-card {
        position: absolute;
        left: 80px; top: 200px; width: 760px; height: 440px;
        border-radius: 22px;
        background: rgba(8, 12, 20, 0.82);
        border: 1.5px solid rgba(34, 211, 238, 0.45);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        transform-origin: 50% 50%;
      }
      #sc-header {
        position: absolute; left: 24px; top: 22px;
        color: rgba(148, 197, 220, 0.9);
        font-size: 26px; letter-spacing: 2px;
      }
      #clock-chip {
        position: absolute; left: 460px; top: 8px; width: 276px; height: 100px;
        border-radius: 14px;
        background: rgba(30, 20, 4, 0.55);
        border: 1.5px solid rgba(251, 191, 36, 0.6);
        display: flex; align-items: baseline; justify-content: center; gap: 12px;
        padding-top: 10px;
        opacity: 0;
        transform: scale(0.6);
      }
      #clock-chip .t { color: var(--amber); font-size: 72px; font-weight: 700; }
      #clock-chip .ap { color: rgba(251, 191, 36, 0.8); font-size: 32px; font-weight: 700; }

      #node-grid {
        position: absolute; left: 24px; top: 160px; width: 322px; height: 256px;
        display: grid;
        grid-template-columns: repeat(3, 98px);
        grid-template-rows: repeat(3, 76px);
        gap: 14px;
      }
      .node-tile {
        border-radius: 10px;
        background: rgba(34, 211, 238, 0.10);
        border: 1.5px solid rgba(34, 211, 238, 0.5);
        position: relative;
        opacity: 0;
      }
      .node-tile .led {
        position: absolute; right: 8px; top: 8px; width: 12px; height: 12px;
        border-radius: 50%; background: var(--green);
        box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
      }
      /* the tile that dies: r2c2 -> canvas x=216-314, y=450-526 */
      #tile-bad { position: relative; }
      #bad-red {
        position: absolute; inset: 0; border-radius: 10px;
        background: rgba(239, 68, 68, 0.35);
        border: 2px solid rgba(239, 68, 68, 0.9);
        box-shadow: 0 0 18px 2px rgba(239, 68, 68, 0.55);
        opacity: 0;
      }
      #bad-green {
        position: absolute; inset: 0; border-radius: 10px;
        background: rgba(52, 211, 153, 0.30);
        border: 2px solid rgba(52, 211, 153, 0.95);
        box-shadow: 0 0 18px 2px rgba(52, 211, 153, 0.55);
        opacity: 0;
      }
      #pulse-ring {
        position: absolute; left: -18px; top: -18px; right: -18px; bottom: -18px;
        border-radius: 16px;
        border: 3px solid rgba(52, 211, 153, 0.9);
        opacity: 0;
      }
      /* hand-drawn SVG flames on the dying tile (no emoji) */
      #flames { position: absolute; left: 8px; top: -14px; width: 82px; height: 40px; opacity: 0; }

      #rack-wrap {
        position: absolute; left: 390px; top: 160px; width: 356px; height: 256px;
        border-radius: 14px; overflow: hidden;
        border: 1.5px solid rgba(148, 197, 220, 0.4);
      }
      #rack-wrap img {
        width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%;
        filter: brightness(0.8) saturate(0.9);
      }
      #rack-scrim {
        position: absolute; inset: 0;
        background: linear-gradient(to top, rgba(6, 10, 18, 0.7), rgba(6, 10, 18, 0.05) 55%);
      }

      /* ---- Act 2: face-down phone on the nightstand (turn) ---- */
      #phone-card {
        position: absolute;
        left: 480px; top: 380px; width: 336px; height: 228px;
        border-radius: 20px;
        background: rgba(10, 13, 24, 0.9);
        border: 1.5px solid rgba(120, 140, 190, 0.45);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
        opacity: 0;
      }
      #stand-line {
        position: absolute; left: 28px; right: 28px; top: 160px; height: 3px;
        border-radius: 2px; background: rgba(120, 140, 190, 0.5);
      }
      #phone-body {
        position: absolute; left: 58px; top: 66px; width: 200px; height: 88px;
        border-radius: 26px;
        background: linear-gradient(160deg, #232a3d, #141a2b);
        border: 1.5px solid rgba(160, 175, 210, 0.4);
      }
      #phone-cam {
        position: absolute; left: 14px; top: 12px; width: 26px; height: 26px;
        border-radius: 8px;
        background: #0b0f1a;
        border: 1px solid rgba(160, 175, 210, 0.5);
      }
      #zzz { position: absolute; left: 192px; top: 4px; width: 130px; height: 70px; opacity: 0; }
      #notif-line {
        position: absolute; left: 36px; top: 176px;
        color: rgba(170, 190, 220, 0.95); font-size: 26px; letter-spacing: 1px;
      }
      #notif-line b { color: var(--cyan); font-weight: 700; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.1"
      data-width="1080"
      data-height="1920"
    >
      <section id="scene" class="clip" data-start="0" data-duration="5.1" data-track-index="1">
        <div id="content-all">
          <div id="status-card">
            <div id="sc-header" class="mono">NODE STATUS &mdash; RACK 07</div>
            <div id="clock-chip" class="mono">
              <span class="t">3:00</span><span class="ap">AM</span>
            </div>
            <div id="node-grid">
              <div class="node-tile"><span class="led"></span></div>
              <div class="node-tile"><span class="led"></span></div>
              <div class="node-tile"><span class="led"></span></div>
              <div class="node-tile"><span class="led"></span></div>
              <div class="node-tile" id="tile-bad">
                <span class="led"></span>
                <div id="bad-red"></div>
                <div id="bad-green"></div>
                <div id="pulse-ring"></div>
                <svg id="flames" viewBox="0 0 82 40" data-layout-allow-overflow="true">
                  <path d="M14 38 C10 28 16 24 15 16 C21 22 22 27 21 31 C25 28 26 22 24 16 C30 23 31 32 27 38 Z"
                        fill="rgba(251,146,60,0.9)" stroke="rgba(239,68,68,0.9)" stroke-width="1.5"/>
                  <path d="M48 38 C44 30 49 26 48 19 C53 24 54 29 53 33 C57 29 57 24 56 20 C61 27 61 33 58 38 Z"
                        fill="rgba(251,191,36,0.85)" stroke="rgba(239,68,68,0.8)" stroke-width="1.5"/>
                </svg>
              </div>
              <div class="node-tile"><span class="led"></span></div>
              <div class="node-tile"><span class="led"></span></div>
              <div class="node-tile"><span class="led"></span></div>
              <div class="node-tile"><span class="led"></span></div>
            </div>
            <div id="rack-wrap">
              <img src="assets/server_rack.jpg" alt="" data-layout-allow-occlusion="true" />
              <div id="rack-scrim"></div>
            </div>
          </div>

          <div id="phone-card">
            <div id="stand-line"></div>
            <div id="phone-body"><div id="phone-cam"></div></div>
            <svg id="zzz" viewBox="0 0 170 90" data-layout-allow-overflow="true">
              <!-- hand-drawn z wisps, not emoji -->
              <path id="z1" d="M20 76 L52 76 L22 88 L54 88" fill="none"
                    stroke="rgba(148,197,220,0.9)" stroke-width="4" stroke-linecap="round"/>
              <path id="z2" d="M70 44 L98 44 L72 56 L100 56" fill="none"
                    stroke="rgba(148,197,220,0.75)" stroke-width="4" stroke-linecap="round"/>
              <path id="z3" d="M116 12 L140 12 L118 24 L142 24" fill="none"
                    stroke="rgba(148,197,220,0.6)" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <div id="notif-line" class="mono">notifications&nbsp;&nbsp;<b>0</b></div>
          </div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- Act 1: the status wall (entrance at local t=0, frame-0 alpha from CSS) ----
      tl.fromTo("#content-all", { opacity: 0.55 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#status-card", { y: 26, scale: 0.97 }, { y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
      // ambient breathe — ends BEFORE the 1.36 recede so the two scale tweens never overlap
      tl.fromTo("#status-card", { scale: 1 }, { scale: 1.008, duration: 0.9, ease: "sine.inOut", immediateRender: false }, 0.4);

      tl.to(".node-tile", { opacity: 1, duration: 0.28, ease: "power3.out", stagger: 0.05 }, 0.25);
      tl.fromTo("#rack-wrap", { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.3);

      // clock lands ON "three AM" (A 6.962 / local 0.562)
      tl.fromTo("#clock-chip", { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.6)", immediateRender: false }, 0.56);

      // node flips red + flame/glitch flicker
      tl.fromTo("#bad-red", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power4.out", immediateRender: false }, 1.0);
      tl.to("#bad-red", { opacity: 0.55, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 7 }, 1.12); // ends 1.12+8*0.15=2.32
      tl.fromTo("#flames", { opacity: 0, scaleY: 0.6 }, { opacity: 1, scaleY: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, 1.05);
      tl.to("#flames", { opacity: 0.65, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.3); // ends 1.3+6*0.2=2.5

      // ---- Turn @1.36 ("no engineer wakes up" A 7.762): the sleeping phone ----
      tl.to("#status-card", { scale: 0.97, opacity: 0.75, duration: 0.5, ease: "power3.out" }, 1.36);
      tl.to("#rack-wrap img", { filter: "brightness(0.35) saturate(0.55)", duration: 0.5, ease: "power3.out" }, 1.36);
      tl.fromTo("#phone-card", { opacity: 0, x: 54 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 1.36);
      tl.fromTo("#notif-line", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 1.75);
      tl.fromTo("#zzz", { opacity: 0, y: 12 }, { opacity: 0.9, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 1.95);
      // wisps drift, one at a time, all complete by 4.6
      tl.fromTo("#z1", { y: 6 }, { y: -6, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.2); // ends 4.0
      tl.fromTo("#z2", { y: 4 }, { y: -8, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.5); // ends 4.1
      tl.fromTo("#z3", { y: 3 }, { y: -9, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.8); // ends 4.2

      // ---- Act 2 @3.72 ("already handled it" A 10.12): red quietly flips green ----
      tl.to("#flames", { opacity: 0, duration: 0.18, ease: "power3.out" }, 3.6);
      tl.to("#bad-red", { opacity: 0, duration: 0.2, ease: "power3.out" }, 3.7);
      tl.fromTo("#bad-green", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.72);
      tl.fromTo("#pulse-ring", { opacity: 0.9, scale: 0.85 },
        { opacity: 0, scale: 1.25, duration: 0.7, ease: "power3.out", immediateRender: false }, 3.8); // ends 4.5

      // ---- fade out finishes at EXACTLY 5.1, zero buffer ----
      tl.fromTo("#content-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 4.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
