<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP35 new component — complexity gauge, the tangle, PEOPLE PROBLEM, back to one block</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* TRANSPARENT BAND, upper band. Output 26.6-42.3 inside NEW_COMPONENT 25.2083-41.875
         (+0.43s tail). Face on this take: hair top ~130, brow ~640 (zoom 1.0->1.08 about
         (540,720): worst ~634). COUNTDOWN RESERVE x>=670,y<=330: everything above y=345
         is left of x=650 (gauge x 90-640, y 213-292); the photo card starts at y=350.
         Elements (abs px):
           gauge label x 90-~230, y 213-235 | gauge track x 90-640, y 252-292
           tile ring x 98-552, y 350-590 (8 tiles, 64px)
           photo card x 600-840, y 350-590 (ends by the x<=860 target; shadow 0 10px 12px: top reach 341, bottom 619)
           PEOPLE PROBLEM stamp box x 120-560, y 415-525, rotated -6deg -> x 115-565, y 392-548
           magnifier sweep x 150-540, y 380-570 | act-2 block x 192-472, y 397-543, check x 492-556
         Pairwise: gauge bottom 292 vs tile-ring top 350 = 58px; stamp vs gauge label: 392 vs 235.
         Stamp text sits over the tiles (graphics), never over other text. */
      #gauge-label {
        position: absolute; left: 90px; top: 213px; font-size: 22px; letter-spacing: 3px;
        color: #cbd5e1; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85); opacity: 0; white-space: nowrap;
      }
      #gtrack {
        position: absolute; left: 90px; top: 252px; width: 550px; height: 40px; border-radius: 20px;
        background: rgba(13, 18, 28, 0.66); border: 2px solid rgba(148, 163, 184, 0.4); overflow: hidden; opacity: 0;
      }
      #gfill {
        position: absolute; left: 0; top: 0; height: 36px; width: 8%; border-radius: 18px;
        background: linear-gradient(90deg, #22c55e 0%, #fbbf24 55%, #ef4444 100%);
        background-size: 546px 36px; background-repeat: no-repeat;
      }
      #knob {
        position: absolute; left: 97px; top: 259px; width: 26px; height: 26px; border-radius: 50%;
        background: #f8fafc; box-shadow: 0 0 8px rgba(0, 0, 0, 0.6); opacity: 0;
      }

      #net { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      .arrow { fill: none; stroke: rgba(148, 163, 184, 0.75); stroke-width: 3; stroke-linecap: round; opacity: 0; }
      .stile {
        position: absolute; width: 64px; height: 64px; border-radius: 10px;
        background: linear-gradient(165deg, rgba(12, 34, 48, 0.9), rgba(8, 20, 30, 0.94));
        border: 2px solid rgba(34, 211, 238, 0.7); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.45);
        display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
        gap: 4px; padding: 10px; opacity: 0;
      }
      .stile i { display: block; background: rgba(34, 211, 238, 0.55); border-radius: 2px; }
      .pkt {
        position: absolute; left: 0; top: 0; width: 14px; height: 14px; border-radius: 50%;
        background: #22d3ee; box-shadow: 0 0 10px 3px rgba(34, 211, 238, 0.8); opacity: 0;
      }
      #xfail { position: absolute; left: 276px; top: 419px; width: 40px; height: 40px; opacity: 0; }
      #mag { position: absolute; left: 150px; top: 380px; width: 130px; height: 130px; opacity: 0; }

      #photo {
        position: absolute; left: 600px; top: 350px; width: 240px; height: 240px; border-radius: 16px;
        overflow: hidden; border: 2px solid rgba(148, 163, 184, 0.45);
        box-shadow: 0 10px 12px rgba(0, 0, 0, 0.5); background: #0b0f16; opacity: 0;
      }
      #photo img { position: absolute; left: -70px; top: -32px; width: 380px; height: 253px; object-fit: cover; }
      #photo-tag {
        position: absolute; left: 0; bottom: 0; width: 100%; height: 44px; padding-left: 14px;
        display: flex; align-items: center; font-size: 20px; letter-spacing: 2px; color: #e2e8f0;
        background: linear-gradient(to top, rgba(4, 6, 10, 0.92), rgba(4, 6, 10, 0.55));
        white-space: nowrap;
      }

      #stamp {
        position: absolute; left: 120px; top: 415px; width: 440px; height: 110px;
        border: 6px solid #ef4444; border-radius: 14px; background: rgba(20, 6, 8, 0.28);
        display: flex; align-items: center; justify-content: center;
        transform: rotate(-6deg); opacity: 0;
        font-size: 42px; font-weight: 900; letter-spacing: 2px; color: #ef4444; white-space: nowrap;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.35), inset 0 0 12px rgba(239, 68, 68, 0.25);
      }

      #mono {
        position: absolute; left: 192px; top: 397px; width: 280px; height: 146px; border-radius: 12px;
        border: 3px solid rgba(52, 211, 153, 0.85); box-shadow: 0 0 16px rgba(52, 211, 153, 0.35); opacity: 0;
      }
      #check {
        position: absolute; left: 492px; top: 438px; width: 64px; height: 64px; border-radius: 50%;
        background: #22c55e; box-shadow: 0 0 14px rgba(34, 197, 94, 0.65);
        display: flex; align-items: center; justify-content: center; opacity: 0;
      }
      #check svg { width: 36px; height: 36px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.7" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="15.7" data-track-index="1">
        <div id="gauge-label" class="mono">COMPLEXITY</div>
        <div id="gtrack"><div id="gfill"></div></div>
        <div id="knob" data-layout-allow-overlap="true"></div>

        <svg id="net" viewBox="0 0 1080 1920"></svg>
        <div id="cluster"></div>
        <div class="pkt" id="p0" data-layout-allow-overlap="true"></div>
        <div class="pkt" id="p1" data-layout-allow-overlap="true"></div>
        <div class="pkt" id="p2" data-layout-allow-overlap="true"></div>
        <div class="pkt" id="p3" data-layout-allow-overlap="true"></div>
        <div id="xfail" data-layout-allow-overlap="true">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18" fill="#ef4444" />
            <path d="M12 12 L28 28 M28 12 L12 28" stroke="#fff" stroke-width="5" stroke-linecap="round" />
          </svg>
        </div>
        <div id="mag" data-layout-allow-overlap="true">
          <svg viewBox="0 0 130 130" fill="none">
            <circle cx="52" cy="52" r="40" fill="rgba(255,255,255,0.08)" stroke="#f8fafc" stroke-width="6" />
            <path d="M82 82 L118 118" stroke="#f8fafc" stroke-width="11" stroke-linecap="round" />
          </svg>
        </div>

        <div id="photo">
          <img src="assets/aws_death_star.png" alt="" data-layout-allow-overflow="true" />
          <div id="photo-tag" class="mono" data-layout-allow-overlap="true" data-layout-allow-occlusion="true">AMAZON, 2008</div>
        </div>

        <div id="stamp" data-layout-allow-overlap="true">PEOPLE PROBLEM</div>

        <div id="mono" data-layout-allow-overlap="true"></div>
        <div id="check">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#052e16" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });

      // ---- deterministic geometry ----
      // 8 tiles on a ring, centre (325,470), rx 195, ry 88, every 45deg (hard-coded)
      const C = [[520,470],[463,532],[325,558],[187,532],[130,470],[187,408],[325,382],[463,408]];
      const cluster = document.getElementById("cluster");
      C.forEach((p, i) => {
        const t = document.createElement("div");
        t.className = "stile"; t.id = "s" + i;
        t.style.left = (p[0] - 32) + "px"; t.style.top = (p[1] - 32) + "px";
        t.innerHTML = "<i></i>".repeat(9);
        cluster.appendChild(t);
      });
      // 12 calls between services
      const E = [[0,3],[0,5],[0,2],[1,4],[1,6],[2,5],[2,7],[3,6],[3,1],[4,7],[5,7],[4,6]];
      const net = document.getElementById("net");
      const NS = "http://www.w3.org/2000/svg";
      E.forEach((e, i) => {
        const l = document.createElementNS(NS, "path");
        l.setAttribute("class", "arrow"); l.setAttribute("id", "a" + i);
        l.setAttribute("d", "M" + C[e[0]][0] + "," + C[e[0]][1] + " L" + C[e[1]][0] + "," + C[e[1]][1]);
        net.appendChild(l);
        const len = l.getTotalLength();
        l.style.strokeDasharray = String(len);
        l.style.strokeDashoffset = String(len);
      });
      // packed-block targets for act 2 (64px tiles, 66px pitch, x 200-464, y 405-535)
      const T = [[200,405],[266,405],[332,405],[398,405],[200,471],[266,471],[332,471],[398,471]];

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- ACT 1 (cyan -> red): the tangle grows ----------
      // tiles pop (t=0, first tile visible on frame 0 via opacity 0.5 start)
      tl.fromTo("#s0", { opacity: 0.5, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
      for (let i = 1; i < 8; i++) {
        tl.fromTo("#s" + i, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, 0.07 * i);
      }
      // gauge appears (0.8), starts green
      tl.fromTo("#gauge-label", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.8);
      tl.fromTo("#gtrack", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.85);
      tl.fromTo("#knob", { opacity: 0, x: 18 }, { opacity: 1, x: 18, duration: 0.25, ease: "power3.out", immediateRender: false }, 0.9);
      // "adds real complexity" (1.09-2.53): calls multiply, the gauge climbs into red
      E.forEach((e, i) => {
        tl.fromTo("#a" + i, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, 1.1 + i * 0.1);
        tl.to("#a" + i, { strokeDashoffset: 0, duration: 0.45, ease: "power3.out" }, 1.1 + i * 0.1);
      });
      tl.fromTo("#gfill", { width: "8%" }, { width: "95%", duration: 1.5, ease: "power2.inOut", immediateRender: false }, 1.15);
      tl.fromTo("#knob", { x: 18 }, { x: 493, duration: 1.5, ease: "power2.inOut", immediateRender: false }, 1.15);
      // the real thing slides in on "complexity" (1.75): Amazon's 2008 dependency graph
      tl.fromTo("#photo", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 1.75);
      // "Every call now crosses a network" (2.57-4.21): packets run the calls (repeats end 2.6+3*0.9+2*0.3 = 5.9)
      const runs = [[0, 3], [1, 6], [2, 5]];
      runs.forEach((r, i) => {
        const a = C[r[0]], b = C[r[1]];
        tl.fromTo("#p" + i, { x: a[0] - 7, y: a[1] - 7, opacity: 0 },
          { x: b[0] - 7, y: b[1] - 7, opacity: 1, duration: 0.9, ease: "power1.inOut", repeat: 2, repeatDelay: 0.3, immediateRender: false }, 2.6 + i * 0.15);
      });
      // "can fail in new ways" (4.35-5.62): one call dies mid-network
      const fa = C[4], fb = C[7];
      tl.fromTo("#p3", { x: fa[0] - 7, y: fa[1] - 7, opacity: 0 },
        { x: (fa[0] + fb[0]) / 2 - 7, y: (fa[1] + fb[1]) / 2 - 7, opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 4.35);
      tl.to("#p3", { backgroundColor: "#ef4444", boxShadow: "0 0 10px 3px rgba(239,68,68,0.8)", duration: 0.15, ease: "power2.out" }, 4.8);
      tl.fromTo("#xfail", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.24, ease: "power4.out", immediateRender: false }, 4.85);
      tl.to("#a9", { stroke: "rgba(239,68,68,0.95)", strokeWidth: 4, duration: 0.2, ease: "power2.out" }, 4.85);
      tl.to("#p3", { opacity: 0, duration: 0.2, ease: "power2.out" }, 4.9);
      // "debugging gets much harder" (5.85-7.47): a magnifier hunts across the tangle
      tl.fromTo("#mag", { opacity: 0, x: 0, y: 0, scale: 0.8 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 5.9);
      tl.fromTo("#mag", { x: 0, y: 0 }, { x: 260, y: 60, duration: 1.2, ease: "sine.inOut", immediateRender: false }, 6.2);
      tl.to("#mag", { opacity: 0, duration: 0.3, ease: "power2.out" }, 7.45);
      // ambient: tiles breathe faintly (odd repeat, ends 3.0 + 6*0.55 = 6.3)
      tl.fromTo("#s6", { scale: 1 }, { scale: 1.08, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 3.0);

      // ---------- TURN @9.35 ("organizational problem" 9.31-10.34): PEOPLE PROBLEM ----------
      tl.to("#photo", { opacity: 0, x: 24, duration: 0.3, ease: "power2.in" }, 9.1);
      tl.to(".arrow", { opacity: 0.18, duration: 0.35, ease: "power2.out" }, 9.35);
      tl.to("#xfail", { opacity: 0, duration: 0.3, ease: "power2.out" }, 9.35);
      tl.to(".stile", { opacity: 0.5, duration: 0.35, ease: "power2.out" }, 9.35);
      tl.to("#gauge-label", { opacity: 0.6, duration: 0.35, ease: "power2.out" }, 9.35);
      tl.fromTo("#stamp", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power4.out", immediateRender: false }, 9.55);
      // stamp glow breathes (odd repeat: 9.9 + 4*0.6 = 12.3, before its exit at 12.9)
      tl.fromTo("#stamp",
        { boxShadow: "0 0 12px rgba(239,68,68,0.35), inset 0 0 12px rgba(239,68,68,0.25)" },
        { boxShadow: "0 0 24px rgba(239,68,68,0.7), inset 0 0 18px rgba(239,68,68,0.4)", duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 9.9);
      // "lots of teams stepping on each other" (11.29-12.70): the dim tiles jostle
      [[1, 12], [3, -12], [5, 12], [7, -12]].forEach((j, k) => {
        tl.to("#s" + j[0], { x: j[1], duration: 0.16, ease: "power2.inOut" }, 11.4 + k * 0.12);
        tl.to("#s" + j[0], { x: 0, duration: 0.24, ease: "power2.inOut" }, 11.56 + k * 0.12);
      });

      // ---------- ACT 2 @13.2 ("a monolith is usually the smarter choice" 13.2-15.09) ----------
      tl.fromTo("#stamp", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.9, duration: 0.3, ease: "power2.in", immediateRender: false }, 12.9);
      tl.to(".arrow", { opacity: 0, duration: 0.3, ease: "power2.out" }, 13.2);
      C.forEach((p, i) => {
        tl.fromTo("#s" + i, { x: 0, y: 0 }, { x: T[i][0] - (p[0] - 32), y: T[i][1] - (p[1] - 32), duration: 0.7, ease: "power3.inOut", immediateRender: false }, 13.25 + i * 0.03);
        tl.to("#s" + i, { opacity: 1, borderColor: "rgba(52,211,153,0.8)", duration: 0.4, ease: "power2.out" }, 13.5);
      });
      tl.to(".stile i", { backgroundColor: "rgba(52,211,153,0.55)", duration: 0.4, ease: "power2.out" }, 13.6);
      tl.fromTo("#mono", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 13.95);
      // the gauge falls back to green
      tl.to("#gfill", { width: "14%", duration: 0.7, ease: "power2.inOut" }, 14.2);
      tl.to("#knob", { x: 50, duration: 0.7, ease: "power2.inOut" }, 14.2);
      tl.to("#gauge-label", { opacity: 1, color: "#6ee7b7", duration: 0.4, ease: "power2.out" }, 14.3);
      // "smarter" (14.43): the check
      tl.fromTo("#check", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, 14.5);

      // ---------- fade: finishes at EXACTLY 15.7 (15.4 + 0.3), zero buffer; per-leaf ----------
      ["#gauge-label", "#gtrack", "#knob", "#mono", "#check"].forEach((s) => {
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 15.4);
      });
      [".stile", "#net", "#photo", "#stamp", "#xfail", "#mag", ".pkt"].forEach((s) => {
        tl.to(s, { opacity: 0, duration: 0.3, ease: "power2.out" }, 15.4);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
