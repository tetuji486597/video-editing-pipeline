<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP35 problem — one block, one DEPLOY button, one change breaks everything</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* MOTION GRAPHIC, upper-left column x 70-660 (the countdown reserve x>=670,y<=330 is
         never touched: nothing here goes right of x=650). Output 10.0-19.0 inside PROBLEM
         9.5417-19.0417. Face on the PROBLEM take: hair top ~130, brow ~640 (zoom 1.0->1.08
         about (540,720): brow worst ~634), so everything ends by y=550 (+shadow reach 577).
         Block card x 90-570, y 215-455; DEPLOY button x 90-570, y 480-550; status disc
         x 590-650, y 485-545. All inside x70-870 / y200-1280. */
      #blockcard {
        position: absolute; left: 90px; top: 215px; width: 480px; height: 240px;
        border-radius: 20px;
        background: linear-gradient(165deg, rgba(10, 22, 34, 0.72), rgba(6, 12, 20, 0.78));
        border: 2px solid rgba(34, 211, 238, 0.55);
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.4), 0 0 0px rgba(34, 211, 238, 0);
        opacity: 0.5;
      }
      #tag {
        position: absolute; left: 20px; top: 14px; font-size: 22px; letter-spacing: 2px;
        color: #7dd3fc; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85); opacity: 0; white-space: nowrap;
      }
      /* 12 x 6 cells in local x 20-460, y 48-222 (abs x 110-550, y 263-437) */
      #grid {
        position: absolute; left: 20px; top: 48px; width: 440px; height: 174px;
        display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(6, 1fr); gap: 4px;
      }
      .cell { background: rgba(34, 211, 238, 0.72); border-radius: 4px; opacity: 0; }
      /* ring pulse around the seed cell (r2,c4): cell abs centre (274.5, 336) -> 60px ring */
      #ring {
        position: absolute; left: 244.5px; top: 306px; width: 60px; height: 60px;
        border-radius: 50%; border: 3px solid #fbbf24; opacity: 0;
      }
      #btn {
        position: absolute; left: 90px; top: 480px; width: 480px; height: 70px;
        border-radius: 16px; background: #0369a1;
        border: 2px solid rgba(186, 230, 253, 0.6);
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.4);
        color: #f8fafc; font-size: 32px; font-weight: 800; letter-spacing: 4px;
        display: flex; align-items: center; justify-content: center; opacity: 0;
        overflow: hidden;
      }
      #btn span { position: relative; top: -3px; }
      #track {
        position: absolute; left: 12px; top: 58px; width: 452px; height: 6px;
        border-radius: 3px; background: rgba(255, 255, 255, 0.22);
      }
      #fill { position: absolute; left: 0; top: 0; height: 6px; width: 0%; border-radius: 3px; background: #f8fafc; }
      .disc {
        position: absolute; left: 590px; top: 485px; width: 60px; height: 60px;
        border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0;
      }
      .disc svg { width: 34px; height: 34px; }
      #ok { background: #22c55e; box-shadow: 0 0 12px rgba(34, 197, 94, 0.6); }
      #bad { background: #ef4444; box-shadow: 0 0 12px rgba(239, 68, 68, 0.6); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.0" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="9.0" data-track-index="1">
        <div id="blockcard">
          <div id="tag" class="mono">one code base</div>
          <div id="grid"></div>
        </div>
        <div id="ring" data-layout-allow-overlap="true"></div>
        <div id="btn"><span>DEPLOY</span><div id="track"><div id="fill"></div></div></div>
        <div id="ok" class="disc">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#052e16" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div id="bad" class="disc" data-layout-allow-overlap="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="#450a0a" stroke-width="3.5" stroke-linecap="round"/></svg>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });

      // deterministic 12x6 cell grid
      const grid = document.getElementById("grid");
      const ROWS = 6, COLS = 12, SR = 2, SC = 4;   // seed cell (row 2, col 4)
      const cells = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const d = document.createElement("div");
          d.className = "cell"; d.id = "c" + r + "_" + c;
          grid.appendChild(d);
          cells.push({ id: "#c" + r + "_" + c, r, c, d: Math.hypot(r - SR, c - SC) });
        }
      }
      const dmax = Math.max(...cells.map((k) => k.d));

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- ACT 1 (cyan): "one big code base" assembles, cell by cell ----------
      tl.fromTo("#blockcard", { opacity: 0.5, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.1);
      cells.forEach((k, i) => {
        tl.fromTo(k.id, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, 0.35 + i * 0.0135);
      });
      // "deploys as a single unit" (1.30-2.68): ONE button, pressed once
      tl.fromTo("#btn", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 1.35);
      tl.to("#btn", { scale: 0.97, duration: 0.08, ease: "power2.out" }, 2.3);
      tl.to("#btn", { scale: 1, duration: 0.22, ease: "power2.out" }, 2.38);
      tl.fromTo("#fill", { width: "0%" }, { width: "100%", duration: 0.65, ease: "power2.inOut", immediateRender: false }, 2.35);
      // "simple to start with" (2.90-3.64): green tick, soft cyan glow breathes (odd repeat, ends 4.3)
      tl.fromTo("#ok", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, 3.0);
      tl.fromTo("#blockcard",
        { boxShadow: "0 8px 12px rgba(0,0,0,0.4), 0 0 0px rgba(34,211,238,0)" },
        { boxShadow: "0 8px 12px rgba(0,0,0,0.4), 0 0 18px rgba(34,211,238,0.45)", duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 3.1);

      // ---------- TURN @4.95 ("one team's change" 4.76-5.22): one tiny change ----------
      tl.to("#c" + SR + "_" + SC, { backgroundColor: "#fbbf24", scale: 1.7, duration: 0.18, ease: "power3.out" }, 4.95);
      tl.to("#c" + SR + "_" + SC, { scale: 1, duration: 0.3, ease: "power2.out" }, 5.13);
      tl.fromTo("#ring", { opacity: 1, scale: 0.4 }, { opacity: 0, scale: 1.7, duration: 0.55, ease: "power2.out", immediateRender: false }, 4.98);
      // "can break everything" (5.74-6.63): the red wave spreads from the change
      cells.forEach((k) => {
        if (k.r === SR && k.c === SC) return;
        tl.to(k.id, { backgroundColor: "#ef4444", duration: 0.18, ease: "power2.out" }, 5.75 + 0.8 * (k.d / dmax));
      });
      tl.to("#blockcard", { borderColor: "rgba(239,68,68,0.9)", boxShadow: "0 8px 12px rgba(0,0,0,0.4), 0 0 22px rgba(239,68,68,0.5)", duration: 0.4, ease: "power2.out" }, 6.0);
      tl.to("#tag", { color: "#fca5a5", duration: 0.4, ease: "power2.out" }, 6.0);
      // shake
      tl.to("#blockcard", { x: -7, duration: 0.05, ease: "power2.out" }, 6.05);
      tl.to("#blockcard", { x: 6, duration: 0.05, ease: "power2.out" }, 6.1);
      tl.to("#blockcard", { x: -4, duration: 0.05, ease: "power2.out" }, 6.15);
      tl.to("#blockcard", { x: 0, duration: 0.08, ease: "power2.out" }, 6.2);
      // tick -> X
      tl.to("#ok", { opacity: 0, scale: 0.5, duration: 0.2, ease: "power2.in" }, 6.3);
      tl.fromTo("#bad", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.24, ease: "power4.out", immediateRender: false }, 6.4);
      tl.to("#btn", { backgroundColor: "#7f1d1d", borderColor: "rgba(252,165,165,0.5)", duration: 0.4, ease: "power2.out" }, 6.3);

      // ---------- ACT 2 @7.4 ("deploy the whole thing every time" 7.40-9.0): the heavy redeploy ----------
      tl.to("#btn", { scale: 0.97, duration: 0.08, ease: "power2.out" }, 7.45);
      tl.to("#btn", { scale: 1, duration: 0.22, ease: "power2.out" }, 7.53);
      tl.fromTo("#fill", { width: "100%" }, { width: "0%", duration: 0.06, ease: "power2.out", immediateRender: false }, 7.42);
      // crawl: constant velocity IS the point (heavy), ends before the fade
      tl.fromTo("#fill", { width: "0%" }, { width: "34%", duration: 1.2, ease: "none", immediateRender: false }, 7.52);
      // every cell has to be rebuilt: red -> grey, one by one, the whole thing
      cells.forEach((k, i) => {
        tl.to(k.id, { backgroundColor: "rgba(148,163,184,0.38)", duration: 0.16, ease: "power2.out" }, 7.6 + i * 0.012);
      });
      tl.to("#blockcard", { borderColor: "rgba(148,163,184,0.5)", boxShadow: "0 8px 12px rgba(0,0,0,0.4), 0 0 0px rgba(239,68,68,0)", duration: 0.6, ease: "power2.out" }, 7.7);

      // ---------- fade: finishes at EXACTLY 9.0 (8.7 + 0.3), zero buffer; per-leaf ----------
      ["#blockcard", "#btn", "#bad"].forEach((s) => {
        tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 8.7);
      });
      ["#ok", "#ring", "#tag"].forEach((s) => {
        tl.to(s, { opacity: 0, duration: 0.3, ease: "power2.out" }, 8.7);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
