<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP12 — AI Angle / Vector Index</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      body { font-family: Inter, "Helvetica Neue", -apple-system, sans-serif; }

      :root {
        --cyan: #22d3ee;
        --slate: #94a3b8;
        --violet: #8b5cf6;
        --violet-lt: #c4b5fd;
        --magenta: #e879f9;
        --ink: #0a0e16;
        --text: #f3f4f6;
        --dim: #7d8590;
        --mono: "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", monospace;
      }

      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .fill { position: absolute; inset: 0; }
      .clip { position: absolute; inset: 0; }

      /* ---------------- background (exempt from the 180–1280 band) ------------- */
      #bg-fill {
        background:
          radial-gradient(118% 74% at 50% 36%, #131a26 0%, #0d1320 44%, #0a0e16 74%, #05070c 100%);
      }
      #glow-cyan {
        position: absolute;
        left: 34%; top: 40%;
        width: 1250px; height: 1250px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(34, 211, 238, 0.13) 0%, rgba(34, 211, 238, 0) 62%);
      }
      #glow-violet {
        position: absolute;
        left: 66%; top: 62%;
        width: 1350px; height: 1350px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(139, 92, 246, 0.26) 0%, rgba(139, 92, 246, 0) 62%);
      }
      #vignette {
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.62) 0%,
          rgba(0, 0, 0, 0) 13%,
          rgba(0, 0, 0, 0) 76%,
          rgba(0, 0, 0, 0.7) 100%
        );
      }
      #grain { pointer-events: none; }

      /* ---------------- scene: camera push-in ----------------------------------
         Content band is y = 240 (eyebrow top) .. 1210 (chip bottom).
         Centre C = (240 + 1210) / 2 = 725  ->  transform-origin 540px 725px.
         At s = 1.05:  top' = 725 - 485*1.05 = 215.75   (>= 180 OK)
                       bot' = 725 + 485*1.05 = 1234.25  (<= 1280 OK)
      ------------------------------------------------------------------------- */
      #scene { transform-origin: 540px 725px; }
      /* same origin as #scene so the nested field settle composes about one point */
      #field-svg { position: absolute; inset: 0; transform-origin: 540px 725px; }
      #graph-svg { position: absolute; inset: 0; }

      /* ---------------- field dots -------------------------------------------- */
      #field-deep { fill: #86a8bf; }
      #field-cyan { fill: var(--cyan); }
      #field-slate { fill: var(--slate); }

      /* ---------------- graph -------------------------------------------------- */
      #top-edges, #low-edges { opacity: 0.75; }
      .top-edge {
        fill: none;
        stroke: #a78bfa;
        stroke-width: 2.4;
        stroke-linecap: round;
        opacity: 0.9;
      }
      .low-edge {
        fill: none;
        stroke: #7c6ba8;
        stroke-width: 1.7;
        stroke-linecap: round;
        opacity: 0.72;
      }
      .path-edge {
        fill: none;
        stroke: var(--magenta);
        stroke-width: 5;
        stroke-linecap: round;
        filter: drop-shadow(0 0 9px rgba(232, 121, 249, 0.85));
      }
      .n-hub { fill: #a78bfa; filter: drop-shadow(0 0 11px rgba(139, 92, 246, 0.9)); }
      .n-low { fill: #8b7fc4; filter: drop-shadow(0 0 7px rgba(139, 92, 246, 0.65)); }
      #query-dot { fill: var(--violet-lt); filter: drop-shadow(0 0 20px rgba(167, 139, 250, 1)); }
      #query-ring { fill: none; stroke: var(--violet); stroke-width: 3.5; }
      #pulse-ring { fill: none; stroke: var(--magenta); stroke-width: 4.5; }
      #found-halo {
        fill: none;
        stroke: var(--magenta);
        stroke-width: 3;
        stroke-dasharray: 13 11;
        filter: drop-shadow(0 0 16px rgba(232, 121, 249, 0.8));
      }

      /* ---------------- type ---------------------------------------------------
         eyebrow box  y 240 .. 296
         label   box  y 348 .. 426     gap = 348 - 296 = 52px  (>= 40 OK)
         chip    box  y 1024 .. 1210   gap = 1024 - 426 = 598px (>= 40 OK)
      ------------------------------------------------------------------------- */
      #eyebrow {
        position: absolute;
        left: 0; top: 240px;
        width: 1080px; height: 56px;
      }
      #eyebrow span {
        position: absolute;
        left: 0; top: 0;
        display: block;
        width: 100%;
        text-align: center;
        font-size: 44px;
        line-height: 56px;
        font-weight: 600;
        letter-spacing: 6px;
        white-space: nowrap;
        transform-origin: 50% 50%;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
      }
      #eyebrow-a { color: #67e8f9; }
      #eyebrow-b { color: #f0abfc; }

      #label {
        position: absolute;
        left: 0; top: 348px;
        width: 1080px; height: 78px;
      }
      #label span {
        position: absolute;
        left: 0; top: 0;
        display: block;
        width: 100%;
        text-align: center;
        font-size: 54px;
        line-height: 78px;
        font-weight: 800;
        letter-spacing: 2px;
        white-space: nowrap;
        transform-origin: 50% 50%;
        text-shadow: 0 3px 16px rgba(0, 0, 0, 0.9);
      }
      #label-a { color: var(--text); }
      #label-b {
        color: #ffffff;
        font-size: 88px;
        letter-spacing: 10px;
        text-shadow: 0 0 34px rgba(232, 121, 249, 0.6), 0 3px 16px rgba(0, 0, 0, 0.9);
      }

      #chip {
        position: absolute;
        left: 110px; top: 1024px;
        width: 860px; height: 186px;
        border-radius: 22px;
        border: 1px solid rgba(232, 121, 249, 0.45);
        background: rgba(20, 11, 32, 0.9);
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.6), 0 0 26px rgba(139, 92, 246, 0.25);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #chip-label {
        font-size: 44px;
        line-height: 50px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #f0abfc;
        white-space: nowrap;
      }
      #chip-readout {
        margin-top: 8px;
        font-family: var(--mono);
        font-size: 92px;
        line-height: 104px;
        font-weight: 800;
        letter-spacing: 3px;
        color: var(--text);
        white-space: nowrap;
      }
    </style>
  </head>

            </div>
          </div>

          <div id="grain" class="fill"></div>
        </div>
      </section>
    </div>

        [303,918,2.0,0.19], [649,855,1.9,0.19], [603,813,1.5,0.14], [266,884,1.6,0.16], [166,490,2.4,0.24], [320,729,2.4,0.24], [518,602,2.2,0.22],
        [741,524,2.2,0.22], [431,821,2.1,0.21], [805,662,2.7,0.28], [709,685,1.9,0.19], [567,720,1.5,0.14], [614,652,2.5,0.25], [801,598,1.5,0.14],
        [790,805,3.2,0.33], [676,776,2.7,0.28], [363,797,2.8,0.3], [558,502,1.9,0.19], [580,837,2.9,0.31], [333,592,2.2,0.22], [184,925,2.1,0.21],
        [124,721,2.6,0.26]
      ];

      function buildDots(groupId, arr) {
        const g = document.getElementById(groupId);
        for (let i = 0; i < arr.length; i++) {
          const d = arr[i];
          const c = document.createElementNS(SVGNS, "circle");
          c.setAttribute("cx", d[0]);
          c.setAttribute("cy", d[1]);
          c.setAttribute("r", d[2]);
          c.setAttribute("opacity", d[3]);
          g.appendChild(c);
        }
      }
      buildDots("field-deep", DEEP);
      buildDots("field-cyan", CYAN);
      buildDots("field-slate", SLATE);

      // ---- graph nodes -------------------------------------------------------
      const HUBS = {
        HA: [176, 892], // entry hub (bottom-left)
        HB: [318, 552],
        HC: [556, 640],
        HD: [884, 566],
        HE: [826, 900]
      };
      const LOWS = {
        L1: [430, 596], L2: [472, 760], L3: [612, 836], L4: [688, 720],
        L5: [802, 748], L6: [700, 848], L7: [812, 852], L8: [668, 762],
        L10: [900, 700], L11: [560, 700]
      };
      const Q = [742, 792];

      const HUB_ORDER = ["HA", "HB", "HC", "HD", "HE"];
      const LOW_ORDER = ["L1", "L2", "L3", "L4", "L5", "L6", "L7", "L8", "L10", "L11"];
      const NEIGHBORS = ["L5", "L6", "L7", "L8"]; // the 3-5 nearest to Q

      function node(id, pos, cls, parentId) {
        const c = document.createElementNS(SVGNS, "circle");
        c.setAttribute("id", "n-" + id);
        c.setAttribute("cx", pos[0]);
        c.setAttribute("cy", pos[1]);
        c.setAttribute("r", 0);
        c.setAttribute("class", cls);
        document.getElementById(parentId).appendChild(c);
      }
      HUB_ORDER.forEach(function (k) { node(k, HUBS[k], "n-hub", "top-nodes"); });
      LOW_ORDER.forEach(function (k) { node(k, LOWS[k], "n-low", "low-nodes"); });

      // ---- edges (paths, not <line>, so getTotalLength is always reliable) ----
      const P = Object.assign({}, HUBS, LOWS, { Q: Q });

      // sparse long-range top layer
      const TOP_EDGES = [["HA","HB"], ["HB","HC"], ["HB","HD"], ["HC","HE"], ["HD","HE"]];
      // denser lower layer
      const LOW_EDGES = [
        ["HC","L1"], ["HC","L11"], ["L11","L2"], ["HC","L4"], ["L4","L5"],
        ["L4","L8"], ["L4","Q"], ["L5","L7"], ["L8","L6"], ["L6","L7"],
        ["L3","L6"], ["HD","L10"], ["L10","L5"]
      ];
      // the traversal: HA -> HB -> HC -> L4 -> Q  == 4 hops
      const PATH_EDGES = [["HA","HB"], ["HB","HC"], ["HC","L4"], ["L4","Q"]];
      const PATH_NODES = ["HB", "HC", "L4", "Q"];

      function edge(a, b, cls, parentId, id) {
        const p = document.createElementNS(SVGNS, "path");
        p.setAttribute("d", "M " + P[a][0] + "," + P[a][1] + " L " + P[b][0] + "," + P[b][1]);
        p.setAttribute("class", cls);
        if (id) p.setAttribute("id", id);
        document.getElementById(parentId).appendChild(p);
        return p;
      }
      const topEls = TOP_EDGES.map(function (e, i) { return edge(e[0], e[1], "top-edge", "top-edges", "te" + i); });
      const lowEls = LOW_EDGES.map(function (e, i) { return edge(e[0], e[1], "low-edge", "low-edges", "le" + i); });
      const pathEls = PATH_EDGES.map(function (e, i) { return edge(e[0], e[1], "path-edge", "path-edges", "pe" + i); });

      // deterministic dash setup, measured at load
      const lens = {};
      [].concat(topEls, lowEls, pathEls).forEach(function (el) {
        const L = el.getTotalLength();
        lens[el.id] = L;
        el.style.strokeDasharray = String(L);
        el.style.strokeDashoffset = String(L);
      });

      /* =====================================================================
         TIMELINE — exactly 6.000s
         ===================================================================== */
      window.__timelines = window.__timelines || {};
      // This renderer seeks a paused timeline and screenshots immediately; tweens that
      // have to read their start value from the DOM can miss that write. Every tween
      // below is a fromTo with explicit start values, and lazy reads are disabled.
      gsap.defaults({ lazy: false });
      const tl = gsap.timeline({ paused: true });

      // initial states
      gsap.set("#field-svg", { opacity: 0.5, scale: 0.96 });
      gsap.set(["#label-a", "#eyebrow-a", "#label-b", "#eyebrow-b"], { opacity: 0 });
      gsap.set("#chip", { opacity: 0, y: 26, scale: 0.94 });
      gsap.set("#glow-violet", { opacity: 0 });
      gsap.set(["#query-halo", "#query-ring", "#pulse-ring", "#found-halo"], { opacity: 0 });

      const IR = { immediateRender: false };

      // --- camera push-in: 1 -> 1.05 about (540, 725) ------------------------
      tl.fromTo("#scene", { scale: 1 }, { scale: 1.05, duration: 6, ease: "sine.inOut" }, 0);

      /* ---------------- PHASE 1 — THE EMBEDDING SPACE (0 – 2.45) ------------ */
      // primary entrance: field is already at 0.5 opacity on frame 0
      tl.fromTo(
        "#field-svg",
        { opacity: 0.5, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.75, ease: "power3.out" },
        0
      );
      tl.fromTo("#label-a", { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0.25);
      tl.fromTo("#eyebrow-a", { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 0.52);

      // the query point lands
      tl.fromTo("#query-halo", { opacity: 0 },
        { opacity: 0.55, duration: 0.46, ease: "power3.out", immediateRender: false }, 1.42);
      tl.fromTo("#query-dot", { attr: { r: 0 } },
        { attr: { r: 13 }, duration: 0.46, ease: "back.out(2.2)", immediateRender: false }, 1.46);
      tl.fromTo("#query-ring", { opacity: 0, attr: { r: 6 } },
        { opacity: 0.9, attr: { r: 30 }, duration: 0.5, ease: "power3.out", immediateRender: false }, 1.64);
      // ambient breathe on the query glow — ends 1.90 + 6*0.48 = 4.78 (< 5.70)
      tl.fromTo("#query-halo", { opacity: 0.55 },
        { opacity: 0.92, duration: 0.48, repeat: 5, yoyo: true, ease: "sine.inOut", immediateRender: false }, 1.90);

      /* ---------------- TRANSITION (2.45 – 3.25) ---------------------------- */
      tl.fromTo("#pulse-ring", { opacity: 0.95, attr: { r: 14 } },
        { opacity: 0, attr: { r: 210 }, duration: 0.8, ease: "power3.out", immediateRender: false }, 2.45);
      tl.fromTo("#field-svg", { opacity: 1 },
        { opacity: 0.62, duration: 0.7, ease: "power3.out", immediateRender: false }, 2.45);
      // true colour interpolation on the group fill (no hue-rotate)
      tl.fromTo("#field-cyan", { fill: "#22d3ee" },
        { fill: "#8b5cf6", duration: 0.75, ease: "power3.out", immediateRender: false }, 2.45);
      tl.fromTo("#field-slate", { fill: "#94a3b8" },
        { fill: "#8b7fb0", duration: 0.75, ease: "power3.out", immediateRender: false }, 2.50);
      tl.fromTo("#field-deep", { fill: "#86a8bf" },
        { fill: "#9585c4", duration: 0.75, ease: "power3.out", immediateRender: false }, 2.54);
      tl.fromTo("#query-ring", { stroke: "#8b5cf6" },
        { stroke: "#e879f9", duration: 0.6, ease: "power3.out", immediateRender: false }, 2.48);
      tl.fromTo("#glow-violet", { opacity: 0 },
        { opacity: 1, duration: 0.8, ease: "power3.out", immediateRender: false }, 2.55);

      // label swap (stacked spans, never a tweened innerText)
      tl.set("#label-a", { opacity: 0 }, 2.58);
      tl.set("#label-b", { opacity: 1 }, 2.58);
      tl.fromTo("#label-b", { scale: 0.86 },
        { scale: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 2.58);
      tl.set("#eyebrow-a", { opacity: 0 }, 2.70);
      tl.set("#eyebrow-b", { opacity: 1 }, 2.70);
      tl.fromTo("#eyebrow-b", { scale: 0.9 },
        { scale: 1, duration: 0.38, ease: "power4.out", immediateRender: false }, 2.70);

      /* ---------------- PHASE 2 — NAVIGABLE SMALL WORLD (2.55 – 6.0) -------- */
      // top layer: a handful of hubs, then sparse long-range links
      HUB_ORDER.forEach(function (k, i) {
        tl.fromTo("#n-" + k, { attr: { r: 0 } },
          { attr: { r: 9 }, duration: 0.26, ease: "back.out(2)", immediateRender: false }, 2.80 + i * 0.055);
      });
      topEls.forEach(function (el, i) {
        tl.fromTo("#" + el.id, { strokeDashoffset: lens[el.id] },
          { strokeDashoffset: 0, duration: 0.30, ease: "power3.out", immediateRender: false }, 2.92 + i * 0.075);
      });

      // lower layer: denser nodes, then denser short links
      LOW_ORDER.forEach(function (k, i) {
        tl.fromTo("#n-" + k, { attr: { r: 0 } },
          { attr: { r: 7 }, duration: 0.22, ease: "back.out(2)", immediateRender: false }, 3.16 + i * 0.032);
      });
      lowEls.forEach(function (el, i) {
        tl.fromTo("#" + el.id, { strokeDashoffset: lens[el.id] },
          { strokeDashoffset: 0, duration: 0.24, ease: "power3.out", immediateRender: false }, 3.28 + i * 0.024);
      });

      // dim the graph so the traversal reads as sparse against it
      tl.fromTo(["#top-edges", "#low-edges"], { opacity: 0.75 },
        { opacity: 0.24, duration: 0.32, ease: "power3.out", immediateRender: false }, 3.82);

      // entry hub
      tl.fromTo("#n-HA", { fill: "#a78bfa", attr: { r: 9 } },
        { fill: "#f0abfc", attr: { r: 14 }, duration: 0.26, ease: "power3.out", immediateRender: false }, 3.84);

      // 4 discrete hops — each lights its edge, then its node
      const HOP_T = [3.92, 4.07, 4.22, 4.37];
      pathEls.forEach(function (el, i) {
        tl.fromTo("#" + el.id, { strokeDashoffset: lens[el.id] },
          { strokeDashoffset: 0, duration: 0.17, ease: "power3.out", immediateRender: false }, HOP_T[i]);
      });
      PATH_NODES.forEach(function (k, i) {
        if (k === "Q") {
          tl.fromTo("#query-dot", { attr: { r: 13 } },
            { attr: { r: 18 }, duration: 0.15, ease: "power3.out", immediateRender: false }, HOP_T[i] + 0.10);
        } else {
          const isHub = HUB_ORDER.indexOf(k) >= 0;
          tl.fromTo("#n-" + k, { fill: isHub ? "#a78bfa" : "#8b7fc4", attr: { r: isHub ? 9 : 7 } },
            { fill: "#f0abfc", attr: { r: isHub ? 14 : 13 }, duration: 0.15, ease: "power3.out", immediateRender: false },
            HOP_T[i] + 0.10);
        }
      });

      // the nearest neighbours light up together with a connecting halo
      NEIGHBORS.forEach(function (k, i) {
        tl.fromTo("#n-" + k, { fill: "#8b7fc4", attr: { r: 7 } },
          { fill: "#e879f9", attr: { r: 12 }, duration: 0.24, ease: "power3.out", immediateRender: false },
          4.68 + i * 0.07);
      });
      tl.fromTo("#found-halo", { opacity: 0, attr: { r: 64 } },
        { opacity: 0.85, attr: { r: 110 }, duration: 0.34, ease: "power3.out", immediateRender: false }, 4.84);

      // chip lands
      tl.fromTo("#chip", { opacity: 0, y: 26, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.40, ease: "power4.out", immediateRender: false }, 5.00);

      // steady glow breathe on the found cluster — ends 5.20 + 2*0.24 = 5.68 (< 5.70)
      tl.fromTo("#found-halo", { opacity: 0.85, attr: { r: 110 } },
        { opacity: 0.5, attr: { r: 104 }, duration: 0.24, repeat: 1, yoyo: true, ease: "sine.inOut", immediateRender: false },
        5.20);

      // Final fade FINISHES at exactly 6.000 (5.70 + 0.30), zero buffer.
      // Content + grain fade; #bg-fill stays opaque so the beat resolves onto its own
      // dark plate. The render is opaque yuv420p, so fading the background too would
      // hand the last 9 frames to whatever backdrop the encoder flattens onto.
      tl.fromTo(["#scene", "#grain"], { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, 5.70);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
