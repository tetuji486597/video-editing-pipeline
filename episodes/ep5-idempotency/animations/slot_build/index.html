<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>build</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: "Helvetica Neue", -apple-system, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* raised band, kept clear of the caption zone (captions sit ~y1560+) */
      #stage {
        position: absolute;
        left: 60px;
        top: 1040px;
        width: 960px;
        height: 340px;
        overflow: hidden;
        display: flex;
        align-items: center;
      }

      #glow {
        position: absolute;
        left: 230px;
        top: 50%;
        width: 380px;
        height: 380px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(16,185,129,0.5) 0%, rgba(16,185,129,0.15) 40%, rgba(16,185,129,0) 68%);
        opacity: 0;
        filter: blur(2px);
      }

      #ticketWrap {
        position: absolute;
        left: 40px;
        top: 30px;
        width: 280px;
        height: 297px;
        opacity: 0;
        filter: drop-shadow(0 14px 30px rgba(0,0,0,0.7));
      }
      #ticketWrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #keyChip {
        position: absolute;
        left: 380px;
        top: 108px;
        width: 540px;
        opacity: 0;
      }
      #keyLabel {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #6ee7b7;
        text-transform: uppercase;
        text-shadow: 0 2px 10px rgba(0,0,0,0.85);
        margin-bottom: 12px;
      }
      #keyCode {
        font-family: "SF Mono", "Menlo", monospace;
        font-size: 40px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 1px;
        background: rgba(16,185,129,0.16);
        border: 2px solid rgba(110,231,183,0.7);
        border-radius: 14px;
        padding: 12px 22px;
        display: inline-block;
        box-shadow: 0 0 30px rgba(16,185,129,0.35);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.20" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="4.20" data-track-index="1">
        <div id="stage">
          <div id="glow"></div>
          <div id="ticketWrap"><img src="assets/ticket.png" alt="" /></div>
          <div id="keyChip">
            <div id="keyLabel">Idempotency Key</div>
            <div id="keyCode">idk_7f2a9c3d</div>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#ticketWrap", { rotation: -8, scale: 0.85 });

      tl.to("#glow", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.05)
        .to("#ticketWrap", { opacity: 1, rotation: -4, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, 0.1)
        .to("#keyChip", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.55)
        .fromTo("#keyCode", { scale: 0.9 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.6)
        .to(["#glow", "#ticketWrap", "#keyChip"], { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.85);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
