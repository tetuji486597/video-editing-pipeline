<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>payoff</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: "Helvetica Neue", -apple-system, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      #band {
        position: absolute;
        left: 60px;
        top: 944px;
        width: 960px;
        height: 420px;
        overflow: hidden;
      }
      #accent-bar {
        position: absolute;
        left: 0;
        top: 8px;
        width: 8px;
        height: 250px;
        background: #10b981;
        border-radius: 4px;
        box-shadow: 0 0 24px 4px rgba(16, 185, 129, 0.85), 0 0 60px 10px rgba(16, 185, 129, 0.4);
        opacity: 0;
        transform-origin: top;
      }
      #text-block {
        position: absolute;
        left: 48px;
        top: 8px;
        width: 880px;
      }
      .emph {
        display: block;
        font-size: 64px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.5px;
        line-height: 1.1;
        text-shadow: 0 3px 14px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6);
        opacity: 0;
        transform: translateY(24px);
      }
      #next {
        display: block;
        margin-top: 26px;
        font-size: 26px;
        font-weight: 700;
        color: #6ee7b7;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.60" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="3.60" data-track-index="1">
        <div id="band">
          <div id="accent-bar"></div>
          <div id="text-block">
            <div class="emph" id="l1">Press it twice.</div>
            <div class="emph" id="l2">Pay once.</div>
            <div id="next">Next: how WhatsApp delivers in one second</div>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#accent-bar", { opacity: 1, scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.05)
        .to("#l1", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15)
        .to("#l2", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.45)
        .to("#next", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.95)
        .to(["#accent-bar", "#l1", "#l2", "#next"], { opacity: 0, duration: 0.28, ease: "power1.in" }, 3.25);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
