<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>hook</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: "Helvetica Neue", -apple-system, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      #band {
        position: absolute;
        left: 60px;
        top: 900px;
        width: 960px;
        height: 460px;
        overflow: hidden;
      }
      #accent-bar {
        position: absolute;
        left: 0;
        top: 8px;
        width: 8px;
        height: 280px;
        background: #10b981;
        border-radius: 4px;
        box-shadow: 0 0 24px 4px rgba(16, 185, 129, 0.85), 0 0 60px 10px rgba(16, 185, 129, 0.4);
        opacity: 0;
        transform-origin: top;
      }
      #icon {
        position: absolute;
        left: 48px;
        top: 0;
        width: 60px;
        height: 60px;
        opacity: 0;
      }
      #text-block {
        position: absolute;
        left: 48px;
        top: 78px;
        width: 880px;
      }
      .line {
        display: block;
        font-size: 34px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        line-height: 1.3;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.85), 0 1px 3px rgba(0, 0, 0, 0.95);
        opacity: 0;
        transform: translateY(30px);
      }
      .emph {
        display: block;
        margin-top: 16px;
        font-size: 60px;
        font-weight: 800;
        color: #10b981;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        line-height: 1.05;
        text-shadow: 0 0 30px rgba(16, 185, 129, 0.85), 0 4px 12px rgba(0, 0, 0, 0.9);
        opacity: 0;
      }
      .joiner {
        display: block;
        margin-top: 10px;
        font-size: 26px;
        font-weight: 700;
        color: #cbd5e1;
        letter-spacing: 2px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.30" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="3.30" data-track-index="1">
        <div id="band">
          <div id="accent-bar"></div>
          <svg id="icon" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
            <circle cx="30" cy="30" r="16" fill="none" stroke="#10b981" stroke-width="3.5" />
            <circle cx="30" cy="30" r="24" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.55" />
            <circle cx="30" cy="30" r="32" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.3" />
          </svg>
          <div id="text-block">
            <div class="line" id="l1">YOU DOUBLE-TAPPED "PAY."</div>
            <div class="emph" id="e1">CHARGED ONCE.</div>
            <div class="joiner" id="j1">HERE'S</div>
            <div class="emph" id="e2" style="color:#ffffff; text-shadow:0 0 30px rgba(255,255,255,0.5), 0 4px 12px rgba(0,0,0,0.9);">THE SAFETY NET.</div>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#accent-bar", { opacity: 1, scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.05)
        .fromTo("#icon", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.1)
        .to("#l1", { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.2)
        .fromTo("#e1", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 0.55)
        .to("#j1", { opacity: 1, duration: 0.2, ease: "power2.out" }, 0.85)
        .fromTo("#e2", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 1.0)
        .to(["#accent-bar", "#icon", "#l1", "#e1", "#j1", "#e2"], { opacity: 0, duration: 0.28, ease: "power1.in" }, 2.95);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
