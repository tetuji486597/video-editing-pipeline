<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP20 TikTok-style Title Box (variant B cold open — hook sticker)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* Variant B is a COLD OPEN (no intro take exists), so the sticker carries the hook
         text and holds over the HOOK beat, running SIMULTANEOUSLY with slot_hook.
         Division of the frame, in absolute pixels (both compositions checked pairwise):
           this sticker owns the top:  boxes y=220-530 (+shadow reach to y=554)
           slot_hook owns the lower band: chat panel y=960-1272 (glow reach up to ~936)
           gap between the two = 936 - 554 = 382px -- no collision.
         User feedback fix: stack CENTRED ON x=540 (true frame centre, left:0;right:0 +
         flex centring), font 66 -> 56 so the widest line ("AI COULDN'T COUNT", text
         ~575px + 48px padding = ~623px box) ends by 540 + 312*1.012(drift) = ~856 <= 870.
         HOOK-shot framing: hair top ~y=170, brow ~y=710, chin ~y=1140. Sticker bottom 530
         clears the brow by ~170px at worst zoom (brow 710 -> ~700 at scale 1.045). */
      #stack {
        position: absolute;
        left: 0;
        right: 0;                 /* full-width flex column -> boxes centre on x=540 */
        top: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        opacity: 0.6;             /* frame-0 state from CSS */
        transform: scale(0.94);
        transform-origin: 50% 12%;
      }
      .tt-line {
        background: #ffffff;
        color: #111111;
        font-size: 56px;
        line-height: 56px;
        font-weight: 800;
        letter-spacing: -1px;
        padding: 18px 24px 20px 24px;
        border-radius: 16px;
        white-space: nowrap;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.22);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6.5"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="6.5"
        data-track-index="1"
      >
        <div id="stack">
          <!-- Widest line ("AI COULDN'T COUNT") at 56px Inter 800 ~= 623px -> x ~229-851
               centred on 540, inside x<=870. Boxes (h 94): y 220-314 / 328-422 / 436-530. -->
          <div class="tt-line">AI COULDN'T COUNT</div>
          <div class="tt-line">THE R'S IN</div>
          <div class="tt-line">&quot;STRAWBERRY&quot;</div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#stack",
        { opacity: 0.6, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" },
        0
      );

      // Anti-static drift for the motion linter; fromTo to avoid the transform conflict.
      tl.fromTo(
        "#stack",
        { scale: 1 },
        { scale: 1.012, duration: 5.94, ease: "none", immediateRender: false },
        0.28
      );

      // Fade FINISHES at exactly data-duration: 6.22 + 0.28 = 6.500.
      // B's HOOK beat runs 0-6.7917; fully out ~0.29s before PROBLEM starts at 6.7917.
      tl.fromTo(
        "#stack",
        { opacity: 1 },
        { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false },
        6.22
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
