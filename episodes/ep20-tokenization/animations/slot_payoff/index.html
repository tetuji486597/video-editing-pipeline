<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP20 PAYOFF — strawberry splits into chunks with IDs (transparent band)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;   /* pure linework over live footage, no opaque fill */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      #fade-wrap { position: absolute; inset: 0; }

      /* UPPER BAND. PAYOFF framing: hair top ~210, brow ~710 (=> ~699 at max zoom).
         All content y 340-604 (incl glow reach), clearing the brow by ~95px. */

      /* The word: two halves, JetBrains Mono 96px (char width 57.6px).
         "straw" x 172-460, "berry" x 460-748; the halves separate +-46px on the split. */
      .half {
        position: absolute;
        top: 380px;
        height: 96px;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 96px;
        line-height: 96px;
        font-weight: 700;
        /* outline look via stroke + translucent amber gradient fill (background-clip:
           text) — the lint's sanctioned pattern; a bare transparent fill errors */
        color: transparent;
        -webkit-text-stroke: 2.5px #fbbf24;
        white-space: pre;
        text-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
      }
      /* the gradient fill must live on the element that carries the glyphs (the spans) */
      .half .pch {
        background: linear-gradient(180deg, rgba(251, 191, 36, 0.5), rgba(245, 158, 11, 0.22));
        -webkit-background-clip: text;
        background-clip: text;
      }
      #hl { left: 172px; }
      #hr { left: 460px; }
      .half .pch { opacity: 0; }
      /* frame-0 must carry visible content: the chip SVG is the wrapper's first CHILD,
         so target the first span-of-type (caught by check_fade on the rendered file) */
      #hl span.pch:first-of-type { opacity: 0.5; }

      /* outline chip rects drawn around each half after the split */
      .chipsvg {
        position: absolute;
        left: -26px; top: -22px;
        width: 340px; height: 140px;
        opacity: 0;
        filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.45));
      }
      .chipsvg rect {
        fill: rgba(245, 158, 11, 0.07);
        stroke: #f59e0b;
        stroke-width: 3;
      }

      /* small ID tags under the chips (real captured values, see report) */
      .idtag {
        position: absolute;
        top: 545px;
        height: 40px;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 30px;
        line-height: 30px;
        color: #fde8c4;
        padding: 4px 14px 6px 14px;
        border: 1.5px solid rgba(245, 158, 11, 0.7);
        border-radius: 10px;
        background: rgba(20, 14, 4, 0.30);
        opacity: 0;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
      }
      #tagl { left: 193px; }   /* centred under the settled "straw" chip */
      #tagr { left: 564px; }   /* centred under the settled "berry" chip */

      /* the split blade (real-bbox div) */
      #blade {
        position: absolute;
        left: 458px; top: 340px;
        width: 5px; height: 180px;
        background: linear-gradient(to bottom, rgba(255,255,255,0.95), rgba(251,191,36,0.9));
        border-radius: 3px;
        box-shadow: 0 0 14px rgba(251, 191, 36, 0.8);
        opacity: 0;
        transform: scaleY(0);
        transform-origin: 50% 0%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.2"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="5.2"
        data-track-index="1"
      >
        <div id="fade-wrap">
          <div class="half" id="hl"><svg class="chipsvg" viewBox="0 0 340 140"><rect id="rl" x="4" y="4" width="332" height="132" rx="18"/></svg><span class="pch">s</span><span class="pch">t</span><span class="pch">r</span><span class="pch">a</span><span class="pch">w</span></div>
          <div class="half" id="hr"><svg class="chipsvg" viewBox="0 0 340 140"><rect id="rr" x="4" y="4" width="332" height="132" rx="18"/></svg><span class="pch">b</span><span class="pch">e</span><span class="pch">r</span><span class="pch">r</span><span class="pch">y</span></div>

          <div class="idtag" id="tagl">ID 1618</div>
          <div class="idtag" id="tagr">ID 19772</div>

          <div id="blade"></div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });

      // chip rect draw setup (deterministic, measured at load)
      ["rl", "rr"].forEach((id) => {
        const r = document.getElementById(id);
        const per = 2 * (332 + 132) + 2 * Math.PI * 18;
        r.style.strokeDasharray = String(per);
        r.style.strokeDashoffset = String(per);
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- ACT 1: the word draws itself (entrance at t=0) ----------
      // first char starts at CSS opacity 0.5, so frame 0 is never blank
      tl.to(".pch", { opacity: 1, duration: 0.25, ease: "power2.out", stagger: 0.07 }, 0);
      // subtle glow settle on the whole word
      tl.fromTo("#fade-wrap", { opacity: 0.85 },
        { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);

      // ---------- TURN @1.25: one clean split — lands on "chunks with ID numbers" ------
      tl.fromTo("#blade", { opacity: 1, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, 1.25);
      tl.to("#blade", { opacity: 0, duration: 0.22, ease: "power2.out" }, 1.41);

      tl.to("#hl", { x: -46, duration: 0.5, ease: "power3.out" }, 1.35);
      tl.to("#hr", { x: 46, duration: 0.5, ease: "power3.out" }, 1.35);

      // the two chip outlines draw as one composed gesture (same kind, overlapping)
      tl.fromTo("#hl .chipsvg", { opacity: 0 },
        { opacity: 1, duration: 0.12, immediateRender: false }, 1.5);
      tl.to("#rl", { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 1.52);
      tl.fromTo("#hr .chipsvg", { opacity: 0 },
        { opacity: 1, duration: 0.12, immediateRender: false }, 1.7);
      tl.to("#rr", { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 1.72);

      // ---------- ACT 2: the IDs land, then the chips breathe ----------
      tl.fromTo("#tagl", { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 2.0);
      tl.fromTo("#tagr", { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 2.6);

      // gentle float on the halves: 3.0 + 4*0.4 = 4.6, complete before the fade at 4.9
      tl.to(".half", { y: "-=5", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 3.0);
      // one glow breath on the chips: 3.2 + 2*0.55 = 4.3 < 4.9
      tl.to(".chipsvg", {
        filter: "drop-shadow(0 0 16px rgba(245,158,11,0.8))",
        duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 1,
      }, 3.2);

      // ---------- fade: finishes at EXACTLY 5.2, zero buffer ----------
      // (NO tease chip anywhere in this composition — series payoff convention)
      tl.fromTo("#fade-wrap", { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 4.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
