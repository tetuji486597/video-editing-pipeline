<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP20 TikTok-style Title Box (variant A)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;   /* never a takeover -- the presenter stays visible */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* TikTok-native sticker: each wrapped line is its own white rounded box (EP19
         reference). User feedback fix: the stack is CENTRED ON x=540, the true frame
         centre (left:0; right:0 + flex centring), not x=480. Font 66 -> 56 so the widest
         line ("MASTERING SYSTEM", text ~582px + 48px padding = ~630px box) ends by
         x = 540 + 315*1.01(drift max) = ~858 <= 870, keeping the border margin.
         Measured intro framing for THIS shot: hair top ~y=200, brow ~y=680, chin ~y=1040.
         Stack y=220-530 (3 boxes of 94 + 2*14 gap) sits over hair/background and clears
         the worst-case brow (~667 at zoom max) by ~137px. */
      #stack {
        position: absolute;
        left: 0;
        right: 0;                 /* full-width flex column -> boxes centre on x=540 */
        top: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        /* Frame-0 state from CSS -- tl.set() at position 0 never fires in this renderer,
           and the primary entrance must not be at opacity 0 on frame 0. */
        opacity: 0.6;
        transform: scale(0.94);
        transform-origin: 50% 12%;
      }
      .tt-line {
        background: #ffffff;
        color: #111111;
        font-size: 56px;
        line-height: 56px;
        font-weight: 800;
        letter-spacing: -1px;
        padding: 18px 24px 20px 24px;
        border-radius: 16px;
        white-space: nowrap;      /* each line is authored; never let it re-wrap */
        /* soft settle shadow; reach 1.6*14=22px -> top box reaches y=220+2-22=200 > 180 */
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.22);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.8"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="4.8"
        data-track-index="1"
      >
        <div id="stack">
          <!-- Widest line at 56px Inter 800 resolves to ~630px -> x ~225-855 centred on
               540, inside x<=870. Boxes (h 94): y 220-314 / 328-422 / 436-530. -->
          <div class="tt-line">MASTERING SYSTEM</div>
          <div class="tt-line">DESIGN:</div>
          <div class="tt-line">EPISODE 20</div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // One sticker, lands as a unit (multi-line lockup basis, same as EP19).
      tl.fromTo(
        "#stack",
        { opacity: 0.6, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" },
        0
      );

      // Imperceptible drift so the motion linter's seek check sees the timeline advance
      // (a truly static sticker invalidates every verdict on the run). fromTo, not to:
      // a .to() against the CSS transform trips gsap_css_transform_conflict.
      tl.fromTo(
        "#stack",
        { scale: 1 },
        { scale: 1.01, duration: 4.24, ease: "none", immediateRender: false },
        0.28
      );

      // Fade FINISHES at exactly data-duration, zero buffer: 4.52 + 0.28 = 4.800.
      // Held over the 0-5.0s INTRO beat; fully out 0.2s before HOOK starts at 5.0.
      tl.fromTo(
        "#stack",
        { opacity: 1 },
        { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false },
        4.52
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
