<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP30 payoff — shipped, then turned on</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* PHOTO CARD, upper band: one held card built around the REAL flag row
         (LaunchDarkly capture), deliberately still apart from a slow drift and the
         two landings. PAYOFF frame grid-measured: hair top ~120, brow ~680.
         Card x 90-640, y 215-595 (no shadow -> nothing reaches the countdown
         reserve x>=670,y<=330). Drift 1 -> 1.015 about (365,405):
         x 90 -> 85.9, x 640 -> 644.1, y 215 -> 212.2, y 595 -> 597.9. Brow clear 82px. */
      #wrap { position: absolute; inset: 0; transform-origin: 365px 405px; opacity: 0.5; }

      #card {
        position: absolute; left: 90px; top: 215px; width: 550px; height: 380px;
        border-radius: 22px; background: linear-gradient(170deg, rgba(10, 14, 22, 0.92), rgba(6, 9, 15, 0.95));
        border: 2px solid rgba(148, 163, 184, 0.4); overflow: hidden;
      }
      #head {
        position: absolute; left: 0; top: 0; width: 546px; height: 44px;
        display: flex; align-items: center; gap: 8px; padding: 0 16px;
        background: rgba(30, 41, 59, 0.9); border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(148, 163, 184, 0.5); }
      #head span { font-size: 17px; color: #94a3b8; letter-spacing: 1px; margin-left: 6px; }

      /* the real flag row: local x 18-532, y 56-130 */
      #plate {
        position: absolute; left: 18px; top: 56px; width: 514px; height: 74px;
        border-radius: 10px; background: #ffffff; overflow: hidden;
        border: 2px solid rgba(148, 163, 184, 0.5);
      }
      #plate img { position: absolute; left: 2px; top: -1px; width: 1127px; height: 74px; }
      #ld-on { opacity: 0; }

      /* row 1: shipped (ghosted) local y 150-222 */
      #box { position: absolute; left: 26px; top: 152px; width: 64px; height: 64px; opacity: 0.5; }
      #shipped {
        position: absolute; left: 108px; top: 156px; font-size: 40px; line-height: 56px; font-weight: 900;
        letter-spacing: 2px; color: #94a3b8; opacity: 0;
      }
      /* row 2: turned on local y 246-318 */
      #mini {
        position: absolute; left: 24px; top: 254px; width: 70px; height: 40px; border-radius: 20px;
        background: rgba(71, 85, 105, 0.9); border: 2px solid rgba(148, 163, 184, 0.5); opacity: 0;
      }
      #mknob { position: absolute; left: 3px; top: 3px; width: 30px; height: 30px; border-radius: 50%; background: #f8fafc; }
      #turned {
        position: absolute; left: 108px; top: 252px; font-size: 40px; line-height: 44px; font-weight: 900;
        letter-spacing: 2px; color: #fde68a; opacity: 0;
      }
      /* the 1% pie: local x 420-520, y 236-336; label y 342-366 */
      #pie { position: absolute; left: 420px; top: 236px; width: 100px; height: 100px; opacity: 0; }
      #pie-ring { fill: rgba(148, 163, 184, 0.1); stroke: rgba(203, 213, 225, 0.7); stroke-width: 2.5; }
      #wedge { fill: rgba(251, 191, 36, 0.4); stroke: #fbbf24; stroke-width: 3; stroke-linejoin: round; }
      #pct {
        position: absolute; left: 420px; top: 342px; width: 100px; text-align: center;
        font-size: 22px; line-height: 24px; color: #fde68a; letter-spacing: 1px; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="5.5" data-track-index="1">
        <div id="wrap">
          <div id="card">
            <div id="head"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span class="mono">checkout-v2 &middot; production</span></div>
            <div id="plate">
              <img id="ld-off" src="assets/ld_flag_toggle_off.png" alt="" data-layout-allow-overflow="true" />
              <img id="ld-on" src="assets/ld_flag_toggle_on.png" alt="" data-layout-allow-overflow="true" />
            </div>

            <svg id="box" viewBox="0 0 64 64" fill="none">
              <path id="box-body" d="M8 22 L32 10 L56 22 L56 48 L32 60 L8 48 Z" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round" fill="rgba(148,163,184,0.12)"/>
              <path id="box-lines" d="M8 22 L32 34 L56 22 M32 34 L32 60" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>
            </svg>
            <div id="shipped">SHIPPED</div>

            <div id="mini"><div id="mknob"></div></div>
            <div id="turned">TURNED ON</div>

            <div id="pie">
              <svg viewBox="0 0 100 100">
                <circle id="pie-ring" cx="50" cy="50" r="42" />
                <path id="wedge" d="M50,50 L50,8 A42,42 0 0 1 60.9,9.4 Z" />
              </svg>
            </div>
            <div id="pct" class="mono">1%</div>
          </div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const wedge = document.getElementById("wedge");
      const sw = { a: 15 };
      function setWedge(a) {
        if (a >= 359.9) { wedge.setAttribute("d", "M50,8 A42,42 0 1 1 49.9,8 Z"); return; }
        const r = ((a - 90) * Math.PI) / 180;
        const x = 50 + 42 * Math.cos(r), y = 50 + 42 * Math.sin(r);
        wedge.setAttribute("d", "M50,50 L50,8 A42,42 0 " + (a > 180 ? 1 : 0) + " 1 " + x.toFixed(1) + "," + y.toFixed(1) + " Z");
      }
      setWedge(15);

      // slow drift, the only continuous motion on this held card
      tl.fromTo("#wrap", { scale: 1 }, { scale: 1.015, duration: 5.5, ease: "sine.inOut" }, 0);

      // ---------- ACT 1: shipped, dark (entrance at t=0; "ship it dark" 42.72-43.34 out) ----------
      tl.fromTo("#wrap", { opacity: 0.5 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo("#card", { y: 24 }, { y: 0, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo("#shipped", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.25);

      // ---------- TURN @0.95 ("one percent" 43.76 out -> 0.91): turned on, for 1% ----------
      tl.fromTo("#mini", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 0.9);
      tl.fromTo("#mknob", { x: 0 }, { x: 30, duration: 0.16, ease: "power3.out", immediateRender: false }, 1.0);
      tl.to("#mini", { backgroundColor: "rgba(21,128,61,0.95)", borderColor: "rgba(74,222,128,0.8)", duration: 0.16, ease: "power2.out" }, 1.0);
      tl.fromTo("#ld-on", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, 1.02);
      tl.fromTo("#turned", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.05);
      // "of users decide" (44.14 -> 1.29): the pie with its sliver
      tl.fromTo("#pie", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.5)", immediateRender: false }, 1.65);
      tl.fromTo("#pct", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 1.8);

      // ---------- ACT 2 @2.7 ("whether the rest get it" 45.00-46.14 -> 2.15-3.29) ----------
      tl.to(sw, { a: 360, duration: 0.6, ease: "power2.inOut", onUpdate: () => setWedge(sw.a) }, 2.7);
      tl.to("#pct", { opacity: 0, duration: 0.2, ease: "power2.in" }, 2.7);
      // the shipped box lights up: the dark code is now the live one
      tl.to("#box", { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.0);
      tl.to("#box-body", { stroke: "#fde68a", fill: "rgba(251,191,36,0.18)", duration: 0.4, ease: "power2.out" }, 3.0);
      tl.to("#box-lines", { stroke: "#fde68a", duration: 0.4, ease: "power2.out" }, 3.0);
      tl.to("#shipped", { color: "#fde68a", duration: 0.4, ease: "power2.out" }, 3.0);

      // ---------- quiet hold, then fade: finishes at EXACTLY 5.5 (5.2 + 0.3), zero buffer ----------
      tl.fromTo("#wrap", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 5.2);
      ["#card", "#shipped", "#turned", "#mini", "#mknob", "#pie", "#pct"].forEach((s) => {
        tl.to(s, { opacity: 0, duration: 0.3, ease: "power2.out" }, 5.2);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
