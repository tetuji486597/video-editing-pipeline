<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP30 TikTok-style Title Box</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;   /* never a takeover -- the presenter stays visible */
      }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* TikTok's native text sticker: each WRAPPED LINE is its own white rounded box,
         the stack centred on x=540 (EP20-26 directive), every box <= 660px wide.
         Recorded intro (transcript 1.92-3.74s): "Explaining A/B testing in 30 seconds."
         EPISODE 30 / EXPLAINING A/B TESTING / IN 30 SECONDS.
         Widest line "EXPLAINING A/B TESTING" (22 chars) runs at 40px so its box lands
         under 660px (EP29 measured ~0.66 px/char/px for uppercase Inter 800:
         22 x 26.4 = ~581 + 52 padding = ~633px); measured on the render.
         Vertical: (36+42) + 12 + (40+42) + 12 + (44+42) = 270px -> y 210..480;
         drift x1.01 about the top-centre origin -> 483. INTRO frame grid-measured:
         hair top ~120, brow ~680 (zoom 1.0->1.08 about (540,720) keeps the brow
         within a few px). The stack sits over hair/forehead only, ~195px above the brow.
         This is the ONLY slot allowed inside the countdown reserve (x>=670, y<=330):
         the countdown chip starts when this sticker ends. */
      #stack {
        position: absolute;
        left: 0;
        right: 0;
        margin: 0 auto;
        top: 210px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        /* Frame-0 state from CSS -- tl.set() at position 0 never fires. */
        opacity: 0.6;
        transform: scale(0.94);
        transform-origin: 50% 0%;
      }
      .tt-line {
        background: #ffffff;
        color: #111111;
        font-size: 44px;
        line-height: 44px;
        font-weight: 800;
        letter-spacing: -1px;
        padding: 20px 26px 22px 26px;
        border-radius: 16px;
        white-space: nowrap;
        /* soft shadow only; reach 1.6*16 = ~26px, far inside every band */
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.22);
      }
      .tt-line.ep { font-size: 36px; line-height: 36px; padding: 18px 24px 20px 24px; }
      .tt-line.wide { font-size: 40px; line-height: 40px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2.0"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="scene"
        class="clip"
        data-start="0"
        data-duration="2.0"
        data-track-index="1"
      >
        <div id="stack">
          <div class="tt-line ep">EPISODE 30</div>
          <div class="tt-line wide">EXPLAINING A/B TESTING</div>
          <div class="tt-line">IN 30 SECONDS</div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // The three lines are ONE sticker -- they land together.
      tl.fromTo(
        "#stack",
        { opacity: 0.6, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" },
        0
      );

      // Imperceptible drift so the motion linter's seek check advances. fromTo, not
      // .to(), to avoid gsap_css_transform_conflict with the CSS transform.
      tl.fromTo(
        "#stack",
        { scale: 1 },
        { scale: 1.01, duration: 1.44, ease: "none", immediateRender: false },
        0.28
      );

      // Fade FINISHES at exactly data-duration, zero buffer: 1.72 + 0.28 = 2.000,
      // which is the INTRO end (2.0000) so the HOOK cut is clean.
      tl.fromTo(
        "#stack",
        { opacity: 1 },
        { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false },
        1.72
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
