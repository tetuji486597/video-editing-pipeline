<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      body {
        font-family: "Helvetica Neue", -apple-system, sans-serif;
      }

      #band {
        position: absolute;
        left: 60px;
        top: 1210px;
        width: 960px;
        height: 480px;
        overflow: hidden;
      }

      /* ---- reveal group: fingerprint + glow + scan + radiate lines ---- */
      #reveal-group {
        position: absolute;
        left: 110px;
        top: 90px;
        width: 300px;
        height: 300px;
        opacity: 0;
        transform-origin: 50% 50%;
      }

      .rim-glow {
        position: absolute;
        left: -22px;
        top: -22px;
        width: 344px;
        height: 344px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(34, 211, 238, 0.0) 55%,
          rgba(34, 211, 238, 0.28) 72%,
          rgba(34, 211, 238, 0.0) 86%
        );
      }

      .grain-dither {
        position: absolute;
        left: -22px;
        top: -22px;
        width: 344px;
        height: 344px;
        border-radius: 50%;
        opacity: 0.07;
        pointer-events: none;
      }

      .fp-circle {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        overflow: hidden;
        background-color: rgba(8, 20, 24, 0.55);
        background-image: url("assets/image_010.jpg");
        background-repeat: no-repeat;
        background-size: 564px 300px;
        background-position: -132px 0px;
        box-shadow:
          inset 0 0 0 2px rgba(34, 211, 238, 0.65),
          inset 0 0 26px rgba(34, 211, 238, 0.35);
        filter: grayscale(0.6) sepia(0.25) hue-rotate(140deg) saturate(1.5)
          brightness(1.05) contrast(1.08);
      }

      .fp-circle::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(6, 14, 17, 0) 60%,
          rgba(6, 14, 17, 0.55) 100%
        );
      }

      .scan-line {
        position: absolute;
        left: 6px;
        top: 0;
        width: 288px;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(
          90deg,
          rgba(34, 211, 238, 0) 0%,
          rgba(34, 211, 238, 0.95) 50%,
          rgba(34, 211, 238, 0) 100%
        );
        opacity: 0;
      }

      .radiate-svg {
        position: absolute;
        left: -70px;
        top: -70px;
        width: 440px;
        height: 440px;
        opacity: 0;
      }

      /* ---- secondary detail: keystroke / mouse-timing waveform ---- */
      #waveform {
        position: absolute;
        left: 560px;
        top: 205px;
        width: 340px;
        height: 90px;
        display: flex;
        align-items: flex-end;
        gap: 14px;
      }

      .bar {
        width: 10px;
        border-radius: 5px;
        background: linear-gradient(180deg, #67e8f9 0%, #22d3ee 100%);
        opacity: 0;
        transform-origin: 50% 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.00"
      data-width="1080"
      data-height="1920"
    >
      <section
        id="build-clip"
        class="clip"
        data-start="0"
        data-duration="4.00"
        data-track-index="1"
      >
        <div id="band">
          <div id="reveal-group">
            <div class="rim-glow"></div>

            <div class="fp-circle"></div>

            <svg class="grain-dither" width="344" height="344" viewBox="0 0 344 344">
              <defs>
                <filter id="dither-noise-build" x="0" y="0" width="100%" height="100%">
                  <feTurbulence
                    type="fractalNoise"
                    baseFrequency="0.9"
                    numOctaves="2"
                    seed="7"
                    stitchTiles="stitch"
                    result="noise"
                  />
                  <feColorMatrix in="noise" type="saturate" values="0" />
                </filter>
                <clipPath id="dither-clip-build">
                  <circle cx="172" cy="172" r="172" />
                </clipPath>
              </defs>
              <rect
                width="344"
                height="344"
                filter="url(#dither-noise-build)"
                clip-path="url(#dither-clip-build)"
              />
            </svg>

            <div class="scan-line"></div>

            <svg class="radiate-svg" viewBox="0 0 440 440">
              <g stroke="#22d3ee" stroke-width="2" stroke-linecap="round">
                <line x1="220" y1="70" x2="220" y2="34" opacity="0.55" />
                <line x1="330" y1="103" x2="356" y2="80" opacity="0.4" />
                <line x1="368" y1="220" x2="404" y2="220" opacity="0.55" />
                <line x1="330" y1="337" x2="356" y2="360" opacity="0.4" />
                <line x1="220" y1="370" x2="220" y2="406" opacity="0.55" />
                <line x1="110" y1="337" x2="84" y2="360" opacity="0.4" />
                <line x1="72" y1="220" x2="36" y2="220" opacity="0.55" />
                <line x1="110" y1="103" x2="84" y2="80" opacity="0.4" />
              </g>
            </svg>
          </div>

          <div id="waveform">
            <div class="bar" style="height: 28px"></div>
            <div class="bar" style="height: 52px"></div>
            <div class="bar" style="height: 34px"></div>
            <div class="bar" style="height: 68px"></div>
            <div class="bar" style="height: 22px"></div>
            <div class="bar" style="height: 46px"></div>
            <div class="bar" style="height: 30px"></div>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Baseline hidden state
      tl.set("#reveal-group", { opacity: 0, scale: 0.7 }, 0);
      tl.set(".scan-line", { opacity: 0, y: -14 }, 0);
      tl.set(".radiate-svg", { opacity: 0 }, 0);
      tl.set(".bar", { opacity: 0, scaleY: 0.4 }, 0);

      // --- Beat 1: invisible-reveal lands (~t=0.4, on the word "invisible") ---
      tl.to(
        "#reveal-group",
        { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" },
        0.4
      );
      tl.to(
        ".radiate-svg",
        { opacity: 1, duration: 0.3, ease: "power3.out" },
        0.42
      );

      // scan-line sweeps top-to-bottom once across the fingerprint
      tl.fromTo(
        ".scan-line",
        { opacity: 0, y: -14 },
        { opacity: 1, duration: 0.12, ease: "power3.out" },
        0.48
      );
      tl.to(
        ".scan-line",
        { y: 308, duration: 0.55, ease: "sine.inOut" },
        0.48
      );
      tl.to(".scan-line", { opacity: 0, duration: 0.15, ease: "power3.out" }, 0.98);

      // subtle finite idle pulse on the radiating signal lines (reads as "still sensing")
      tl.to(
        ".radiate-svg",
        {
          opacity: 0.65,
          duration: 0.5,
          ease: "power3.out",
          repeat: 3,
          yoyo: true,
        },
        1.1
      );

      // --- Beat 2: secondary signal detail appears (mouse/keystroke timing) ---
      tl.to(
        ".bar",
        {
          opacity: 1,
          scaleY: 1,
          duration: 0.35,
          ease: "power3.out",
          stagger: 0.05,
        },
        1.15
      );

      // gentle finite idle pulse on the waveform bars during the hold
      tl.to(
        ".bar",
        {
          scaleY: 1.12,
          duration: 0.4,
          ease: "power3.out",
          repeat: 3,
          yoyo: true,
          stagger: 0.03,
        },
        1.85
      );

      // --- Beat 3: hold, then fade out (t=3.7 -> 4.0) ---
      tl.to(
        "#band",
        { opacity: 0, duration: 0.3, ease: "power3.out" },
        3.7
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
