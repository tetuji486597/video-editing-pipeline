<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>hook</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: "Helvetica Neue", -apple-system, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      #band {
        position: absolute;
        left: 60px;
        top: 1210px;
        width: 960px;
        height: 480px;
      }

      #accent-bar {
        position: absolute;
        left: 0;
        top: 8px;
        width: 8px;
        height: 250px;
        background: #e11d48;
        border-radius: 4px;
        box-shadow: 0 0 24px 4px rgba(225, 29, 72, 0.85), 0 0 60px 10px rgba(225, 29, 72, 0.4);
        opacity: 0;
        transform-origin: top;
      }

      #icon {
        position: absolute;
        left: 48px;
        top: 0;
        width: 64px;
        height: 64px;
        opacity: 0;
      }

      #text-block {
        position: absolute;
        left: 48px;
        top: 84px;
        width: 880px;
      }

      .line {
        display: block;
        font-size: 38px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 1px;
        text-transform: uppercase;
        line-height: 1.28;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.85), 0 1px 3px rgba(0, 0, 0, 0.95);
        opacity: 0;
        transform: translateY(36px);
      }

      #run-word {
        display: block;
        margin-top: 26px;
        font-size: 116px;
        font-weight: 800;
        color: #e11d48;
        letter-spacing: 1px;
        text-transform: uppercase;
        line-height: 1;
        text-shadow: 0 0 40px rgba(225, 29, 72, 0.9), 0 4px 14px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.95);
        opacity: 0;
        transform: scale(0.8);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.70" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="2.70" data-track-index="1">
        <div id="band">
          <div id="accent-bar"></div>
          <svg id="icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 8 L60 56 L4 56 Z" stroke="#e11d48" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" />
            <rect x="29.5" y="26" width="5" height="16" rx="2.5" fill="#e11d48" />
            <rect x="29.5" y="46" width="5" height="6" rx="2.5" fill="#e11d48" />
          </svg>
          <div id="text-block">
            <span class="line" id="line1">IF A COMPANY CAN EMAIL YOU</span>
            <span class="line" id="line2">YOUR PASSWORD...</span>
            <span id="run-word">RUN.</span>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#icon", { y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.05)
        .to("#accent-bar", { opacity: 1, duration: 0.3, ease: "power3.out" }, 0.05)
        .to("#line1", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05)
        .to("#line2", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.13)
        .to("#run-word", { opacity: 1, scale: 1.06, duration: 0.09, ease: "back.out(1.4)" }, 0.21)
        .to("#run-word", { scale: 1, duration: 0.05, ease: "power3.out" }, 0.3)
        .to(
          ["#accent-bar", "#icon", "#line1", "#line2", "#run-word"],
          { opacity: 0, duration: 0.25, ease: "power3.out" },
          2.45
        );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
