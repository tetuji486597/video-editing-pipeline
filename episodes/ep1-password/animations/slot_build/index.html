<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>build</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: "Helvetica Neue", -apple-system, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }

      /* bottom-band stage: x 60-1020 (960 wide), y 1210-1690 (480 tall) */
      #stage {
        position: absolute;
        left: 60px;
        top: 1210px;
        width: 960px;
        height: 480px;
        overflow: hidden; /* hard clamp: guarantees nothing bleeds outside the band */
      }

      #glowBg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 460px;
        height: 460px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(34,211,238,0.55) 0%, rgba(34,211,238,0.18) 38%, rgba(34,211,238,0) 68%);
        opacity: 0;
        filter: blur(2px);
      }

      #blenderSvg {
        position: absolute;
        left: 270px;
        top: 20px;
        width: 420px;
        height: 440px;
        overflow: visible;
        filter: drop-shadow(0 6px 24px rgba(0,0,0,0.85)) drop-shadow(0 0 40px rgba(0,0,0,0.6));
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.01" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="4.01" data-track-index="1">
        <div id="content">
          <div id="stage">
            <div id="glowBg"></div>

            <svg id="blenderSvg" viewBox="0 0 420 440" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <clipPath id="pitcherClip">
                  <path d="M68,32 L352,32 L282,332 L138,332 Z" />
                </clipPath>
                <linearGradient id="mushGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop id="mushStopTop" offset="0%" stop-color="#eef1f4" />
                  <stop id="mushStopBot" offset="100%" stop-color="#a7b1ba" />
                </linearGradient>
              </defs>

              <!-- motor base (back-most) -->
              <g id="base">
                <rect x="55" y="340" width="310" height="92" rx="16" fill="#14171b" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
                <rect x="63" y="342" width="294" height="5" rx="2.5" fill="#22d3ee" opacity="0.75" />
                <circle cx="135" cy="390" r="11" fill="#0a0d10" stroke="rgba(255,255,255,0.35)" stroke-width="2" />
                <circle cx="210" cy="390" r="12" fill="#0a0d10" stroke="#22d3ee" stroke-width="2.5" />
                <circle cx="285" cy="390" r="11" fill="#0a0d10" stroke="rgba(255,255,255,0.35)" stroke-width="2" />
              </g>

              <!-- blades, spinning inside the glass -->
              <g id="bladeWrap">
                <g id="bladeSpin" transform="translate(210,318)">
                  <path d="M -32,-13 L 0,0 L -32,13 Z M 32,-13 L 0,0 L 32,13 Z" fill="#22d3ee" opacity="0.9" />
                </g>
              </g>

              <!-- chaotic color-break swirl during the blend (abstract fruit color churn) -->
              <g id="swirlGroup" transform="translate(210,300)" style="opacity:0;">
                <circle id="sw1" cx="0" cy="-46" r="13" fill="#f24d63" />
                <circle id="sw2" cx="40" cy="20" r="10" fill="#ff8fa3" />
                <circle id="sw3" cx="-38" cy="24" r="11" fill="#c8283f" />
                <circle id="sw4" cx="0" cy="40" r="8" fill="#f24d63" />
              </g>

              <!-- fruit / raw password: real sourced photo, drops in whole -->
              <g id="fruitGroup" transform="translate(210,-6) scale(1)" style="opacity:0;">
                <image id="fruitImg" href="assets/image_001.png" x="-65" y="-65" width="130" height="130" transform-origin="0 0" />
              </g>

              <!-- smoothie mush, revealed after the blend: uniform, opaque, no trace of the fruit -->
              <g id="mushGlow" style="opacity:0;">
                <rect id="mush" x="68" y="150" width="284" height="182" clip-path="url(#pitcherClip)" fill="url(#mushGrad)" />
              </g>

              <!-- front glass shell: drawn on top so contents read as sitting inside the pitcher -->
              <path id="pitcherPath" d="M68,32 L352,32 L282,332 L138,332 Z" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.92)" stroke-width="3.5" />
              <path d="M90,44 L100,44 L84,300 L76,300 Z" fill="rgba(255,255,255,0.5)" />

              <!-- real glass-texture photo as a low-opacity highlight layer on top of the vector glass -->
              <image id="glassHighlight" href="assets/image_002.png" x="60" y="20" width="300" height="320"
                     clip-path="url(#pitcherClip)" preserveAspectRatio="xMidYMid slice"
                     style="opacity:0; mix-blend-mode:screen;" />
            </svg>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // initial states
      gsap.set("#mush", { transformOrigin: "50% 100%", scaleY: 0.72 });
      gsap.set("#bladeSpin", { transformOrigin: "50% 50%" });
      gsap.set("#swirlGroup", { transformOrigin: "50% 50%" });
      gsap.set("#fruitImg", { transformOrigin: "50% 50%" });

      // --- PHASE 1: fruit drops in, settles whole & recognizable (t 0.0 - 0.55) ---
      tl.to("#fruitGroup", { opacity: 1, duration: 0.1, ease: "power3.out" }, 0.0);
      tl.to("#fruitGroup", { y: 66, duration: 0.34, ease: "power2.in" }, 0.02);
      tl.to("#fruitGroup", { y: 54, scaleX: 1.08, scaleY: 0.92, duration: 0.1, ease: "power1.out", overwrite: "auto" }, 0.36);
      tl.to("#fruitGroup", { scaleX: 1, scaleY: 1, duration: 0.12, ease: "power2.out" }, 0.46);
      tl.to("#glowBg", { opacity: 0.28, duration: 0.3, ease: "power2.out" }, 0.1);

      // --- PHASE 2: blend begins (t 0.6 - 2.2) — pitcher jitter + blade spin + glow build ---
      tl.to("#pitcherPath", { x: "+=3", duration: 0.045, repeat: 34, yoyo: true, ease: "power1.inOut" }, 0.6);
      tl.to("#bladeWrap", { x: "+=3", duration: 0.045, repeat: 34, yoyo: true, ease: "power1.inOut" }, 0.6);
      tl.to("#glassHighlight", { x: "+=3", duration: 0.045, repeat: 34, yoyo: true, ease: "power1.inOut" }, 0.6);

      tl.to("#bladeSpin", { rotation: "+=360", duration: 0.24, repeat: 6, ease: "power1.inOut" }, 0.6);
      tl.to("#bladeWrap", { filter: "blur(2.5px)", opacity: 0.85, duration: 0.15, ease: "power2.out" }, 0.6);
      tl.to("#glowBg", { opacity: 0.7, duration: 0.55, ease: "power2.out" }, 0.6);
      tl.to("#glassHighlight", { opacity: 0.22, duration: 0.3, ease: "power2.out" }, 0.65);

      // fruit is pulled toward the blades: squash, blur, break apart into abstract color, then vanish
      tl.to("#fruitGroup", { y: 92, scaleX: 1.35, scaleY: 0.6, rotation: 18, duration: 0.33, ease: "power2.in" }, 0.62);
      tl.to("#fruitImg", { filter: "blur(3px)", duration: 0.3, ease: "power2.out" }, 0.75);
      tl.to("#swirlGroup", { opacity: 0.9, duration: 0.12, ease: "power2.out" }, 0.85);
      tl.to("#fruitGroup", { opacity: 0, scaleX: 0.5, scaleY: 0.5, duration: 0.35, ease: "power2.in", overwrite: "auto" }, 0.95);
      tl.to("#swirlGroup", { rotation: 300, scale: 0.15, duration: 0.85, ease: "power1.inOut" }, 0.95);
      tl.to("#swirlGroup", { opacity: 0, duration: 0.25, ease: "power2.out" }, 1.55);

      // pure blend hold: nothing recognizable, just motion (t ~1.8 - 2.2)
      tl.to("#bladeWrap", { filter: "blur(0px)", opacity: 1, duration: 0.2, ease: "power2.out" }, 2.0);

      // --- PHASE 3: mush reveal — opaque, uniform, no trace of the fruit (t 2.2 - 2.75) ---
      tl.to("#mushGlow", { opacity: 1, duration: 0.05, ease: "power1.out" }, 2.2);
      tl.to("#mush", { scaleY: 1, duration: 0.5, ease: "power3.out" }, 2.2);
      tl.to("#glassHighlight", { opacity: 0.12, duration: 0.4, ease: "power2.out" }, 2.3);
      tl.to("#glowBg", { opacity: 0.4, duration: 0.4, ease: "power2.out" }, 2.3);

      // --- PHASE 4: payoff glow at "...reverse." (t ~3.0), then holds ---
      tl.to("#mushGlow", { filter: "drop-shadow(0 0 30px rgba(34,211,238,0.9))", duration: 0.25, ease: "power2.out" }, 3.0);
      tl.to("#glowBg", { opacity: 0.65, duration: 0.25, ease: "power2.out" }, 3.0);
      tl.to("#mushGlow", { filter: "drop-shadow(0 0 10px rgba(34,211,238,0.45))", duration: 0.35, ease: "power2.out" }, 3.25);
      tl.to("#glowBg", { opacity: 0.35, duration: 0.35, ease: "power2.out" }, 3.25);

      // --- fade out (t 3.68 - 3.90, holding fully transparent through the end) ---
      tl.to("#content", { opacity: 0, duration: 0.22, ease: "power2.out" }, 3.68);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
