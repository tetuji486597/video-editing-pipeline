<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EP34 payoff — the same secret, built on both ends</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      body { font-family: Inter, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }

      /* TRANSPARENT BAND, upper band over live footage: linework + type, no opaque fill.
         PAYOFF take: brow ~640, zoom 1.0->1.08 about (540,720) -> 633.6 worst case.
         Headline x 70-565 / y 235-289 (left of the countdown reserve x>=670,y<=330);
         cups L x 110-290, R x 610-790 at y 380-580 (below the reserve's y 330 floor);
         wire between them at y 498-502. Drift 1 -> 1.012 about (450,420): top 235 ->
         232.8, right 790 -> 794.1, bottom 580 -> 581.9 (+ shadow 8+1.6*12 = 27 -> 609). */
      #wrap { position: absolute; inset: 0; transform-origin: 450px 420px; opacity: 0.5; }

      #headline {
        position: absolute; left: 78px; top: 235px; width: 560px;
        font-size: 44px; line-height: 54px; font-weight: 900; letter-spacing: 2px; color: #fde68a;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.9), 0 0 24px rgba(245, 158, 11, 0.4);
        white-space: nowrap; opacity: 0;
      }

      .cup {
        position: absolute; top: 380px; width: 180px; height: 200px;
        border: 5px solid rgba(255, 255, 255, 0.7); border-radius: 12px 12px 54px 54px;
        background: rgba(6, 10, 18, 0.22); overflow: hidden; transform-origin: 50% 100%;
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.45);
      }
      #cupL { left: 110px; } #cupR { left: 610px; }
      .liq { position: absolute; left: 0; right: 0; bottom: 0; height: 0px; background: #7a5310; }
      .liq .surf { position: absolute; left: 0; right: 0; top: 0; height: 10px; background: rgba(255, 255, 255, 0.28); }
      .swirl { position: absolute; left: 10px; top: 0px; width: 150px; height: 150px; opacity: 0; transform-origin: 50% 50%; }
      .swirl .b { position: absolute; width: 50px; height: 50px; border-radius: 50%; filter: blur(4px); }
      .swirl .b1 { left: 10px; top: 30px; background: #ff8c2a; }
      .swirl .b2 { left: 90px; top: 80px; width: 40px; height: 40px; background: #4caf50; }
      .ring { position: absolute; top: 374px; width: 192px; height: 212px; border-radius: 16px 16px 60px 60px;
              border: 4px solid #fde68a; opacity: 0; transform-origin: 50% 50%; }
      #ringL { left: 104px; } #ringR { left: 604px; }

      #wire-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      #wire { fill: none; stroke: #cbd5e1; stroke-width: 4; stroke-dasharray: 12 12; stroke-linecap: round; opacity: 0.85;
              filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8)); }

      /* the ghost key that tries to cross (CSS base at the wire's left end) */
      #ghost {
        position: absolute; left: 300px; top: 478px; width: 96px; height: 44px; border-radius: 10px;
        background: rgba(245, 158, 11, 0.18); border: 2px dashed rgba(251, 191, 36, 0.9); color: #fbbf24;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        font-size: 24px; font-weight: 800; letter-spacing: 2px; opacity: 0;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      }
      #ghost svg { width: 20px; height: 20px; }
      #block {
        position: absolute; left: 415px; top: 460px; width: 80px; height: 80px;
        font-size: 66px; font-weight: 900; color: #ef4444; line-height: 80px; text-align: center;
        text-shadow: 0 0 16px rgba(239, 68, 68, 0.7), 0 2px 8px rgba(0, 0, 0, 0.9); opacity: 0; transform-origin: 50% 50%;
      }

      /* "=" between the cups, above the wire: x 410-490, y 388-468 */
      #eq {
        position: absolute; left: 410px; top: 388px; width: 80px; height: 80px;
        font-size: 84px; font-weight: 900; color: #fde68a; line-height: 80px; text-align: center;
        text-shadow: 0 0 22px rgba(253, 230, 138, 0.6), 0 2px 10px rgba(0, 0, 0, 0.9); opacity: 0; transform-origin: 50% 50%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.0" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="5.0" data-track-index="1">
        <div id="wrap">
          <div id="headline">BUILT ON BOTH ENDS</div>

          <svg id="wire-svg" viewBox="0 0 1080 1920"><path id="wire" d="M292,500 L608,500" /></svg>

          <div class="ring" id="ringL"></div>
          <div class="ring" id="ringR"></div>
          <div class="cup" id="cupL">
            <div class="liq" id="liqL"><div class="surf"></div><div class="swirl" id="swL"><div class="b b1"></div><div class="b b2"></div></div></div>
          </div>
          <div class="cup" id="cupR">
            <div class="liq" id="liqR"><div class="surf"></div><div class="swirl" id="swR"><div class="b b1"></div><div class="b b2"></div></div></div>
          </div>

          <div id="ghost" class="mono">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="7" cy="10" r="4.5" stroke="#fbbf24" stroke-width="2.4"/><path d="M11,10 H19 M16,10 V14 M13,10 V13" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round"/></svg>
            <span>KEY</span>
          </div>
          <div id="block">&#10007;</div>
          <div id="eq">=</div>
        </div>
      </section>
    </div>

    <script>
      gsap.defaults({ lazy: false });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#wrap", { scale: 1 }, { scale: 1.012, duration: 5.0, ease: "sine.inOut" }, 0);

      // ---------- ACT 1 @0: two empty cups and the wire; a key tries to cross -- and can't ----------
      tl.fromTo("#wrap", { opacity: 0.5 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo("#cupL", { y: 20 }, { y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#cupR", { y: 20 }, { y: 0, duration: 0.4, ease: "power3.out" }, 0.12);
      // "never crosses the wire" (0.28-1.45): the ghost key sets out along the wire...
      tl.fromTo("#ghost", { opacity: 0, x: 0, y: 0 }, { opacity: 1, x: 0, y: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 0.3);
      tl.to("#ghost", { x: 60, y: 0, duration: 0.35, ease: "power1.in" }, 0.5);
      // ...and is stopped dead on "crosses" (0.57-0.95): red X, the ghost recoils and fades
      tl.fromTo("#block", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.out", immediateRender: false }, 0.85);
      tl.to("#ghost", { x: 20, y: 0, duration: 0.25, ease: "power3.out" }, 0.87);
      tl.to("#ghost", { opacity: 0, duration: 0.35, ease: "power2.out" }, 1.25);
      tl.to("#block", { opacity: 0, duration: 0.35, ease: "power2.out" }, 2.0);

      // ---------- TURN @2.35 ("builds"): both cups fill with the same colour, on their own ----------
      tl.fromTo("#liqL", { height: 0 }, { height: 140, duration: 0.9, ease: "power2.out", immediateRender: false }, 2.35);
      tl.fromTo("#liqR", { height: 0 }, { height: 140, duration: 0.9, ease: "power2.out", immediateRender: false }, 2.35);
      tl.fromTo("#swL", { opacity: 0, rotation: 0 }, { opacity: 0.8, rotation: 260, duration: 1.0, ease: "power1.inOut", immediateRender: false }, 2.4);
      tl.to("#swL", { opacity: 0, duration: 0.4, ease: "power2.out" }, 3.4);
      tl.fromTo("#swR", { opacity: 0, rotation: 0 }, { opacity: 0.8, rotation: -260, duration: 1.0, ease: "power1.inOut", immediateRender: false }, 2.4);
      tl.to("#swR", { opacity: 0, duration: 0.4, ease: "power2.out" }, 3.4);
      // "the same one" (2.67-3.17): "=" lands between them
      tl.fromTo("#eq", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 2.9);

      // ---------- ACT 2 @3.21 ("on its own"): rings and the headline ----------
      ["#ringL", "#ringR"].forEach((s) => {
        tl.fromTo(s, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, 3.25);
        tl.to(s, { opacity: 0, scale: 1.1, duration: 0.6, ease: "power2.out" }, 3.5);
      });
      tl.fromTo("#headline", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 3.4);
      // the wire gives one dim pulse: still empty (odd repeat, ends 4.1+2*0.25 = 4.6 < fade)
      tl.fromTo("#wire", { opacity: 0.85 }, { opacity: 0.35, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 4.1);

      // ---------- fade: finishes at EXACTLY 5.0 (4.7 + 0.3), zero buffer ----------
      tl.fromTo("#wrap", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 4.7);
      ["#headline", "#cupL", "#cupR", "#eq", "#ghost", "#block", "#ringL", "#ringR", "#wire"].forEach((s) => {
        tl.to(s, { opacity: 0, duration: 0.3, ease: "power2.out" }, 4.7);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
